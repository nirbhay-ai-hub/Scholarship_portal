<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B5E55">
<title>Schemes · Tribal Scholarship One</title>
<style>
:root{
  --brand:#0B5E55;--brand2:#0E7C6F;--brandsoft:#E6F2F0;
  --bg:#F4F6F8;--card:#fff;--ink:#0F172A;--muted:#64748B;--line:#E2E8F0;
  --ok:#0F9D58;--okbg:#E7F6EE;--warn:#B45309;--warnbg:#FEF3C7;
  --err:#DC2626;--errbg:#FEE2E2;--info:#1D4ED8;--infobg:#DBEAFE;
  --r:14px;--sh:0 1px 2px rgba(15,23,42,.06),0 8px 24px -14px rgba(15,23,42,.2);
  --safeb:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans Devanagari',sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
svg{display:block}

/* ============ SHELL ============ */
.app{min-height:100dvh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:50;background:var(--brand);color:#fff;
  display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:56px;
  padding-top:calc(10px + env(safe-area-inset-top,0px))}
.topbar .brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.logo{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.15);
  display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.brand-t{min-width:0}
.brand-t b{display:block;font-size:14px;line-height:1.15;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;font-weight:600}
.brand-t small{display:block;font-size:11px;opacity:.8;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;gap:4px}
.iconbtn{width:38px;height:38px;border-radius:10px;border:0;
  background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;
  cursor:pointer;position:relative}
.iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}
.iconbtn .dot-badge{position:absolute;top:6px;right:6px;width:8px;height:8px;
  border-radius:50%;background:#FBBF24;border:2px solid var(--brand)}
.sidebar{display:none}
.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:60;background:#fff;
  border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + var(--safeb));
  box-shadow:0 -4px 16px -8px rgba(15,23,42,.1)}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 2px;border-radius:10px;color:var(--muted);font-size:10.5px;
  font-weight:500;min-width:0}
.bn-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
.bn-item.active{color:var(--brand);background:var(--brandsoft)}
.bn-item span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.content{flex:1;padding:14px 14px calc(88px + var(--safeb));min-width:0}
.wrap{max-width:1200px;margin:0 auto}
@media(min-width:768px){
  .content{padding:18px 22px calc(92px + var(--safeb))}
  .bottomnav{padding:8px 12px calc(8px + var(--safeb))}
  .bn-item{font-size:11.5px}.bn-item svg{width:24px;height:24px}
}
@media(min-width:1200px){
  .app{display:grid;grid-template-columns:250px 1fr;
    grid-template-rows:auto 1fr;grid-template-areas:"top top" "side main"}
  .topbar{grid-area:top}
  .sidebar{grid-area:side;display:block;background:#fff;border-right:1px solid var(--line);
    padding:14px 12px;position:sticky;top:56px;height:calc(100dvh - 56px);overflow-y:auto}
  .sidebar .nav-title{font-size:11px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--muted);font-weight:600;padding:12px 12px 6px}
  .sidebar a{display:flex;align-items:center;gap:12px;padding:10px 12px;
    border-radius:10px;color:var(--ink);font-size:14px;font-weight:500;margin-bottom:2px}
  .sidebar a svg{width:20px;height:20px;stroke:currentColor;fill:none;
    stroke-width:1.8;flex:none}
  .sidebar a:hover{background:var(--bg)}
  .sidebar a.active{background:var(--brandsoft);color:var(--brand);font-weight:600}
  .content{grid-area:main;padding:22px 26px}
  .bottomnav{display:none}
  .wrap{max-width:1180px}
}

/* ============ COMMON ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 16px;border-radius:10px;border:1px solid transparent;background:#fff;
  color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;line-height:1.2;
  text-align:center;transition:.15s;min-height:42px}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:hover{background:#0a4f48}
.btn.ghost{background:#fff;border-color:var(--line)}
.btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn.sm{padding:8px 13px;font-size:13px;min-height:38px}
.btn.block{width:100%}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;
  stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;
  border-radius:999px;font-size:11.5px;font-weight:600;background:#F1F5F9;
  color:#334155;white-space:nowrap}
.badge.ok{background:var(--okbg);color:var(--ok)}
.badge.warn{background:var(--warnbg);color:var(--warn)}
.badge.err{background:var(--errbg);color:var(--err)}
.badge.info{background:var(--infobg);color:var(--info)}
.badge.brand{background:var(--brandsoft);color:var(--brand)}
.muted{color:var(--muted)}.sm{font-size:13px}.xs{font-size:11.5px}

/* ============ PAGE HEAD ============ */
.page-head{margin-bottom:14px}
.page-head h1{font-size:22px;font-weight:700;margin:0 0 6px}
.page-head p{color:var(--muted);font-size:13.5px;margin:0;max-width:620px}
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:12px;
  color:var(--muted);margin-bottom:8px}
.breadcrumb svg{width:12px;height:12px;stroke:currentColor;fill:none;
  stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* ============ SEARCH + FILTER ============ */
.tools{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);
  width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;
  pointer-events:none}
.search input{width:100%;padding:11px 13px 11px 40px;border:1px solid var(--line);
  border-radius:11px;background:#fff;font-size:15px;outline:0;min-height:46px;
  transition:.15s}
.search input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(11,94,85,.12)}
.search .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:28px;height:28px;border-radius:50%;background:var(--bg);border:0;
  display:none;place-items:center;cursor:pointer}
.search .clear svg{position:static;width:14px;height:14px;left:auto;top:auto;
  transform:none;stroke:var(--muted)}
.search.has-value .clear{display:grid}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;
  border-radius:999px;background:#fff;border:1px solid var(--line);
  font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;
  transition:.15s;white-space:nowrap;min-height:38px}
.chip svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.chip.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.chip .count{background:rgba(0,0,0,.08);padding:1px 6px;border-radius:999px;
  font-size:11px;font-weight:700}
.chip.active .count{background:rgba(255,255,255,.22)}

/* ============ RESULT BAR ============ */
.result-bar{display:flex;justify-content:space-between;align-items:center;
  gap:10px;font-size:13px;color:var(--muted);margin-bottom:12px;flex-wrap:wrap}
.result-bar b{color:var(--ink)}

/* ============ SCHEME GRID ============ */
.schemes{display:grid;gap:14px}
@media(min-width:700px){.schemes{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1100px){.schemes{grid-template-columns:repeat(3,1fr)}}

.scheme{background:#fff;border:1px solid var(--line);border-radius:16px;
  overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column;
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.scheme:hover{transform:translateY(-2px);border-color:#CBD5E1;
  box-shadow:0 12px 30px -14px rgba(15,23,42,.22)}
.scheme-top{padding:16px 16px 12px;border-bottom:1px solid var(--line);
  position:relative;overflow:hidden}
.scheme-top::after{content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--brand),var(--brand2))}
.scheme-ic{width:46px;height:46px;border-radius:12px;background:var(--brandsoft);
  display:grid;place-items:center;margin-bottom:12px}
.scheme-ic svg{width:24px;height:24px;stroke:var(--brand);fill:none;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.scheme-head{display:flex;justify-content:space-between;align-items:flex-start;
  gap:10px;margin-bottom:8px}
.scheme-head h3{font-size:16px;font-weight:700;margin:0;line-height:1.3;flex:1}
.scheme-for{display:flex;align-items:center;gap:5px;font-size:12px;
  color:var(--muted);font-weight:500;margin-bottom:8px}
.scheme-for svg{width:13px;height:13px;stroke:currentColor;fill:none;
  stroke-width:1.8}
.scheme-desc{font-size:13.5px;color:var(--muted);margin:0;line-height:1.5}

.scheme-mid{padding:13px 16px;display:grid;gap:10px;flex:1}
.scheme-block{}
.scheme-block h4{font-size:11px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--muted);font-weight:700;margin:0 0 6px}
.scheme-block p{margin:0;font-size:13px;line-height:1.5}
.elig-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;
  gap:5px}
.elig-list li{display:flex;gap:7px;align-items:flex-start;font-size:12.5px;
  line-height:1.45;color:#334155}
.elig-list li::before{content:"";width:5px;height:5px;border-radius:50%;
  background:var(--brand);flex:none;margin-top:6px}
.benefit-tag{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;
  background:var(--okbg);color:var(--ok);border-radius:9px;font-size:12.5px;
  font-weight:700}
.benefit-tag svg{width:14px;height:14px;stroke:currentColor;fill:none;
  stroke-width:2.2}

.scheme-foot{padding:12px 16px 14px;border-top:1px solid var(--line);
  display:grid;grid-template-columns:1fr 1fr;gap:8px}
.scheme-foot .btn{width:100%;padding:10px 8px;font-size:13px}

/* status pill in corner */
.status-pill{position:absolute;top:14px;right:14px;font-size:10.5px;
  font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  padding:3px 8px;border-radius:999px}
.status-pill.open{background:var(--okbg);color:var(--ok)}
.status-pill.closed{background:#F1F5F9;color:var(--muted)}
.status-pill.soon{background:var(--warnbg);color:var(--warn)}

/* ============ EMPTY ============ */
.empty{text-align:center;padding:50px 20px;color:var(--muted);
  background:#fff;border:1px dashed var(--line);border-radius:16px}
.empty svg{width:52px;height:52px;stroke:currentColor;fill:none;
  stroke-width:1.4;margin:0 auto 12px;opacity:.45}
.empty h3{color:var(--ink);font-size:16px;margin:0 0 6px}
.empty p{margin:0 0 14px;font-size:13.5px}

/* ============ INFO BANNER ============ */
.info-banner{display:flex;gap:12px;padding:13px 14px;border-radius:12px;
  background:var(--infobg);color:var(--info);margin-bottom:14px;
  border:1px solid #BFDBFE}
.info-banner svg{width:20px;height:20px;stroke:currentColor;fill:none;
  stroke-width:1.9;flex:none;margin-top:1px}
.info-banner p{margin:0;font-size:12.5px;line-height:1.5;color:#1E3A8A}
.info-banner b{font-weight:700}

/* ============ TOAST ============ */
.toast-wrap{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(88px + var(--safeb));z-index:300;display:flex;flex-direction:column;
  gap:8px;pointer-events:none;align-items:center;width:calc(100% - 28px);
  max-width:420px}
@media(min-width:1200px){.toast-wrap{bottom:24px}}
.toast{background:#0F172A;color:#fff;padding:11px 16px;border-radius:10px;
  font-size:13.5px;font-weight:500;box-shadow:0 10px 30px -10px rgba(0,0,0,.35);
  transition:opacity .3s;text-align:center;max-width:100%}
.toast.ok{background:var(--ok)}.toast.err{background:var(--err)}

/* JAGO FAB */
.jago-fab{position:fixed;right:14px;bottom:calc(78px + var(--safeb));
  width:54px;height:54px;border-radius:50%;
  background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;
  display:grid;place-items:center;
  box-shadow:0 10px 24px -8px rgba(11,94,85,.6);z-index:70;border:0;cursor:pointer}
.jago-fab svg{width:26px;height:26px;stroke:currentColor;fill:none;
  stroke-width:1.8}
@media(min-width:1200px){.jago-fab{bottom:26px;right:26px;width:58px;height:58px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar" id="topbar"></header>
  <aside class="sidebar" id="sidebar"></aside>
  <main class="content"><div class="wrap" id="page"></div></main>
  <nav class="bottomnav" id="bottomnav"></nav>
</div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
/* =========================================================
   ICONS
   ========================================================= */
const ICONS={
  dashboard:'<path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/>',
  schemes:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M8 4v16"/>',
  apps:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  docs:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
  pay:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',
  jago:'<circle cx="12" cy="12" r="9"/><path d="M9 10h.01M15 10h.01M9 15c1.5 1.2 4.5 1.2 6 0"/>',
  notif:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
  profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>',
  check:'<path d="M5 13l4 4L19 7"/>',
  chev:'<path d="M9 6l6 6-6 6"/>',
  chevL:'<path d="M15 6l-6 6 6 6"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  close:'<path d="M18 6L6 18M6 6l12 12"/>',
  book:'<path d="M4 19.5V5a2 2 0 0 1 2-2h11a1 1 0 0 1 1 1v15"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H18"/><path d="M20 5v14"/>',
  grad:'<path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1 2.7 3 6 3s6-2 6-3v-5"/>',
  star:'<path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/>',
  lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/>',
  bank:'<path d="M3 10l9-6 9 6"/><path d="M5 10v9h14v-9M9 19v-5h6v5"/>',
  help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7"/><path d="M12 17h.01"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/>'
};
function icon(n,cls){const p=ICONS[n]||ICONS.info;
  return `<svg class="${cls||''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`}

/* =========================================================
   HELPERS
   ========================================================= */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtMoney(n){return '₹'+Number(n||0).toLocaleString('en-IN')}
function toast(msg,type){
  const w=document.getElementById('toastWrap');
  const t=document.createElement('div');
  t.className='toast '+(type||'');t.textContent=msg;
  w.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),320)},2400);
}

/* =========================================================
   STATE
   ========================================================= */
const KEY='tso_state_v1';
function S(){try{const raw=localStorage.getItem(KEY);
  if(raw){const p=JSON.parse(raw);if(p&&p.profile)return p}}catch(e){}return null}

/* =========================================================
   SHELL
   ========================================================= */
const NAV=[
  {id:'dashboard',label:'Dashboard',icon:'dashboard',href:'dashboard.html'},
  {id:'schemes',label:'Schemes',icon:'schemes',href:'schemes.html'},
  {id:'applications',label:'Applications',icon:'apps',href:'my-applications.html'},
  {id:'documents',label:'Documents',icon:'docs',href:'document-wallet.html'},
  {id:'payments',label:'Payments',icon:'pay',href:'payment-status.html'},
  {id:'jago',label:'JAGO',icon:'jago',href:'jago.html'},
  {id:'notifications',label:'Notifications',icon:'notif',href:'notifications.html'},
  {id:'profile',label:'Profile',icon:'profile',href:'profile.html'}
];
const MOBILE_NAV=['dashboard','schemes','applications','jago','profile'];

function mountShell(active,crumb){
  const s=S();const unread=s?s.notifications.filter(n=>!n.read).length:0;
  document.getElementById('topbar').innerHTML=`
    <div class="brand">
      <span class="logo">${icon('shield')}</span>
      <span class="brand-t">
        <b>Tribal Scholarship One</b>
        <small>${esc(crumb||'Unified Scholarship Platform')}</small>
      </span>
    </div>
    <div class="top-actions">
      <a class="iconbtn" href="notifications.html" aria-label="Notifications">
        ${icon('notif')}${unread?'<span class="dot-badge"></span>':''}
      </a>
      <a class="iconbtn" href="profile.html" aria-label="Profile">${icon('user')}</a>
    </div>`;
  document.getElementById('sidebar').innerHTML=`
    <div class="nav-title">Menu</div>
    ${NAV.map(n=>`<a href="${n.href}" class="${n.id===active?'active':''}">${icon(n.icon)}<span>${n.label}</span></a>`).join('')}
    <div class="nav-title">Support</div>
    <a href="help.html">${icon('help')}<span>Help</span></a>
    <a href="settings.html">${icon('settings')}<span>Settings</span></a>
    <a href="index.html" onclick="localStorage.removeItem('tso_state_v1')">${icon('logout')}<span>Logout</span></a>`;
  document.getElementById('bottomnav').innerHTML=MOBILE_NAV.map(id=>{
    const n=NAV.find(x=>x.id===id);
    return `<a class="bn-item ${id===active?'active':''}" href="${n.href}">${icon(n.icon)}<span>${n.label}</span></a>`;
  }).join('');
  if(!document.querySelector('.jago-fab')){
    const f=document.createElement('button');
    f.className='jago-fab';f.setAttribute('aria-label','Open JAGO assistant');
    f.innerHTML=icon('jago');
    f.onclick=()=>location.href='jago.html';
    document.body.appendChild(f);
  }
}

/* =========================================================
   PAGE DATA
   ========================================================= */
const s=S();
if(!s||!s.profile){location.href='index.html'}

/* Scheme presentation layer (icons, status, category) merged with state data */
const PRESENT={
  'pre-matric':{icon:'book',category:'school',status:'open',statusLabel:'Open now'},
  'post-matric':{icon:'grad',category:'higher',status:'open',statusLabel:'Open now'},
  'top-class':{icon:'star',category:'higher',status:'open',statusLabel:'Open now'},
  'nfst':{icon:'shield',category:'fellowship',status:'open',statusLabel:'Open now'},
  'nos':{icon:'globe',category:'overseas',status:'soon',statusLabel:'Opening soon'}
};

const CATEGORIES=[
  {id:'all',label:'All Schemes',icon:'schemes'},
  {id:'school',label:'School',icon:'book'},
  {id:'higher',label:'Higher Education',icon:'grad'},
  {id:'fellowship',label:'Fellowship',icon:'shield'},
  {id:'overseas',label:'Overseas',icon:'globe'}
];

/* Determine if student already has a related application */
function relatedApp(schemeId){
  return s.applications.find(a=>a.schemeId===schemeId);
}

/* Merge schemes with presentational metadata */
const SCHEMES=s.schemes.map(sc=>({...sc,...(PRESENT[sc.id]||{icon:'schemes',category:'other',status:'open',statusLabel:'Open'})}));

let currentCat='all';
let currentSearch='';

/* =========================================================
   RENDER
   ========================================================= */
function renderCategoryChips(){
  return CATEGORIES.map(c=>{
    const count=c.id==='all'?SCHEMES.length:SCHEMES.filter(x=>x.category===c.id).length;
    return `<button class="chip ${c.id===currentCat?'active':''}" data-cat="${c.id}" type="button">
      ${icon(c.icon)}<span>${esc(c.label)}</span><span class="count">${count}</span>
    </button>`;
  }).join('');
}

function schemeCard(sc){
  const existing=relatedApp(sc.id);
  const eligShort=sc.eligibility.slice(0,3);
  return `
    <article class="scheme" data-cat="${sc.category}" data-id="${sc.id}"
             data-search="${esc((sc.name+' '+sc.short+' '+sc.for).toLowerCase())}">
      <div class="scheme-top">
        <span class="status-pill ${sc.status}">${esc(sc.statusLabel)}</span>
        <div class="scheme-ic">${icon(sc.icon)}</div>
        <div class="scheme-head">
          <h3>${esc(sc.name)}</h3>
        </div>
        <div class="scheme-for">${icon('user')} ${esc(sc.for)}</div>
        <p class="scheme-desc">${esc(sc.short)}</p>
      </div>

      <div class="scheme-mid">
        <div class="scheme-block">
          <h4>Eligibility</h4>
          <ul class="elig-list">
            ${eligShort.map(e=>`<li>${esc(e)}</li>`).join('')}
            ${sc.eligibility.length>3?`<li class="muted">+ ${sc.eligibility.length-3} more conditions</li>`:''}
          </ul>
        </div>
        <div class="scheme-block">
          <h4>Benefits</h4>
          <span class="benefit-tag">${icon('check')} ${esc(sc.benefitShort)}</span>
        </div>
      </div>

      <div class="scheme-foot">
        <a class="btn ghost" href="scheme-details.html?scheme=${sc.id}">
          View Details
        </a>
        ${existing
          ? `<a class="btn primary" href="application-details.html?id=${existing.id}">
              ${icon('apps')} Track
            </a>`
          : `<a class="btn primary" href="eligibility-check.html?scheme=${sc.id}">
              ${icon('shield')} Check
            </a>`}
      </div>
    </article>`;
}

function applyFilters(){
  const list=[...document.querySelectorAll('.scheme')];
  let visible=0;
  list.forEach(el=>{
    const catOk=currentCat==='all'||el.dataset.cat===currentCat;
    const searchOk=!currentSearch||el.dataset.search.includes(currentSearch);
    const show=catOk&&searchOk;
    el.style.display=show?'':'none';
    if(show)visible++;
  });
  const rc=document.getElementById('resultCount');
  if(rc)rc.innerHTML=`Showing <b>${visible}</b> of <b>${SCHEMES.length}</b> schemes`;
  const empty=document.getElementById('emptyState');
  if(empty)empty.style.display=visible?'none':'block';
}

function render(){
  document.getElementById('page').innerHTML=`
    <div class="page-head">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="dashboard.html">Home</a>
        ${icon('chev')}
        <span>Schemes</span>
      </nav>
      <h1>Scholarship Schemes</h1>
      <p>All five Ministry of Tribal Affairs scholarship and fellowship schemes, unified in one place. Explore eligibility, benefits and required documents.</p>
    </div>

    <div class="info-banner">
      ${icon('info')}
      <p><b>Tip:</b> Before applying, use <b>Check Eligibility</b> and the <b>Existing Scholarship</b> check to avoid conflicts with any active scholarship.</p>
    </div>

    <div class="tools">
      <div class="search" id="searchWrap">
        ${icon('search')}
        <input type="search" id="searchInput" placeholder="Search schemes by name or category…"
               aria-label="Search schemes" autocomplete="off">
        <button class="clear" type="button" id="clearSearch" aria-label="Clear search">
          ${icon('close')}
        </button>
      </div>
      <div class="chips" role="tablist" aria-label="Filter by category">
        ${renderCategoryChips()}
      </div>
    </div>

    <div class="result-bar">
      <span id="resultCount"></span>
      <a class="btn ghost sm" href="scholarship-check.html">
        ${icon('search')} Check existing scholarship
      </a>
    </div>

    <div class="schemes" id="schemeGrid">
      ${SCHEMES.map(schemeCard).join('')}
    </div>

    <div class="empty" id="emptyState" style="display:none">
      ${icon('search')}
      <h3>No schemes match your search</h3>
      <p>Try a different keyword or choose another category.</p>
      <button class="btn primary" type="button" id="resetFilters">Reset filters</button>
    </div>
  `;

  /* Wire up */
  document.querySelectorAll('.chip').forEach(ch=>{
    ch.addEventListener('click',()=>{
      document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
      ch.classList.add('active');
      currentCat=ch.dataset.cat;
      applyFilters();
    });
  });

  const si=document.getElementById('searchInput');
  const sw=document.getElementById('searchWrap');
  si.addEventListener('input',()=>{
    currentSearch=si.value.trim().toLowerCase();
    sw.classList.toggle('has-value',!!si.value);
    applyFilters();
  });
  document.getElementById('clearSearch').addEventListener('click',()=>{
    si.value='';currentSearch='';sw.classList.remove('has-value');
    applyFilters();si.focus();
  });
  document.getElementById('resetFilters').addEventListener('click',()=>{
    currentSearch='';si.value='';sw.classList.remove('has-value');
    currentCat='all';
    document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c.dataset.cat==='all'));
    applyFilters();
  });

  applyFilters();
}

mountShell('schemes','Home / Schemes');
render();
</script>
</body>
</html>
