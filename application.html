<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B5E55">
<title>New Application · Tribal Scholarship One</title>
<style>
:root{
  --brand:#0B5E55;--brand2:#0E7C6F;--brandsoft:#E6F2F0;
  --bg:#F4F6F8;--card:#fff;--ink:#0F172A;--muted:#64748B;--line:#E2E8F0;
  --ok:#0F9D58;--okbg:#E7F6EE;--warn:#B45309;--warnbg:#FEF3C7;
  --err:#DC2626;--errbg:#FEE2E2;--info:#1D4ED8;--infobg:#DBEAFE;
  --r:14px;--sh:0 1px 2px rgba(15,23,42,.06),0 8px 24px -14px rgba(15,23,42,.2);
  --safeb:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans Devanagari',sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
svg{display:block}

/* ============ SHELL ============ */
.app{min-height:100dvh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:50;background:var(--brand);color:#fff;
  display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:56px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));
}
.topbar .brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.logo{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.15);
  display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.brand-t{min-width:0}
.brand-t b{display:block;font-size:14px;line-height:1.15;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;font-weight:600}
.brand-t small{display:block;font-size:11px;opacity:.8;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;gap:4px}
.iconbtn{
  width:38px;height:38px;border-radius:10px;border:0;
  background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;
  cursor:pointer;position:relative;
}
.iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}
.iconbtn .dot-badge{position:absolute;top:6px;right:6px;width:8px;height:8px;
  border-radius:50%;background:#FBBF24;border:2px solid var(--brand)}
.sidebar{display:none}
.bottomnav{
  position:fixed;bottom:0;left:0;right:0;z-index:60;background:#fff;
  border-top:1px solid var(--line);display:flex;
  padding:6px 4px calc(6px + var(--safeb));
  box-shadow:0 -4px 16px -8px rgba(15,23,42,.1);
}
.bn-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 2px;border-radius:10px;color:var(--muted);font-size:10.5px;
  font-weight:500;min-width:0;
}
.bn-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
.bn-item.active{color:var(--brand);background:var(--brandsoft)}
.bn-item span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.content{flex:1;padding:14px 14px calc(88px + var(--safeb));min-width:0}
.wrap{max-width:900px;margin:0 auto}

@media(min-width:768px){
  .content{padding:18px 22px calc(92px + var(--safeb))}
  .bottomnav{padding:8px 12px calc(8px + var(--safeb))}
  .bn-item{font-size:11.5px}.bn-item svg{width:24px;height:24px}
}
@media(min-width:1200px){
  .app{
    display:grid;grid-template-columns:250px 1fr;
    grid-template-rows:auto 1fr;
    grid-template-areas:"top top" "side main";
  }
  .topbar{grid-area:top}
  .sidebar{
    grid-area:side;display:block;background:#fff;
    border-right:1px solid var(--line);padding:14px 12px;
    position:sticky;top:56px;height:calc(100dvh - 56px);overflow-y:auto;
  }
  .sidebar .nav-title{
    font-size:11px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--muted);font-weight:600;padding:12px 12px 6px;
  }
  .sidebar a{
    display:flex;align-items:center;gap:12px;padding:10px 12px;
    border-radius:10px;color:var(--ink);font-size:14px;font-weight:500;
    margin-bottom:2px;
  }
  .sidebar a svg{width:20px;height:20px;stroke:currentColor;fill:none;
    stroke-width:1.8;flex:none}
  .sidebar a:hover{background:var(--bg)}
  .sidebar a.active{background:var(--brandsoft);color:var(--brand);font-weight:600}
  .content{grid-area:main;padding:22px 26px}
  .bottomnav{display:none}
  .wrap{max-width:920px}
}

/* ============ COMMON ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 16px;border-radius:10px;border:1px solid transparent;
  background:#fff;color:var(--ink);font-weight:600;font-size:14px;
  cursor:pointer;line-height:1.2;text-align:center;transition:.15s;
  min-height:44px;
}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:hover{background:#0a4f48}
.btn.ghost{background:#fff;border-color:var(--line)}
.btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn.sm{padding:8px 13px;font-size:13px;min-height:38px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;
  stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.badge{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;
  border-radius:999px;font-size:11.5px;font-weight:600;background:#F1F5F9;
  color:#334155;white-space:nowrap;
}
.badge.ok{background:var(--okbg);color:var(--ok)}
.badge.warn{background:var(--warnbg);color:var(--warn)}
.badge.err{background:var(--errbg);color:var(--err)}
.badge.info{background:var(--infobg);color:var(--info)}
.badge.brand{background:var(--brandsoft);color:var(--brand)}
.badge.neutral{background:#F1F5F9;color:#475569}
.muted{color:var(--muted)}
.sm{font-size:13px}
.xs{font-size:11.5px}
.link{color:var(--brand);font-weight:600;font-size:13.5px}

/* ============ PAGE HEAD ============ */
.page-head{margin-bottom:14px}
.breadcrumb{
  display:flex;align-items:center;gap:6px;font-size:12px;
  color:var(--muted);margin-bottom:8px;flex-wrap:wrap;
}
.breadcrumb svg{width:12px;height:12px;stroke:currentColor;fill:none;
  stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.page-head h1{font-size:22px;font-weight:700;margin:0 0 6px}
.page-head p{color:var(--muted);font-size:13.5px;margin:0;max-width:640px}

/* ============ HERO ============ */
.app-hero{
  background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;
  border-radius:16px;padding:18px;margin-bottom:14px;position:relative;
  overflow:hidden;
}
.app-hero::before{
  content:"";position:absolute;top:-40px;right:-40px;width:180px;height:180px;
  border-radius:50%;background:rgba(255,255,255,.06);
}
.app-hero .h-back{
  display:inline-flex;align-items:center;gap:6px;
  color:rgba(255,255,255,.9);font-size:12.5px;font-weight:600;
  margin-bottom:12px;position:relative;z-index:1;
}
.app-hero .h-back svg{width:15px;height:15px;stroke:currentColor;fill:none;
  stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.app-hero .h-row{
  display:flex;gap:14px;align-items:center;position:relative;z-index:1;
}
.app-hero .h-ic{
  width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.15);
  display:grid;place-items:center;flex:none;
}
.app-hero .h-ic svg{width:26px;height:26px;stroke:#fff;fill:none;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.app-hero h1{font-size:19px;margin:0 0 4px;font-weight:700;line-height:1.25}
.app-hero .h-sub{font-size:12.5px;opacity:.9;margin:0}
.app-hero .h-meta{
  display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;
  position:relative;z-index:1;
}
.app-hero .h-meta .pill{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.15);padding:6px 11px;
  border-radius:999px;font-size:11.5px;font-weight:600;
}
.app-hero .h-meta .pill svg{width:13px;height:13px;stroke:currentColor;
  fill:none;stroke-width:1.9}

/* ============ INFO BANNERS ============ */
.info-banner{
  display:flex;gap:12px;padding:13px 14px;border-radius:12px;
  margin-bottom:14px;border:1px solid;
}
.info-banner svg{width:20px;height:20px;stroke:currentColor;fill:none;
  stroke-width:1.9;flex:none;margin-top:1px}
.info-banner p{margin:0;font-size:12.5px;line-height:1.55}
.info-banner b{font-weight:700}
.info-banner.info{background:var(--infobg);color:var(--info);border-color:#BFDBFE}
.info-banner.info p{color:#1E3A8A}
.info-banner.warn{background:var(--warnbg);color:var(--warn);border-color:#FCD34D}
.info-banner.warn p{color:#78350F}
.info-banner.brand{background:var(--brandsoft);color:var(--brand);border-color:#B7D8D3}
.info-banner.brand p{color:#0B5E55}

/* ============ PROGRESS ============ */
.prog-card{
  background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:16px;margin-bottom:14px;box-shadow:var(--sh);
}
.prog-top{
  display:flex;justify-content:space-between;align-items:center;
  gap:10px;margin-bottom:10px;flex-wrap:wrap;
}
.prog-top .p-l{font-size:13px;font-weight:600;color:var(--muted)}
.prog-top .p-l b{color:var(--ink);font-size:15px;display:block}
.prog-top .p-r{text-align:right}
.prog-top .p-r b{font-size:22px;font-weight:700;color:var(--brand);
  line-height:1;display:block}
.prog-top .p-r small{font-size:11px;color:var(--muted)}
.progress{height:9px;border-radius:99px;background:#E2E8F0;overflow:hidden}
.progress>span{
  display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--brand),var(--brand2));
  transition:width .4s ease;
}
.prog-stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;
}
.prog-stat{
  text-align:center;padding:10px 6px;background:var(--bg);border-radius:10px;
}
.prog-stat b{display:block;font-size:16px;font-weight:700;color:var(--ink);
  line-height:1.15}
.prog-stat small{font-size:10.5px;color:var(--muted);display:block;
  margin-top:2px;line-height:1.25}

/* ============ STEPPER ============ */
.stepper{
  background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:16px;margin-bottom:14px;box-shadow:var(--sh);
}
.stepper h2{
  font-size:15px;font-weight:700;margin:0 0 14px;
  display:flex;align-items:center;gap:9px;
}
.stepper h2 svg{width:18px;height:18px;stroke:var(--brand);fill:none;
  stroke-width:1.9}
.step-list{list-style:none;padding:0;margin:0}
.step{
  display:grid;grid-template-columns:44px 1fr;gap:14px;
  padding-bottom:18px;position:relative;
}
.step:last-child{padding-bottom:0}
.step::before{
  content:"";position:absolute;left:21px;top:44px;bottom:0;width:2px;
  background:var(--line);
}
.step:last-child::before{display:none}
.step.complete::before{background:var(--brand)}
.step .s-num{
  width:44px;height:44px;border-radius:50%;background:#fff;
  border:2px solid var(--line);display:grid;place-items:center;
  font-weight:700;font-size:15px;color:var(--muted);flex:none;
  position:relative;z-index:1;transition:.2s;
}
.step.complete .s-num{background:var(--brand);border-color:var(--brand);
  color:#fff}
.step.inprogress .s-num{background:var(--warnbg);border-color:#F59E0B;
  color:var(--warn)}
.step .s-body{min-width:0;padding-top:2px}
.step .s-head{
  display:flex;justify-content:space-between;align-items:flex-start;
  gap:10px;margin-bottom:4px;flex-wrap:wrap;
}
.step .s-head b{font-size:14.5px;font-weight:700;line-height:1.3}
.step .s-desc{
  font-size:12.5px;color:var(--muted);line-height:1.5;margin:0 0 10px;
}
.step .s-meta{
  display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;
  font-size:11.5px;color:var(--muted);
}
.step .s-meta .m-item{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--bg);padding:3px 8px;border-radius:6px;font-weight:500;
}
.step .s-meta .m-item svg{width:12px;height:12px;stroke:currentColor;
  fill:none;stroke-width:2}
.step .s-actions{display:flex;gap:8px;flex-wrap:wrap}
.step .s-actions .btn{padding:8px 14px;font-size:13px;min-height:38px}

/* ============ REVIEW ============ */
.review-card{
  background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:16px;margin-bottom:14px;box-shadow:var(--sh);
}
.review-card h2{
  font-size:15px;font-weight:700;margin:0 0 14px;
  display:flex;align-items:center;gap:9px;
}
.review-card h2 svg{width:18px;height:18px;stroke:var(--brand);fill:none;
  stroke-width:1.9}
.review-block{
  border:1px solid var(--line);border-radius:11px;padding:13px;
  margin-bottom:10px;
}
.review-block:last-of-type{margin-bottom:0}
.review-block .rb-h{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  margin-bottom:10px;
}
.review-block .rb-h b{font-size:13.5px;font-weight:700;
  display:flex;align-items:center;gap:8px}
.review-block .rb-h b svg{width:15px;height:15px;stroke:var(--brand);
  fill:none;stroke-width:2}
.review-kv{
  display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;
}
@media(max-width:440px){.review-kv{grid-template-columns:1fr}}
.review-kv>div small{
  display:block;font-size:11px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.03em;font-weight:600;margin-bottom:1px;
}
.review-kv>div b{font-size:13px;font-weight:600;color:var(--ink);
  word-break:break-word}

.declaration{
  display:flex;gap:11px;align-items:flex-start;padding:13px;
  background:var(--brandsoft);border-radius:11px;
  border:1px solid #B7D8D3;margin-bottom:14px;cursor:pointer;
  font-size:13px;line-height:1.5;color:#0B5E55;
}
.declaration input{
  width:18px;height:18px;margin-top:2px;flex:none;accent-color:var(--brand);
  min-height:auto;padding:0;
}

/* ============ SUBMIT BAR ============ */
.submit-bar{
  display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;
}
.submit-bar .btn{flex:1;min-width:140px}

/* ============ EXISTING BANNER ============ */
.existing-card{
  background:#fff;border:1.5px solid var(--warn);border-radius:14px;
  padding:16px;margin-bottom:14px;box-shadow:var(--sh);
}
.existing-card .ec-h{
  display:flex;gap:12px;align-items:flex-start;margin-bottom:12px;
}
.existing-card .ec-ic{
  width:40px;height:40px;border-radius:11px;background:var(--warnbg);
  display:grid;place-items:center;flex:none;
}
.existing-card .ec-ic svg{width:22px;height:22px;stroke:var(--warn);
  fill:none;stroke-width:1.9}
.existing-card .ec-h b{display:block;font-size:14.5px;font-weight:700;
  margin-bottom:3px;color:#78350F}
.existing-card .ec-h small{font-size:12.5px;color:var(--muted);
  line-height:1.4;display:block}
.existing-card .ec-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ============ EMPTY / NOT FOUND ============ */
.notfound{
  text-align:center;padding:50px 20px;background:#fff;
  border:1px dashed var(--line);border-radius:16px;
}
.notfound svg{width:52px;height:52px;stroke:var(--muted);fill:none;
  stroke-width:1.4;margin:0 auto 12px;opacity:.5}
.notfound h3{color:var(--ink);font-size:16px;margin:0 0 6px}
.notfound p{margin:0 0 16px;font-size:13.5px;color:var(--muted)}

/* ============ TOAST ============ */
.toast-wrap{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(88px + var(--safeb));z-index:300;
  display:flex;flex-direction:column;gap:8px;pointer-events:none;
  align-items:center;width:calc(100% - 28px);max-width:420px;
}
@media(min-width:1200px){.toast-wrap{bottom:24px}}
.toast{
  background:#0F172A;color:#fff;padding:11px 16px;border-radius:10px;
  font-size:13.5px;font-weight:500;
  box-shadow:0 10px 30px -10px rgba(0,0,0,.35);
  transition:opacity .3s;text-align:center;max-width:100%;
}
.toast.ok{background:var(--ok)}
.toast.err{background:var(--err)}
.toast.warn{background:var(--warn)}

/* JAGO FAB */
.jago-fab{
  position:fixed;right:14px;bottom:calc(78px + var(--safeb));
  width:54px;height:54px;border-radius:50%;
  background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;
  display:grid;place-items:center;
  box-shadow:0 10px 24px -8px rgba(11,94,85,.6);
  z-index:70;border:0;cursor:pointer;
}
.jago-fab svg{width:26px;height:26px;stroke:currentColor;fill:none;
  stroke-width:1.8}
@media(min-width:1200px){
  .jago-fab{bottom:26px;right:26px;width:58px;height:58px}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar" id="topbar"></header>
  <aside class="sidebar" id="sidebar"></aside>
  <main class="content"><div class="wrap" id="page"></div></main>
  <nav class="bottomnav" id="bottomnav"></nav>
</div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
/* =========================================================
   ICONS
   ========================================================= */
const ICONS = {
  dashboard:'<path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/>',
  schemes:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M8 4v16"/>',
  apps:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  docs:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',

  jago:'<circle cx="12" cy="12" r="9"/><path d="M9 10h.01M15 10h.01M9 15c1.5 1.2 4.5 1.2 6 0"/>',
  notif:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
  profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>',
  check:'<path d="M5 13l4 4L19 7"/>',
  chev:'<path d="M9 6l6 6-6 6"/>',
  chevL:'<path d="M15 6l-6 6 6 6"/>',
  chevD:'<path d="M6 9l6 6 6-6"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  close:'<path d="M18 6L6 18M6 6l12 12"/>',
  book:'<path d="M4 19.5V5a2 2 0 0 1 2-2h11a1 1 0 0 1 1 1v15"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H18"/><path d="M20 5v14"/>',
  grad:'<path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1 2.7 3 6 3s6-2 6-3v-5"/>',
  star:'<path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/>',
  calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/>',

  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({

  }[c]));
}

  t.className = 'toast ' + (type || '');
  t.textContent = msg;

  setTimeout(() => {

    setTimeout(() => t.remove(), 320);
  }, 2400);
}

function stepState(id){
  if(id === 'review'){
    return (draft.completed.personal && draft.completed.academic &&
            draft.completed.documents && draft.completed.verification)
      ? 'complete' : 'pending';
  }
  if(draft.completed[id]) return 'complete';
  // In-progress if some data exists
  if(id === 'personal' && draft.personal && draft.personal.firstName) return 'inprogress';
  if(id === 'academic' && draft.academic && draft.academic.institution) return 'inprogress';
  if(id === 'documents' && draft.documents && draft.documents.uploaded && draft.documents.uploaded.length) return 'inprogress';
  if(id === 'verification' && draft.verification && draft.verification.pct > 0) return 'inprogress';
  return 'pending';
}

function statusLabel(state){
  if(state === 'complete') return {t:'Complete', cls:'ok', icon:'check'};
  if(state === 'inprogress') return {t:'In progress', cls:'warn', icon:'clock'};
  return {t:'Not started', cls:'neutral', icon:'info'};
}

function overallProgress(){
  const done = STEPS.filter(st => stepState(st.id) === 'complete').length;
  return Math.round(done / STEPS.length * 100);
}

/* =========================================================
   HELPERS: relative time
   ========================================================= */
function fmtTimeAgo(ts){
  if(!ts) return 'never';
  const diff = Date.now() - ts;
  const mins = Math.floor(diff / 60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return mins + 'm ago';
  const hrs = Math.floor(mins / 60);
  if(hrs < 24) return hrs + 'h ago';
  const days = Math.floor(hrs / 24);
  return days + 'd ago';
}

    '<div class="review-block">' +
      '<div class="rb-h">' +
        '<b>' + icon('shield') + ' Verification</b>' +
        (verComplete
          ? '<span class="badge ok">' + icon('check') + ' Complete</span>'
          : '<span class="badge warn">' + icon('clock') + ' Pending</span>') +
      '</div>' +
      '<div class="review-kv">' +
        '<div><small>Verified</small><b>' + (v.pct || 0) + '%</b></div>' +
        '<div><small>Status</small><b>' + (verComplete ? 'Ready' : 'In progress') + '</b></div>' +
      '</div>' +
    '</div>'
  );

  document.getElementById('reviewBlocks').innerHTML = blocks.join('');
}

/* =========================================================
   TOGGLE STEP COMPLETE / INCOMPLETE
   ========================================================= */
document.querySelectorAll('[data-toggle]').forEach(btn => {
  btn.addEventListener('click', () => {
    const id = btn.dataset.toggle;
    draft.completed[id] = !draft.completed[id];
    saveDraft();
    refreshUI();
    toast(draft.completed[id] ? 'Marked complete' : 'Marked incomplete', 'ok');
  });
});

/* =========================================================
   REFRESH UI (progress + stepper + review)
   ========================================================= */
function refreshUI(){
  const pct = overallProgress();
  const done = STEPS.filter(st => stepState(st.id) === 'complete').length;

  const bar = document.getElementById('progBar');
  const pctEl = document.getElementById('progPct');
  const statDone = document.getElementById('statDone');
  const statPending = document.getElementById('statPending');
  const statDraft = document.getElementById('statDraft');

  if(bar) bar.style.width = pct + '%';
  if(pctEl) pctEl.textContent = pct + '%';
  if(statDone) statDone.textContent = done;
  if(statPending) statPending.textContent = STEPS.length - done;
  if(statDraft) statDraft.textContent = fmtTimeAgo(draft.updatedAt);

  // Rebuild stepper statuses
  document.querySelectorAll('.step').forEach(el => {
    const id = el.dataset.step;
    const state = stepState(id);
    el.classList.remove('complete','inprogress','pending');
    el.classList.add(state);
    const numEl = el.querySelector('.s-num');
    const idx = STEPS.findIndex(x => x.id === id);
    numEl.innerHTML = (state === 'complete') ? icon('check') : (idx + 1);
    // Update badge
    const badgeEl = el.querySelector('.s-head .badge');
    const lbl = statusLabel(state);
    badgeEl.className = 'badge ' + lbl.cls;
    badgeEl.innerHTML = icon(lbl.icon) + ' ' + lbl.t;
  });

  // Rebuild review
  renderReview();
}

/* =========================================================
   SUBMIT
   ========================================================= */
const submitBtn = document.getElementById('submitBtn');
const resetBtn = document.getElementById('resetBtn');

submitBtn.addEventListener('click', () => {
  const decl = document.getElementById('declaration');
  if(!decl.checked){
    toast('Please accept the declaration to submit.', 'err');
    decl.focus();
    return;
  }

  // Confirm all steps are complete (demo guard)
  const missing = STEPS.filter(st => st.id !== 'review' && !draft.completed[st.id]);
  if(missing.length){
    toast('Please complete: ' + missing.map(m => m.title).join(', '), 'err');
    return;
  }

  // Create application
  const newId = 'TSO-' + new Date().getFullYear() + '-' +
    String(Math.floor(Math.random() * 9000) + 1000);

  const newApp = {
    id: newId,
    schemeId: schemeId,
    schemeName: scheme.name,
    year: '2025-26',
    submitted: new Date().toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'}),
    status: 'Submitted',
    stageIndex: 0,
    amount: present.amount || 0,
    lastUpdated: 'Just now'
  };

  s.applications.unshift(newApp);

  s.notifications.unshift({
    id: 'n' + Date.now(),
    type: 'success',
    title: 'Application submitted',
    body: scheme.name + ' application ' + newId + ' submitted successfully.',
    date: 'Just now',
    read: false,
    action: 'application-details.html?id=' + newId
  });

  try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){}
  try{ localStorage.removeItem(draftKey); }catch(e){}

  toast('Application submitted successfully', 'ok');
  submitBtn.disabled = true;
  submitBtn.innerHTML = icon('check') + ' Submitted';

  setTimeout(() => {
    location.href = 'application-details.html?id=' + encodeURIComponent(newId);
  }, 900);
});

resetBtn.addEventListener('click', () => {
  if(!confirm('Reset this application draft? All unsaved progress on this page will be lost.')) return;
  try{ localStorage.removeItem(draftKey); }catch(e){}
  draft = seedDraftFromProfile();
  saveDraft();
  refreshUI();
  toast('Draft reset', 'ok');
});

/* =========================================================
   INIT
   ========================================================= */
saveDraft();
renderReview();
</script>
