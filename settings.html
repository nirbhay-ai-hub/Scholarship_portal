<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B5E55">
<title>Settings - Tribal Scholarship One</title>
<style>
:root{
  --brand:#0B5E55;--brand2:#0E7C6F;--brandsoft:#E6F2F0;
  --bg:#F4F6F8;--card:#fff;--ink:#0F172A;--muted:#64748B;--line:#E2E8F0;
  --ok:#0F9D58;--okbg:#E7F6EE;--warn:#B45309;--warnbg:#FEF3C7;
  --err:#DC2626;--errbg:#FEE2E2;--info:#1D4ED8;--infobg:#DBEAFE;
  --r:14px;--sh:0 1px 2px rgba(15,23,42,.06),0 8px 24px -14px rgba(15,23,42,.2);
  --safeb:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
svg{display:block}

/* SHELL */
.app{min-height:100dvh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:50;background:var(--brand);color:#fff;
  display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:56px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));
}
.topbar .brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.logo{
  width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.15);
  display:grid;place-items:center;flex:none;
}
.logo svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.brand-t{min-width:0}
.brand-t b{display:block;font-size:14px;line-height:1.15;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;font-weight:600}
.brand-t small{display:block;font-size:11px;opacity:.8;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;gap:4px}
.iconbtn{
  width:38px;height:38px;border-radius:10px;border:0;
  background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;
  cursor:pointer;position:relative;
}
.iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}
.iconbtn .dot-badge{
  position:absolute;top:6px;right:6px;width:8px;height:8px;
  border-radius:50%;background:#FBBF24;border:2px solid var(--brand)
}
.sidebar{display:none}
.bottomnav{
  position:fixed;bottom:0;left:0;right:0;z-index:60;background:#fff;
  border-top:1px solid var(--line);display:flex;
  padding:6px 4px calc(6px + var(--safeb));
  box-shadow:0 -4px 16px -8px rgba(15,23,42,.1);
}
.bn-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 2px;border-radius:10px;color:var(--muted);font-size:10.5px;
  font-weight:500;min-width:0;
}
.bn-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
.bn-item.active{color:var(--brand);background:var(--brandsoft)}
.bn-item span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.content{flex:1;padding:14px 14px calc(88px + var(--safeb));min-width:0}
.wrap{max-width:820px;margin:0 auto}

@media(min-width:768px){
  .content{padding:18px 22px calc(92px + var(--safeb))}
  .bottomnav{padding:8px 12px calc(8px + var(--safeb))}
  .bn-item{font-size:11.5px}.bn-item svg{width:24px;height:24px}
}
@media(min-width:1200px){
  .app{
    display:grid;grid-template-columns:250px 1fr;
    grid-template-rows:auto 1fr;
    grid-template-areas:"top top" "side main";
  }
  .topbar{grid-area:top}
  .sidebar{
    grid-area:side;display:block;background:#fff;
    border-right:1px solid var(--line);padding:14px 12px;
    position:sticky;top:56px;height:calc(100dvh - 56px);overflow-y:auto;
  }
  .sidebar .nav-title{
    font-size:11px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--muted);font-weight:600;padding:12px 12px 6px;
  }
  .sidebar a{
    display:flex;align-items:center;gap:12px;padding:10px 12px;
    border-radius:10px;color:var(--ink);font-size:14px;font-weight:500;
    margin-bottom:2px;
  }
  .sidebar a svg{width:20px;height:20px;stroke:currentColor;fill:none;
    stroke-width:1.8;flex:none}
  .sidebar a:hover{background:var(--bg)}
  .sidebar a.active{background:var(--brandsoft);color:var(--brand);font-weight:600}
  .content{grid-area:main;padding:22px 26px}
  .bottomnav{display:none}
  .wrap{max-width:860px}
}

/* COMMON */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 16px;border-radius:10px;border:1px solid transparent;
  background:#fff;color:var(--ink);font-weight:600;font-size:14px;
  cursor:pointer;line-height:1.2;text-align:center;transition:.15s;
  min-height:44px;
}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:hover{background:#0a4f48}
.btn.ghost{background:#fff;border-color:var(--line)}
.btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn.danger{background:#fff;border-color:#FCA5A5;color:var(--err)}
.btn.danger:hover{background:var(--errbg);border-color:var(--err)}
.btn.sm{padding:8px 13px;font-size:13px;min-height:38px}
.btn.block{width:100%}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;
  stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.badge{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;
  border-radius:999px;font-size:11.5px;font-weight:600;background:#F1F5F9;
  color:#334155;white-space:nowrap;
}
.badge.ok{background:var(--okbg);color:var(--ok)}
.badge.warn{background:var(--warnbg);color:var(--warn)}
.badge.err{background:var(--errbg);color:var(--err)}
.badge.info{background:var(--infobg);color:var(--info)}
.badge.brand{background:var(--brandsoft);color:var(--brand)}
.muted{color:var(--muted)}
.sm{font-size:13px}
.xs{font-size:11.5px}
.link{color:var(--brand);font-weight:600;font-size:13.5px}

/* HEAD */
.page-head{margin-bottom:14px}
.breadcrumb{
  display:flex;align-items:center;gap:6px;font-size:12px;
  color:var(--muted);margin-bottom:8px;flex-wrap:wrap;
}
.breadcrumb svg{width:12px;height:12px;stroke:currentColor;fill:none;
  stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.page-head h1{font-size:22px;font-weight:700;margin:0 0 6px}
.page-head p{color:var(--muted);font-size:13.5px;margin:0;max-width:640px}

/* CARD */
.card{
  background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:16px;margin-bottom:14px;box-shadow:var(--sh);
}
.card-h{
  display:flex;align-items:center;gap:10px;margin-bottom:14px;
  flex-wrap:wrap;
}
.card-h .c-ic{
  width:34px;height:34px;border-radius:10px;background:var(--brandsoft);
  display:grid;place-items:center;flex:none;
}
.card-h .c-ic svg{width:18px;height:18px;stroke:var(--brand);fill:none;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.card-h h2{font-size:15px;font-weight:700;margin:0;flex:1}

/* ROW LIST */
.row-list{list-style:none;padding:0;margin:0}
.row-item{
  display:flex;align-items:center;gap:14px;padding:14px 0;
  border-bottom:1px solid var(--line);
}
.row-item:last-child{border-bottom:0}
.row-item .ri-ic{
  width:38px;height:38px;border-radius:11px;background:var(--brandsoft);
  display:grid;place-items:center;flex:none;
}
.row-item .ri-ic svg{width:19px;height:19px;stroke:var(--brand);
  fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.row-item .ri-l{flex:1;min-width:0}
.row-item .ri-l b{
  font-size:14px;font-weight:600;display:block;margin-bottom:2px;
  line-height:1.35;
}
.row-item .ri-l small{
  font-size:12.5px;color:var(--muted);display:block;line-height:1.45;
}
.row-item .ri-r{flex:none;display:flex;align-items:center;gap:8px}

/* LANGUAGE OPTIONS */
.lang-list{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
}
@media(max-width:420px){.lang-list{grid-template-columns:1fr}}
.lang-opt{
  display:flex;align-items:center;gap:12px;padding:14px;
  background:#fff;border:1.5px solid var(--line);border-radius:12px;
  cursor:pointer;transition:.15s;text-align:left;
}
.lang-opt:hover{border-color:var(--brand)}
.lang-opt.sel{border-color:var(--brand);background:var(--brandsoft)}
.lang-opt .flag{
  width:40px;height:40px;border-radius:10px;background:#fff;
  display:grid;place-items:center;flex:none;font-size:20px;
  border:1px solid var(--line);
}
.lang-opt.sel .flag{border-color:#B7D8D3}
.lang-opt .lt{flex:1;min-width:0}
.lang-opt .lt b{font-size:14px;font-weight:700;display:block;
  margin-bottom:2px}
.lang-opt .lt small{font-size:12px;color:var(--muted);display:block}
.lang-opt .chk{
  width:22px;height:22px;border-radius:50%;
  border:2px solid var(--line);display:grid;place-items:center;
  flex:none;transition:.2s;
}
.lang-opt .chk svg{
  width:12px;height:12px;stroke:transparent;fill:none;
  stroke-width:3;stroke-linecap:round;stroke-linejoin:round;
}
.lang-opt.sel .chk{background:var(--brand);border-color:var(--brand)}
.lang-opt.sel .chk svg{stroke:#fff}

/* THEME OPTIONS */
.theme-list{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
}
@media(max-width:420px){.theme-list{grid-template-columns:1fr}}
.theme-opt{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:14px 8px;background:#fff;border:1.5px solid var(--line);
  border-radius:12px;cursor:pointer;transition:.15s;text-align:center;
}
.theme-opt:hover{border-color:var(--brand)}
.theme-opt.sel{border-color:var(--brand);background:var(--brandsoft)}
.theme-prev{
  width:64px;height:44px;border-radius:8px;position:relative;
  overflow:hidden;flex:none;border:1px solid var(--line);
}
.theme-prev.light{
  background:linear-gradient(180deg,#F4F6F8 0%,#F4F6F8 60%,#E2E8F0 60%,#E2E8F0 100%);
}
.theme-prev.dark{
  background:linear-gradient(180deg,#0F172A 0%,#0F172A 60%,#1E293B 60%,#1E293B 100%);
}
.theme-prev.system{
  background:linear-gradient(135deg,#F4F6F8 0%,#F4F6F8 50%,#0F172A 50%,#0F172A 100%);
}
.theme-prev::before{
  content:"";position:absolute;top:6px;left:8px;right:8px;height:6px;
  border-radius:3px;background:rgba(11,94,85,.75);
}
.theme-opt b{font-size:13px;font-weight:600}
.theme-opt small{font-size:11px;color:var(--muted)}

/* SWITCH */
.switch{
  position:relative;display:inline-block;width:46px;height:26px;
  flex:none;
}
.switch input{
  opacity:0;width:0;height:0;position:absolute;
}
.switch .slider{
  position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;
  background:#CBD5E1;transition:.25s;border-radius:26px;
}
.switch .slider::before{
  content:"";position:absolute;height:20px;width:20px;left:3px;bottom:3px;
  background:#fff;transition:.25s;border-radius:50%;
  box-shadow:0 1px 3px rgba(0,0,0,.2);
}
.switch input:checked + .slider{background:var(--brand)}
.switch input:checked + .slider::before{transform:translateX(20px)}
.switch input:focus + .slider{box-shadow:0 0 0 3px rgba(11,94,85,.15)}

/* INFO BANNER */
.info-banner{
  display:flex;gap:12px;padding:13px 14px;border-radius:12px;
  margin-bottom:14px;border:1px solid;align-items:flex-start;
}
.info-banner svg{width:20px;height:20px;stroke:currentColor;fill:none;
  stroke-width:1.9;flex:none;margin-top:1px}
.info-banner p{margin:0;font-size:12.5px;line-height:1.55}
.info-banner b{font-weight:700}
.info-banner.info{background:var(--infobg);color:var(--info);border-color:#BFDBFE}
.info-banner.info p{color:#1E3A8A}
.info-banner.warn{background:var(--warnbg);color:var(--warn);border-color:#FCD34D}
.info-banner.warn p{color:#78350F}

/* SUB HEAD */
.sub-head{
  font-size:11px;color:var(--muted);font-weight:700;
  text-transform:uppercase;letter-spacing:.06em;
  margin:16px 0 10px;display:flex;align-items:center;gap:8px;
}
.sub-head:first-child{margin-top:0}
.sub-head::after{
  content:"";flex:1;height:1px;background:var(--line);
}

/* NOTIFICATION SETTINGS */
.notif-list{list-style:none;padding:0;margin:0}
.notif-item{
  display:flex;align-items:center;gap:14px;padding:13px 0;
  border-bottom:1px solid var(--line);
}
.notif-item:last-child{border-bottom:0}
.notif-item .ni-l{flex:1;min-width:0}
.notif-item .ni-l b{
  font-size:13.5px;font-weight:600;display:block;margin-bottom:2px;
}
.notif-item .ni-l small{
  font-size:12px;color:var(--muted);display:block;line-height:1.4;
}

/* DANGER ZONE */
.danger-card{
  background:#fff;border:1.5px solid #FCA5A5;border-radius:14px;
  padding:16px;margin-bottom:14px;box-shadow:var(--sh);
}
.danger-card .dc-h{
  display:flex;align-items:center;gap:10px;margin-bottom:12px;
}
.danger-card .dc-h .c-ic{
  width:34px;height:34px;border-radius:10px;background:var(--errbg);
  display:grid;place-items:center;flex:none;
}
.danger-card .dc-h .c-ic svg{width:18px;height:18px;stroke:var(--err);
  fill:none;stroke-width:1.9}
.danger-card .dc-h h2{
  font-size:15px;font-weight:700;margin:0;color:#7F1D1D;
}
.danger-card p{
  margin:0 0 14px;font-size:13px;color:var(--muted);line-height:1.5;
}
.danger-card .dc-actions{display:flex;gap:10px;flex-wrap:wrap}
.danger-card .dc-actions .btn{flex:1;min-width:140px}

/* CONFIRM MODAL */
.modal-bg{
  position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:500;
  display:none;align-items:center;justify-content:center;padding:20px;
}
.modal-bg.open{display:flex}
.modal{
  background:#fff;border-radius:16px;padding:22px;max-width:400px;
  width:100%;box-shadow:0 20px 50px -20px rgba(0,0,0,.4);
  animation:pop .25s ease;
}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.modal h3{font-size:16px;margin:0 0 8px;font-weight:700;
  display:flex;align-items:center;gap:9px}
.modal h3 svg{width:20px;height:20px;stroke:var(--err);fill:none;
  stroke-width:2}
.modal p{margin:0 0 16px;font-size:13.5px;color:var(--muted);
  line-height:1.5}
.modal .modal-actions{display:flex;gap:10px;flex-wrap:wrap}
.modal .modal-actions .btn{flex:1;min-width:120px}

/* TOAST */
.toast-wrap{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(88px + var(--safeb));z-index:600;
  display:flex;flex-direction:column;gap:8px;pointer-events:none;
  align-items:center;width:calc(100% - 28px);max-width:420px;
}
@media(min-width:1200px){.toast-wrap{bottom:24px}}
.toast{
  background:#0F172A;color:#fff;padding:11px 16px;border-radius:10px;
  font-size:13.5px;font-weight:500;
  box-shadow:0 10px 30px -10px rgba(0,0,0,.35);
  transition:opacity .3s;text-align:center;max-width:100%;
}
.toast.ok{background:var(--ok)}
.toast.err{background:var(--err)}
.toast.warn{background:var(--warn)}

/* JAGO FAB */
.jago-fab{
  position:fixed;right:14px;bottom:calc(78px + var(--safeb));
  width:54px;height:54px;border-radius:50%;
  background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;
  display:grid;place-items:center;
  box-shadow:0 10px 24px -8px rgba(11,94,85,.6);
  z-index:70;border:0;cursor:pointer;
}
.jago-fab svg{width:26px;height:26px;stroke:currentColor;fill:none;
  stroke-width:1.8}
@media(min-width:1200px){
  .jago-fab{bottom:26px;right:26px;width:58px;height:58px}
}

/* DARK THEME */
body.theme-dark{
  --bg:#0F172A;--card:#1E293B;--ink:#F1F5F9;--muted:#94A3B8;
  --line:#334155;--brandsoft:#0F2E2A;--okbg:#0F2E1D;--warnbg:#3B2A0A;
  --errbg:#3B1212;--infobg:#0F2350;
}
body.theme-dark .topbar{background:#0B5E55}
body.theme-dark .bottomnav,
body.theme-dark .sidebar,
body.theme-dark .card,
body.theme-dark .danger-card,
body.theme-dark .lang-opt,
body.theme-dark .theme-opt,
body.theme-dark .row-item .ri-ic,
body.theme-dark .row-item{
  background:#1E293B;color:#F1F5F9;
}
body.theme-dark .row-item{border-color:#334155}
body.theme-dark .lang-opt .flag{background:#0F172A;border-color:#334155}
body.theme-dark .theme-prev{border-color:#334155}
</style>
</head>
<body>
<div class="app">
  <header class="topbar" id="topbar"></header>
  <aside class="sidebar" id="sidebar"></aside>
  <main class="content"><div class="wrap" id="page"></div></main>
  <nav class="bottomnav" id="bottomnav"></nav>
</div>

<div class="modal-bg" id="logoutModal">
  <div class="modal">
    <h3 id="logoutTitle">Logout?</h3>
    <p id="logoutBody">You will be signed out of Tribal Scholarship One on this device. In this prototype, all local state will be cleared.</p>
    <div class="modal-actions">
      <button class="btn ghost" type="button" id="cancelLogout">Cancel</button>
      <button class="btn danger" type="button" id="confirmLogout">Logout</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="clearModal">
  <div class="modal">
    <h3 id="clearTitle">Clear all local data?</h3>
    <p id="clearBody">This will remove your profile, applications, drafts, documents and settings from this browser. You cannot undo this action.</p>
    <div class="modal-actions">
      <button class="btn ghost" type="button" id="cancelClear">Cancel</button>
      <button class="btn danger" type="button" id="confirmClear">Clear data</button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
/* =========================================================
   ICONS
   ========================================================= */
var ICONS = {
  dashboard:'<path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/>',

  apps:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  docs:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
  pay:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',
  jago:'<circle cx="12" cy="12" r="9"/><path d="M9 10h.01M15 10h.01M9 15c1.5 1.2 4.5 1.2 6 0"/>',
  notif:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
  profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>',
  check:'<path d="M5 13l4 4L19 7"/>',
  chev:'<path d="M9 6l6 6-6 6"/>',
  chevL:'<path d="M15 6l-6 6 6 6"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  close:'<path d="M18 6L6 18M6 6l12 12"/>',
  book:'<path d="M4 19.5V5a2 2 0 0 1 2-2h11a1 1 0 0 1 1 1v15"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H18"/><path d="M20 5v14"/>',
  grad:'<path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1 2.7 3 6 3s6-2 6-3v-5"/>',

function icon(n, cls){
  var p = ICONS[n] || ICONS.info;
  return '<svg class="' + (cls || '') + '" viewBox="0 0 24 24" fill="none" ' +
    'stroke="currentColor" stroke-width="1.8" stroke-linecap="round" ' +
    'stroke-linejoin="round" aria-hidden="true">' + p + '</svg>';
}

/* =========================================================
   HELPERS
   ========================================================= */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}
function toast(msg, type){
  var w = document.getElementById('toastWrap');
  var t = document.createElement('div');
  t.className = 'toast ' + (type || '');
  t.textContent = msg;
  w.appendChild(t);
  setTimeout(function(){
    t.style.opacity = '0';
    setTimeout(function(){ t.remove(); }, 320);
  }, 2400);
}

var KEY = 'tso_state_v1';
var PREF_KEY = 'tso_prefs_v1';

function S(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){
      var p = JSON.parse(raw);
      if(p && p.profile) return p;
    }
  }catch(e){}
  return null;
}

function loadPrefs(){
  try{
    var raw = localStorage.getItem(PREF_KEY);
    if(raw){
      var p = JSON.parse(raw);
      if(p && typeof p === 'object') return p;
    }
  }catch(e){}
  return {
    lang: 'en',
    theme: 'light',
    notifApplication: true,
    notifDocument: true,
    notifPayment: true,
    notifReminders: true,
    notifEmail: false,
    notifSms: false,
    analytics: true,
    personalized: false
  };
}

function savePrefs(){
  try{ localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); }catch(e){}
}

var prefs = loadPrefs();

/* Apply saved language to <html lang> */
document.documentElement.lang = prefs.lang;

/* Apply saved theme */
applyTheme(prefs.theme);

function applyTheme(theme){
  var resolved = theme;
  if(theme === 'system'){
    resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
      ? 'dark' : 'light';
  }
  if(resolved === 'dark'){
    document.body.classList.add('theme-dark');
  } else {
    document.body.classList.remove('theme-dark');
  }
}

/* Listen for system theme changes if the user picked System */
if(window.matchMedia){
  try{
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){
      if(prefs.theme === 'system') applyTheme('system');
    });
  }catch(e){}
}

/* =========================================================
   BINDINGS
   ========================================================= */
function bindAll(){
  /* Language */
  page.querySelectorAll('.lang-opt').forEach(function(b){
    b.addEventListener('click', function(){
      var l = b.dataset.lang;
      if(l === prefs.lang) return;
      prefs.lang = l;
      savePrefs();
      document.documentElement.lang = l;
      try{ localStorage.setItem('tso_lang', l); }catch(e){}
      render();
      toast(l === 'hi' ? 'भाषा हिन्दी में बदल दी गई' : 'Language set to English', 'ok');
    });
  });

  /* Theme */
  page.querySelectorAll('.theme-opt').forEach(function(b){
    b.addEventListener('click', function(){
      var t = b.dataset.theme;
      if(t === prefs.theme) return;
      prefs.theme = t;
      savePrefs();
      applyTheme(t);
      render();
      var msg = t === 'dark' ? 'Dark theme enabled'
              : t === 'light' ? 'Light theme enabled'
              : 'Following system theme';
      toast(msg, 'ok');
    });
  });

  /* Toggle switches */
  var toggleMap = {
    notifApplication: 'Application updates',
    notifDocument:    'Document updates',
    notifPayment:     'Payment updates',
    notifReminders:   'Reminders',
    notifEmail:       'Email notifications',
    notifSms:         'SMS notifications',
    analytics:        'Anonymous analytics',
    personalized:     'Personalized recommendations'
  };
  Object.keys(toggleMap).forEach(function(key){
    var el = document.getElementById(key);
    if(!el) return;
    el.addEventListener('change', function(){
      prefs[key] = el.checked;
      savePrefs();
      toast(toggleMap[key] + (el.checked ? ' enabled' : ' disabled'), 'ok');
    });
  });

  /* Row navigations */
  page.querySelectorAll('[data-nav]').forEach(function(li){
    li.addEventListener('click', function(){
      location.href = li.dataset.nav;
    });
  });

  /* Download data */
  var dl = document.getElementById('downloadDataBtn');
  if(dl){
    dl.addEventListener('click', function(){
      var payload = {
        profile: s.profile,
        applications: s.applications,
        documents: s.documents,
        preferences: prefs,
        exportedAt: new Date().toISOString()
      };
      try{
        var blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'tribal-scholarship-one-data.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        toast('Data export started', 'ok');
      }catch(e){
        toast('Export is a demo feature', 'ok');
      }
    });
  }

  /* Clear data */
  var cd = document.getElementById('clearDataBtn');
  if(cd){
    cd.addEventListener('click', function(){
      document.getElementById('clearModal').classList.add('open');
    });
  }
  var ca = document.getElementById('clearAllBtn');
  if(ca){
    ca.addEventListener('click', function(){
      document.getElementById('clearModal').classList.add('open');
    });
  }

  /* Reset prefs */
  var rp = document.getElementById('resetPrefsBtn');
  if(rp){
    rp.addEventListener('click', function(){
      prefs = {
        lang: 'en',
        theme: 'light',
        notifApplication: true,
        notifDocument: true,
        notifPayment: true,
        notifReminders: true,
        notifEmail: false,
        notifSms: false,
        analytics: true,
        personalized: false
      };
      savePrefs();
      try{ localStorage.removeItem('tso_lang'); }catch(e){}
      document.documentElement.lang = 'en';
      applyTheme('light');
      render();
      toast('Preferences reset to defaults', 'ok');
    });
  }

  /* Logout */
  var lg = document.getElementById('logoutBtn');
  if(lg){
    lg.addEventListener('click', function(){
      document.getElementById('logoutModal').classList.add('open');
    });
  }
}

/* =========================================================
   MODALS
   ========================================================= */
document.getElementById('cancelLogout').addEventListener('click', function(){
  document.getElementById('logoutModal').classList.remove('open');
});
document.getElementById('logoutModal').addEventListener('click', function(e){
  if(e.target === this) this.classList.remove('open');
});
document.getElementById('confirmLogout').addEventListener('click', function(){
  try{ localStorage.removeItem(KEY); }catch(e){}
  toast('Signed out', 'ok');
  setTimeout(function(){ location.href = 'index.html'; }, 500);
});

document.getElementById('cancelClear').addEventListener('click', function(){
  document.getElementById('clearModal').classList.remove('open');
});
document.getElementById('clearModal').addEventListener('click', function(e){
  if(e.target === this) this.classList.remove('open');
});
document.getElementById('confirmClear').addEventListener('click', function(){
  try{
    localStorage.removeItem(KEY);
    localStorage.removeItem(PREF_KEY);
    localStorage.removeItem('tso_lang');
    localStorage.removeItem('tso_jago_lang');
    localStorage.removeItem('tso_jago_chat_v1');
    localStorage.removeItem('tso_seen_onboarding');
    /* Remove drafts */
    var keys = [];
    for(var i = 0; i < localStorage.length; i++){
      var k = localStorage.key(i);
      if(k && k.indexOf('tso_draft_') === 0) keys.push(k);
    }
    keys.forEach(function(k){ localStorage.removeItem(k); });
  }catch(e){}
  toast('All local data cleared', 'ok');
  setTimeout(function(){ location.href = 'index.html'; }, 700);
});

/* =========================================================
   INIT
   ========================================================= */
render();
</script>
  <script src="lang.js"></script>
</body>
