<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B5E55">
<title>Personal Details · Tribal Scholarship One</title>
<style>
:root{
  --brand:#0B5E55;--brand2:#0E7C6F;--brandsoft:#E6F2F0;
  --bg:#F4F6F8;--card:#fff;--ink:#0F172A;--muted:#64748B;--line:#E2E8F0;
  --ok:#0F9D58;--okbg:#E7F6EE;--warn:#B45309;--warnbg:#FEF3C7;
  --err:#DC2626;--errbg:#FEE2E2;--info:#1D4ED8;--infobg:#DBEAFE;
  --r:14px;--sh:0 1px 2px rgba(15,23,42,.06),0 8px 24px -14px rgba(15,23,42,.2);
  --safeb:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans Devanagari',sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
svg{display:block}

/* ============ SHELL ============ */
.app{min-height:100dvh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:50;background:var(--brand);color:#fff;
  display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:56px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));
}
.topbar .brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.logo{
  width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.15);
  display:grid;place-items:center;flex:none;
}
.logo svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.brand-t{min-width:0}
.brand-t b{display:block;font-size:14px;line-height:1.15;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;font-weight:600}
.brand-t small{display:block;font-size:11px;opacity:.8;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;gap:4px}
.iconbtn{
  width:38px;height:38px;border-radius:10px;border:0;
  background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;
  cursor:pointer;position:relative;
}
.iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}
.iconbtn .dot-badge{
  position:absolute;top:6px;right:6px;width:8px;height:8px;
  border-radius:50%;background:#FBBF24;border:2px solid var(--brand)
}
.sidebar{display:none}
.bottomnav{
  position:fixed;bottom:0;left:0;right:0;z-index:60;background:#fff;
  border-top:1px solid var(--line);display:flex;
  padding:6px 4px calc(6px + var(--safeb));
  box-shadow:0 -4px 16px -8px rgba(15,23,42,.1);
}
.bn-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 2px;border-radius:10px;color:var(--muted);font-size:10.5px;
  font-weight:500;min-width:0;
}
.bn-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
.bn-item.active{color:var(--brand);background:var(--brandsoft)}
.bn-item span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.content{flex:1;padding:14px 14px calc(88px + var(--safeb));min-width:0}
.wrap{max-width:820px;margin:0 auto}

@media(min-width:768px){
  .content{padding:18px 22px calc(92px + var(--safeb))}
  .bottomnav{padding:8px 12px calc(8px + var(--safeb))}
  .bn-item{font-size:11.5px}.bn-item svg{width:24px;height:24px}
}
@media(min-width:1200px){
  .app{
    display:grid;grid-template-columns:250px 1fr;
    grid-template-rows:auto 1fr;
    grid-template-areas:"top top" "side main";
  }
  .topbar{grid-area:top}
  .sidebar{
    grid-area:side;display:block;background:#fff;
    border-right:1px solid var(--line);padding:14px 12px;
    position:sticky;top:56px;height:calc(100dvh - 56px);overflow-y:auto;
  }
  .sidebar .nav-title{
    font-size:11px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--muted);font-weight:600;padding:12px 12px 6px;
  }
  .sidebar a{
    display:flex;align-items:center;gap:12px;padding:10px 12px;
    border-radius:10px;color:var(--ink);font-size:14px;font-weight:500;
    margin-bottom:2px;
  }
  .sidebar a svg{width:20px;height:20px;stroke:currentColor;fill:none;
    stroke-width:1.8;flex:none}
  .sidebar a:hover{background:var(--bg)}
  .sidebar a.active{background:var(--brandsoft);color:var(--brand);font-weight:600}
  .content{grid-area:main;padding:22px 26px}
  .bottomnav{display:none}
}

/* ============ COMMON ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 16px;border-radius:10px;border:1px solid transparent;
  background:#fff;color:var(--ink);font-weight:600;font-size:14px;
  cursor:pointer;line-height:1.2;text-align:center;transition:.15s;
  min-height:44px;
}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:hover{background:#0a4f48}
.btn.ghost{background:#fff;border-color:var(--line)}
.btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn.sm{padding:8px 13px;font-size:13px;min-height:38px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;
  stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.badge{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;
  border-radius:999px;font-size:11.5px;font-weight:600;background:#F1F5F9;
  color:#334155;white-space:nowrap;
}
.badge.ok{background:var(--okbg);color:var(--ok)}
.badge.warn{background:var(--warnbg);color:var(--warn)}
.badge.err{background:var(--errbg);color:var(--err)}
.badge.info{background:var(--infobg);color:var(--info)}
.badge.brand{background:var(--brandsoft);color:var(--brand)}
.badge.neutral{background:#F1F5F9;color:#475569}
.muted{color:var(--muted)}
.sm{font-size:13px}
.xs{font-size:11.5px}
.link{color:var(--brand);font-weight:600;font-size:13.5px}

/* ============ HEAD ============ */
.page-head{margin-bottom:14px}
.breadcrumb{
  display:flex;align-items:center;gap:6px;font-size:12px;
  color:var(--muted);margin-bottom:8px;flex-wrap:wrap;
}
.breadcrumb svg{width:12px;height:12px;stroke:currentColor;fill:none;
  stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.page-head h1{font-size:22px;font-weight:700;margin:0 0 6px}
.page-head p{color:var(--muted);font-size:13.5px;margin:0;max-width:640px}

/* ============ MINI STEPPER ============ */
.mini-stepper{
  display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;margin-bottom:8px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.mini-stepper::-webkit-scrollbar{display:none}
.ms-item{
  flex:none;display:flex;align-items:center;gap:8px;
  padding:8px 12px;border-radius:10px;background:#fff;
  border:1px solid var(--line);font-size:12.5px;font-weight:600;
  color:var(--muted);white-space:nowrap;
}
.ms-item .ms-n{
  width:20px;height:20px;border-radius:50%;background:#F1F5F9;
  display:grid;place-items:center;font-size:11px;font-weight:700;
  color:var(--muted);flex:none;
}
.ms-item.done{color:var(--brand);border-color:#B7D8D3;background:var(--brandsoft)}
.ms-item.done .ms-n{background:var(--brand);color:#fff}
.ms-item.current{color:#fff;background:var(--brand);border-color:var(--brand)}
.ms-item.current .ms-n{background:rgba(255,255,255,.2);color:#fff}
.ms-item svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.4}

/* ============ INFO BANNER ============ */
.info-banner{
  display:flex;gap:12px;padding:13px 14px;border-radius:12px;
  margin-bottom:14px;border:1px solid;
}
.info-banner svg{width:20px;height:20px;stroke:currentColor;fill:none;
  stroke-width:1.9;flex:none;margin-top:1px}
.info-banner p{margin:0;font-size:12.5px;line-height:1.55}
.info-banner b{font-weight:700}
.info-banner.info{background:var(--infobg);color:var(--info);border-color:#BFDBFE}
.info-banner.info p{color:#1E3A8A}
.info-banner.brand{background:var(--brandsoft);color:var(--brand);border-color:#B7D8D3}
.info-banner.brand p{color:#0B5E55}

/* ============ CARD ============ */
.card{
  background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:16px;margin-bottom:14px;box-shadow:var(--sh);
}
.card-h{
  display:flex;align-items:center;gap:10px;margin-bottom:14px;
  flex-wrap:wrap;
}
.card-h .c-ic{
  width:34px;height:34px;border-radius:10px;background:var(--brandsoft);
  display:grid;place-items:center;flex:none;
}
.card-h .c-ic svg{width:18px;height:18px;stroke:var(--brand);fill:none;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.card-h h2{font-size:15px;font-weight:700;margin:0;flex:1}
.card-h .c-step{font-size:11.5px;color:var(--muted);font-weight:600}

/* ============ FORM ============ */
.field{margin-bottom:14px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;
  color:#334155}
.field .hint{font-size:12px;color:var(--muted);margin-top:5px}
.field .err{font-size:12px;color:var(--err);margin-top:4px;display:none}
.field.invalid .err{display:block}
.field.invalid input,
.field.invalid select,
.field.invalid textarea{border-color:var(--err)}
input,select,textarea{
  width:100%;padding:11px 13px;border:1px solid var(--line);
  border-radius:10px;background:#fff;font-size:15px;outline:0;min-height:46px;
  transition:.15s;
}
textarea{resize:vertical;min-height:80px;font-family:inherit;line-height:1.5}
input:focus,select:focus,textarea:focus{
  border-color:var(--brand);box-shadow:0 0 0 3px rgba(11,94,85,.12);
}
input[readonly]{background:#F8FAFC;color:#475569;cursor:not-allowed}
.input-group{position:relative}
.input-group .prefix{
  position:absolute;left:13px;top:50%;transform:translateY(-50%);
  font-size:14px;color:var(--muted);font-weight:600;pointer-events:none;
}
.input-group input{padding-left:34px}
.grid2{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:560px){.grid2{grid-template-columns:1fr 1fr}}

/* radio/checkbox pills */
.pill-group{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pill-group.two{grid-template-columns:repeat(2,1fr)}
.pill{
  position:relative;display:flex;align-items:center;justify-content:center;
  padding:11px 8px;border:1.5px solid var(--line);border-radius:10px;
  background:#fff;font-size:13px;font-weight:600;cursor:pointer;
  text-align:center;min-height:44px;transition:.15s;line-height:1.2;
}
.pill:hover{border-color:var(--brand)}
.pill input{position:absolute;opacity:0;pointer-events:none}
.pill.sel{border-color:var(--brand);background:var(--brandsoft);color:var(--brand)}

.check-row{
  display:flex;align-items:flex-start;gap:11px;padding:11px 13px;
  border:1.5px solid var(--line);border-radius:10px;cursor:pointer;
  font-size:13.5px;transition:.15s;
}
.check-row:hover{border-color:var(--brand)}
.check-row input{
  width:18px;height:18px;margin-top:2px;flex:none;
  accent-color:var(--brand);min-height:auto;padding:0;
}
.check-row.sel{border-color:var(--brand);background:var(--brandsoft)}
.check-row b{font-weight:600;display:block}
.check-row small{font-size:12px;color:var(--muted);display:block;margin-top:2px}

/* ============ ACTIONS ============ */
.form-actions{
  display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;
}
.form-actions .btn{flex:1;min-width:140px}

.save-bar{
  position:sticky;bottom:calc(78px + var(--safeb));
  display:flex;gap:10px;flex-wrap:wrap;
  padding:12px;background:#fff;border:1px solid var(--line);
  border-radius:14px;box-shadow:0 -6px 20px -12px rgba(15,23,42,.25);
  z-index:40;margin-bottom:14px;
}
.save-bar .btn{flex:1;min-width:120px}
@media(min-width:1200px){.save-bar{bottom:16px}}

/* progress */
.prog-wrap{
  background:#fff;border:1px solid var(--line);border-radius:12px;
  padding:13px 14px;margin-bottom:14px;box-shadow:var(--sh);
}
.prog-head{
  display:flex;justify-content:space-between;align-items:center;
  gap:10px;margin-bottom:8px;font-size:12.5px;font-weight:600;color:var(--muted);
}
.prog-head b{color:var(--ink);font-size:13px}
.progress{height:8px;border-radius:99px;background:#E2E8F0;overflow:hidden}
.progress>span{
  display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--brand),var(--brand2));
  transition:width .35s ease;
}

/* ============ TOAST ============ */
.toast-wrap{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(88px + var(--safeb));z-index:300;
  display:flex;flex-direction:column;gap:8px;pointer-events:none;
  align-items:center;width:calc(100% - 28px);max-width:420px;
}
@media(min-width:1200px){.toast-wrap{bottom:24px}}
.toast{
  background:#0F172A;color:#fff;padding:11px 16px;border-radius:10px;
  font-size:13.5px;font-weight:500;
  box-shadow:0 10px 30px -10px rgba(0,0,0,.35);
  transition:opacity .3s;text-align:center;max-width:100%;
}
.toast.ok{background:var(--ok)}
.toast.err{background:var(--err)}
.toast.warn{background:var(--warn)}

/* JAGO FAB */
.jago-fab{
  position:fixed;right:14px;bottom:calc(78px + var(--safeb));
  width:54px;height:54px;border-radius:50%;
  background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;
  display:grid;place-items:center;
  box-shadow:0 10px 24px -8px rgba(11,94,85,.6);
  z-index:70;border:0;cursor:pointer;
}
.jago-fab svg{width:26px;height:26px;stroke:currentColor;fill:none;
  stroke-width:1.8}
@media(min-width:1200px){
  .jago-fab{bottom:26px;right:26px;width:58px;height:58px}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar" id="topbar"></header>
  <aside class="sidebar" id="sidebar"></aside>
  <main class="content"><div class="wrap" id="page"></div></main>
  <nav class="bottomnav" id="bottomnav"></nav>
</div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
/* =========================================================
   ICONS
   ========================================================= */
const ICONS = {
  dashboard:'<path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/>',
  schemes:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M8 4v16"/>',
  apps:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  docs:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
  pay:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',
  jago:'<circle cx="12" cy="12" r="9"/><path d="M9 10h.01M15 10h.01M9 15c1.5 1.2 4.5 1.2 6 0"/>',
  notif:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
  profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>',
  check:'<path d="M5 13l4 4L19 7"/>',
  chev:'<path d="M9 6l6 6-6 6"/>',
  chevL:'<path d="M15 6l-6 6 6 6"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  close:'<path d="M18 6L6 18M6 6l12 12"/>',
  book:'<path d="M4 19.5V5a2 2 0 0 1 2-2h11a1 1 0 0 1 1 1v15"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H18"/><path d="M20 5v14"/>',
  grad:'<path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1 2.7 3 6 3s6-2 6-3v-5"/>',
  star:'<path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/>',
  calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/>',
  bank:'<path d="M3 10l9-6 9 6"/><path d="M5 10v9h14v-9M9 19v-5h6v5"/>',
  help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7"/><path d="M12 17h.01"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  alert:'<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  refresh:'<path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/>',
  upload:'<path d="M12 3v12M7 8l5-5 5 5"/><path d="M3 15v4a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-4"/>',
  sparkle:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',
  arrowR:'<path d="M5 12h14M13 5l7 7-7 7"/>',
  save:'<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/>',
  pen:'<path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18z"/><path d="M2 2l7.6 7.6"/><circle cx="11" cy="11" r="2"/>'
};
function icon(n, cls){
  const p = ICONS[n] || ICONS.info;
  return '<svg class="' + (cls || '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + p + '</svg>';
}

/* =========================================================
   HELPERS
   ========================================================= */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function toast(msg, type){
  const w = document.getElementById('toastWrap');
  const t = document.createElement('div');
  t.className = 'toast ' + (type || '');
  t.textContent = msg;
  w.appendChild(t);
  setTimeout(() => {
    t.style.opacity = '0';

/* =========================================================
   BINDINGS
   ========================================================= */
const F = id => document.getElementById(id);

const FIELD_MAP = {
  firstName:'firstName',
  lastName:'lastName',
  dob:'dob',
  mobile:'mobile',
  email:'email',
  state:'state',
  district:'district',
  address:'address',
  domicile:'domicile',
  income:'income'
};

/* Text/number/select/textarea inputs */
Object.keys(FIELD_MAP).forEach(id => {
  const el = F(id);
  if(!el) return;
  el.addEventListener('input', () => {
    form[FIELD_MAP[id]] = el.value;
    draft.personal = form;
    saveDraft();
    updateProgress();
  });
  el.addEventListener('change', () => {
    form[FIELD_MAP[id]] = el.value;
    draft.personal = form;
    saveDraft();
    updateProgress();
  });
});

/* Radio pill groups */
document.querySelectorAll('.pill').forEach(opt => {
  opt.addEventListener('click', () => {
    const group = opt.dataset.group;
    const val = opt.dataset.val;
    if(!group) return;
    document.querySelectorAll('.pill[data-group="' + group + '"]').forEach(o => {
      o.classList.toggle('sel', o === opt);
      const inp = o.querySelector('input');
      if(inp) inp.checked = (o === opt);
    });
    form[group] = val;
    draft.personal = form;
    saveDraft();
    updateProgress();
  });
});

/* Checkbox rows */
function bindCheckRow(rowId, inputId, key, extra){
  const row = F(rowId), inp = F(inputId);
  if(!row || !inp) return;
  inp.addEventListener('change', () => {
    row.classList.toggle('sel', inp.checked);
    form[key] = inp.checked;
    draft.personal = form;
    saveDraft();
    updateProgress();
    if(typeof extra === 'function') extra(inp.checked);
  });
}
bindCheckRow('pvtgRow', 'pvtgInput', 'pvtg');
bindCheckRow('disRow', 'disInput', 'disability', (checked) => {
  const field = F('disCertField');
  if(field) field.style.display = checked ? 'block' : 'none';
  if(!checked){
    form.disabilityCert = 'na';
  }
});

   ========================================================= */
F('autoFillBtn').addEventListener('click', () => {

  form = Object.assign({}, form, seeded2);

  F('firstName').value = form.firstName;

  F('mobile').value = form.mobile;
  F('email').value = form.email;
  F('state').value = form.state;
  F('district').value = form.district;
  F('address').value = form.address;
  F('domicile').value = form.domicile;
  F('income').value = form.income;

  // gender
  document.querySelectorAll('.pill[data-group="gender"]').forEach(o => {
    const on = o.dataset.val === form.gender;
    o.classList.toggle('sel', on);
    const inp = o.querySelector('input');
    if(inp) inp.checked = on;
  });
  // stCertStatus
  document.querySelectorAll('.pill[data-group="stCertStatus"]').forEach(o => {
    const on = o.dataset.val === form.stCertStatus;
    o.classList.toggle('sel', on);
    const inp = o.querySelector('input');
    if(inp) inp.checked = on;
  });
  // incomeCert
  document.querySelectorAll('.pill[data-group="incomeCert"]').forEach(o => {
    const on = o.dataset.val === form.incomeCert;
    o.classList.toggle('sel', on);
    const inp = o.querySelector('input');
    if(inp) inp.checked = on;
  });
  // disabilityCert
  document.querySelectorAll('.pill[data-group="disabilityCert"]').forEach(o => {
    const on = o.dataset.val === form.disabilityCert;
    o.classList.toggle('sel', on);
    const inp = o.querySelector('input');
    if(inp) inp.checked = on;
  });
  // checkboxes
  F('pvtgInput').checked = !!form.pvtg;
  F('pvtgRow').classList.toggle('sel', !!form.pvtg);
  F('disInput').checked = !!form.disability;
  F('disRow').classList.toggle('sel', !!form.disability);

  form = seedFromProfile();

  draft.completed.personal = false;
  saveDraft();

  /* Reflect in DOM */
  F('firstName').value = form.firstName;
  F('lastName').value = form.lastName;
  F('dob').value = form.dob;
  F('mobile').value = form.mobile;
  F('email').value = form.email;

   ========================================================= */
const REQUIRED_FIELDS = [
  'firstName','lastName','dob','gender',
  'mobile','email','state','district','address','domicile',
  'stCertStatus','incomeCert','income'
];

function updateProgress(){
  let filled = 0;
  REQUIRED_FIELDS.forEach(k => {
    const v = form[k];
    if(v !== undefined && v !== null && String(v).trim() !== '') filled++;
  });
  const pct = Math.round(filled / REQUIRED_FIELDS.length * 100);
  const bar = F('progBar');
  const lbl = F('progLabel');
  if(bar) bar.style.width = pct + '%';
  if(lbl) lbl.textContent = filled + ' of ' + REQUIRED_FIELDS.length + ' required fields';
}

/* =========================================================
   VALIDATION
   ========================================================= */
function setInvalid(id, invalid){
  const el = F(id);
  if(!el) return;
  const field = el.closest('.field');
  if(field) field.classList.toggle('invalid', invalid);
}
function setGroupInvalid(errId, invalid){
  const el = F(errId);
  if(el) el.style.display = invalid ? 'block' : 'none';
}

function validate(){
  const errors = [];

  const req = [
    ['firstName', 'Please enter your first name.'],
    ['lastName', 'Please enter your last name.'],
    ['dob', 'Please select your date of birth.'],
    ['mobile', 'Please enter a valid 10-digit mobile number.'],
    ['email', 'Please enter a valid email address.'],
    ['state', 'Please enter your state.'],
    ['district', 'Please enter your district.'],
    ['address', 'Please enter your permanent address.'],
    ['domicile', 'Please enter your domicile state.'],
    ['income', 'Please enter your annual family income.']
  ];

  req.forEach(([id, msg]) => {
    const el = F(id);
    if(!el) return;
    let ok = String(el.value || '').trim() !== '';
    if(id === 'mobile'){
      const digits = String(el.value).replace(/\D/g,'');
      ok = digits.length >= 10;
    }
    if(id === 'email'){
      ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(el.value);
    }
    if(id === 'income'){
      ok = Number(el.value) > 0;
    }
    setInvalid(id, !ok);
    if(!ok) errors.push(msg);
  });

  // gender
  const gOk = !!form.gender;
  setGroupInvalid('errGender', !gOk);
  if(!gOk) errors.push('Please select your gender.');

  // stCertStatus
  const stOk = form.stCertStatus === 'yes' || form.stCertStatus === 'no';
  setGroupInvalid('errStCert', !stOk);
  if(!stOk) errors.push('Please select your ST certificate status.');

  // incomeCert
  const icOk = form.incomeCert === 'yes' || form.incomeCert === 'no';
  setGroupInvalid('errIncomeCert', !icOk);
  if(!icOk) errors.push('Please select your income certificate status.');

  return errors;
}

/* =========================================================
   SAVE / CONTINUE
   ========================================================= */
function persistPersonal(){
  draft.personal = Object.assign({}, form);
  draft.updatedAt = Date.now();
  // Mark complete only if validation passes
  draft.completed.personal = true;
  saveDraft();
}

F('saveBtn').addEventListener('click', () => {
  // Save without enforcing full validation
  draft.personal = Object.assign({}, form);
  draft.updatedAt = Date.now();
  saveDraft();
  toast('Draft saved', 'ok');
});

F('nextBtn').addEventListener('click', () => {
  const errors = validate();
  if(errors.length){
    toast(errors[0], 'err');
    const invalid = document.querySelector('.field.invalid');
    if(invalid){
      const y = invalid.getBoundingClientRect().top + window.scrollY - 110;
      window.scrollTo({top:y, behavior:'smooth'});
    }
    return;
  }
  persistPersonal();
  toast('Personal details saved', 'ok');
  setTimeout(() => {
    location.href = 'academic-details.html?scheme=' + encodeURIComponent(schemeId);
  }, 400);
});

F('backBtn').addEventListener('click', () => {
  // Save silently so nothing is lost
  draft.personal = Object.assign({}, form);
  saveDraft();
  location.href = 'application.html?scheme=' + encodeURIComponent(schemeId);
});

/* =========================================================
   MOBILE SANITIZER
   ========================================================= */
F('mobile').addEventListener('input', (e) => {
  // Keep digits, spaces, plus
  e.target.value = e.target.value.replace(/[^\d+ ]/g, '').slice(0, 14);
});

/* =========================================================
   INIT
   ========================================================= */
updateProgress();
</script>

</body>
