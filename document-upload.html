<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B5E55">
<title>Upload Document · Tribal Scholarship One</title>
<style>
:root{
  --brand:#0B5E55;--brand2:#0E7C6F;--brandsoft:#E6F2F0;
  --bg:#F4F6F8;--card:#fff;--ink:#0F172A;--muted:#64748B;--line:#E2E8F0;
  --ok:#0F9D58;--okbg:#E7F6EE;--warn:#B45309;--warnbg:#FEF3C7;
  --err:#DC2626;--errbg:#FEE2E2;--info:#1D4ED8;--infobg:#DBEAFE;
  --r:14px;--sh:0 1px 2px rgba(15,23,42,.06),0 8px 24px -14px rgba(15,23,42,.2);
  --safeb:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans Devanagari',sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
svg{display:block}

/* ============ SHELL ============ */
.app{min-height:100dvh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:50;background:var(--brand);color:#fff;
  display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:56px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));
}
.topbar .brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.logo{
  width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.15);
  display:grid;place-items:center;flex:none;
}
.logo svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.brand-t{min-width:0}
.brand-t b{display:block;font-size:14px;line-height:1.15;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;font-weight:600}
.brand-t small{display:block;font-size:11px;opacity:.8;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;gap:4px}
.iconbtn{
  width:38px;height:38px;border-radius:10px;border:0;
  background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;
  cursor:pointer;position:relative;
}
.iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}
.iconbtn .dot-badge{
  position:absolute;top:6px;right:6px;width:8px;height:8px;
  border-radius:50%;background:#FBBF24;border:2px solid var(--brand)
}
.sidebar{display:none}
.bottomnav{
  position:fixed;bottom:0;left:0;right:0;z-index:60;background:#fff;
  border-top:1px solid var(--line);display:flex;
  padding:6px 4px calc(6px + var(--safeb));
  box-shadow:0 -4px 16px -8px rgba(15,23,42,.1);
}
.bn-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 2px;border-radius:10px;color:var(--muted);font-size:10.5px;
  font-weight:500;min-width:0;
}
.bn-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
.bn-item.active{color:var(--brand);background:var(--brandsoft)}
.bn-item span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.content{flex:1;padding:14px 14px calc(88px + var(--safeb));min-width:0}
.wrap{max-width:760px;margin:0 auto}

@media(min-width:768px){
  .content{padding:18px 22px calc(92px + var(--safeb))}
  .bottomnav{padding:8px 12px calc(8px + var(--safeb))}
  .bn-item{font-size:11.5px}.bn-item svg{width:24px;height:24px}
}
@media(min-width:1200px){
  .app{
    display:grid;grid-template-columns:250px 1fr;
    grid-template-rows:auto 1fr;
    grid-template-areas:"top top" "side main";
  }
  .topbar{grid-area:top}
  .sidebar{
    grid-area:side;display:block;background:#fff;
    border-right:1px solid var(--line);padding:14px 12px;
    position:sticky;top:56px;height:calc(100dvh - 56px);overflow-y:auto;
  }
  .sidebar .nav-title{
    font-size:11px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--muted);font-weight:600;padding:12px 12px 6px;
  }
  .sidebar a{
    display:flex;align-items:center;gap:12px;padding:10px 12px;
    border-radius:10px;color:var(--ink);font-size:14px;font-weight:500;
    margin-bottom:2px;
  }
  .sidebar a svg{width:20px;height:20px;stroke:currentColor;fill:none;
    stroke-width:1.8;flex:none}
  .sidebar a:hover{background:var(--bg)}
  .sidebar a.active{background:var(--brandsoft);color:var(--brand);font-weight:600}
  .content{grid-area:main;padding:22px 26px}
  .bottomnav{display:none}
}

/* ============ COMMON ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 16px;border-radius:10px;border:1px solid transparent;
  background:#fff;color:var(--ink);font-weight:600;font-size:14px;
  cursor:pointer;line-height:1.2;text-align:center;transition:.15s;
  min-height:44px;
}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:hover{background:#0a4f48}
.btn.ghost{background:#fff;border-color:var(--line)}
.btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn.sm{padding:8px 13px;font-size:13px;min-height:38px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;
  stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.badge{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;
  border-radius:999px;font-size:11.5px;font-weight:600;background:#F1F5F9;
  color:#334155;white-space:nowrap;
}
.badge.ok{background:var(--okbg);color:var(--ok)}
.badge.warn{background:var(--warnbg);color:var(--warn)}
.badge.err{background:var(--errbg);color:var(--err)}
.badge.info{background:var(--infobg);color:var(--info)}
.badge.brand{background:var(--brandsoft);color:var(--brand)}
.badge.neutral{background:#F1F5F9;color:#475569}
.muted{color:var(--muted)}
.sm{font-size:13px}
.xs{font-size:11.5px}
.link{color:var(--brand);font-weight:600;font-size:13.5px}

/* ============ HEAD ============ */
.page-head{margin-bottom:14px}
.breadcrumb{
  display:flex;align-items:center;gap:6px;font-size:12px;
  color:var(--muted);margin-bottom:8px;flex-wrap:wrap;
}
.breadcrumb svg{width:12px;height:12px;stroke:currentColor;fill:none;
  stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.page-head h1{font-size:22px;font-weight:700;margin:0 0 6px}
.page-head p{color:var(--muted);font-size:13.5px;margin:0;max-width:640px}

/* ============ CARD ============ */
.card{
  background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:16px;margin-bottom:14px;box-shadow:var(--sh);
}
.card-h{
  display:flex;align-items:center;gap:10px;margin-bottom:14px;
  flex-wrap:wrap;
}
.card-h .c-ic{
  width:34px;height:34px;border-radius:10px;background:var(--brandsoft);
  display:grid;place-items:center;flex:none;
}
.card-h .c-ic svg{width:18px;height:18px;stroke:var(--brand);fill:none;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.card-h h2{font-size:15px;font-weight:700;margin:0;flex:1}
.card-h .c-step{font-size:11.5px;color:var(--muted);font-weight:600}

/* ============ INFO BANNER ============ */
.info-banner{
  display:flex;gap:12px;padding:13px 14px;border-radius:12px;
  margin-bottom:14px;border:1px solid;
}
.info-banner svg{width:20px;height:20px;stroke:currentColor;fill:none;
  stroke-width:1.9;flex:none;margin-top:1px}
.info-banner p{margin:0;font-size:12.5px;line-height:1.55}
.info-banner b{font-weight:700}
.info-banner.info{background:var(--infobg);color:var(--info);border-color:#BFDBFE}
.info-banner.info p{color:#1E3A8A}
.info-banner.brand{background:var(--brandsoft);color:var(--brand);border-color:#B7D8D3}
.info-banner.brand p{color:#0B5E55}
.info-banner.warn{background:var(--warnbg);color:var(--warn);border-color:#FCD34D}
.info-banner.warn p{color:#78350F}
.info-banner.err{background:var(--errbg);color:var(--err);border-color:#FCA5A5}
.info-banner.err p{color:#7F1D1D}

/* ============ SELECT DOC ============ */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;
  color:#334155}
.field .hint{font-size:12px;color:var(--muted);margin-top:5px}
.field .err{font-size:12px;color:var(--err);margin-top:4px;display:none}
.field.invalid .err{display:block}
.field.invalid select,
.field.invalid input{border-color:var(--err)}
select,input[type="text"]{
  width:100%;padding:11px 13px;border:1px solid var(--line);
  border-radius:10px;background:#fff;font-size:15px;outline:0;min-height:46px;
  transition:.15s;
}
select:focus,input:focus{
  border-color:var(--brand);box-shadow:0 0 0 3px rgba(11,94,85,.12);
}

/* ============ DROPZONE ============ */
.dropzone{
  border:2px dashed #B7D8D3;border-radius:14px;background:var(--brandsoft);
  padding:26px 18px;text-align:center;cursor:pointer;
  transition:.2s;position:relative;overflow:hidden;
}
.dropzone:hover{border-color:var(--brand);background:#D9EBE8}
.dropzone.dragover{
  border-color:var(--brand);background:#CFE6E2;
  transform:scale(1.01);
}
.dropzone .dz-ic{
  width:56px;height:56px;border-radius:16px;background:#fff;
  display:grid;place-items:center;margin:0 auto 12px;
  box-shadow:0 4px 12px -4px rgba(11,94,85,.25);
}
.dropzone .dz-ic svg{width:28px;height:28px;stroke:var(--brand);fill:none;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.dropzone h3{font-size:15px;font-weight:700;margin:0 0 4px;color:var(--brand)}
.dropzone p{margin:0 0 10px;font-size:12.5px;color:#0B5E55;opacity:.85;
  line-height:1.5}
.dropzone .dz-actions{
  display:flex;gap:8px;justify-content:center;flex-wrap:wrap;
}
.dropzone .dz-actions .btn{padding:9px 16px;font-size:13px;min-height:40px}
.dropzone input[type="file"]{display:none}

/* ============ FILE PREVIEW ============ */
.file-preview{
  display:none;background:#fff;border:1px solid var(--line);
  border-radius:14px;padding:14px;margin-bottom:14px;
  box-shadow:var(--sh);
}
.file-preview.show{display:block;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fp-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.fp-ic{
  width:48px;height:48px;border-radius:12px;background:var(--brandsoft);
  display:grid;place-items:center;flex:none;
}
.fp-ic svg{width:24px;height:24px;stroke:var(--brand);fill:none;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.fp-info{flex:1;min-width:0}
.fp-info b{
  display:block;font-size:14px;font-weight:700;margin-bottom:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.fp-info small{display:block;font-size:12px;color:var(--muted)}
.fp-remove{
  width:32px;height:32px;border-radius:8px;border:1px solid var(--line);
  background:#fff;display:grid;place-items:center;cursor:pointer;flex:none;
}
.fp-remove svg{width:16px;height:16px;stroke:var(--err);fill:none;
  stroke-width:2}
.fp-remove:hover{background:var(--errbg);border-color:#FCA5A5}

/* Progress bar */
.upload-progress{
  display:none;margin-bottom:12px;
}
.upload-progress.show{display:block}
.up-head{
  display:flex;justify-content:space-between;align-items:center;
  font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:600;
}
.up-head b{color:var(--ink)}
.up-bar{
  height:8px;background:#E2E8F0;border-radius:99px;overflow:hidden;
}
.up-bar>span{
  display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--brand),var(--brand2));
  transition:width .25s ease;
}

/* Status block */
.status-block{
  display:none;padding:12px 14px;border-radius:11px;gap:11px;
  align-items:flex-start;font-size:13px;line-height:1.5;
}
.status-block.show{display:flex;animation:pop .25s ease}
.status-block .sb-ic{
  width:28px;height:28px;border-radius:8px;display:grid;place-items:center;
  flex:none;background:#fff;
}
.status-block .sb-ic svg{width:16px;height:16px;stroke:currentColor;fill:none;
  stroke-width:2.2}
.status-block.uploading{background:var(--infobg);color:var(--info)}
.status-block.verifying{background:var(--warnbg);color:var(--warn)}
.status-block.success{background:var(--okbg);color:var(--ok)}
.status-block.error{background:var(--errbg);color:var(--err)}
.status-block b{font-weight:700}

/* ============ GUIDELINES ============ */
.guide-list{list-style:none;padding:0;margin:0}
.guide-list li{
  display:flex;gap:11px;align-items:flex-start;padding:10px 0;
  border-bottom:1px solid var(--line);font-size:13px;line-height:1.5;
}
.guide-list li:last-child{border-bottom:0}
.guide-list li .g-ic{
  width:22px;height:22px;border-radius:50%;background:var(--brandsoft);
  display:grid;place-items:center;flex:none;margin-top:1px;
}
.guide-list li .g-ic svg{width:13px;height:13px;stroke:var(--brand);
  fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}

/* ============ DIGILOCKER ALT ============ */
.dl-alt{
  display:flex;gap:12px;padding:14px;background:#EFF6FF;
  border:1px solid #BFDBFE;border-radius:12px;align-items:flex-start;
  margin-bottom:14px;
}
.dl-alt .dl-ic{
  width:40px;height:40px;border-radius:11px;background:#fff;
  display:grid;place-items:center;flex:none;
}
.dl-alt .dl-ic svg{width:22px;height:22px;stroke:#1D4ED8;fill:none;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dl-alt .dl-b{flex:1;min-width:0}
.dl-alt .dl-b b{display:block;font-size:13.5px;font-weight:700;
  color:#1E3A8A;margin-bottom:3px}
.dl-alt .dl-b p{margin:0;font-size:12.5px;color:#1E40AF;line-height:1.5}

/* ============ SAVE BAR ============ */
.save-bar{
  position:sticky;bottom:calc(78px + var(--safeb));
  display:flex;gap:10px;flex-wrap:wrap;
  padding:12px;background:#fff;border:1px solid var(--line);
  border-radius:14px;box-shadow:0 -6px 20px -12px rgba(15,23,42,.25);
  z-index:40;margin-bottom:14px;
}
.save-bar .btn{flex:1;min-width:120px}
@media(min-width:1200px){.save-bar{bottom:16px}}

/* ============ TOAST ============ */
.toast-wrap{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(88px + var(--safeb));z-index:500;
  display:flex;flex-direction:column;gap:8px;pointer-events:none;
  align-items:center;width:calc(100% - 28px);max-width:420px;
}
@media(min-width:1200px){.toast-wrap{bottom:24px}}
.toast{
  background:#0F172A;color:#fff;padding:11px 16px;border-radius:10px;
  font-size:13.5px;font-weight:500;
  box-shadow:0 10px 30px -10px rgba(0,0,0,.35);
  transition:opacity .3s;text-align:center;max-width:100%;
}
.toast.ok{background:var(--ok)}
.toast.err{background:var(--err)}
.toast.warn{background:var(--warn)}

/* JAGO FAB */
.jago-fab{
  position:fixed;right:14px;bottom:calc(78px + var(--safeb));
  width:54px;height:54px;border-radius:50%;
  background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;
  display:grid;place-items:center;
  box-shadow:0 10px 24px -8px rgba(11,94,85,.6);
  z-index:70;border:0;cursor:pointer;
}
.jago-fab svg{width:26px;height:26px;stroke:currentColor;fill:none;
  stroke-width:1.8}
@media(min-width:1200px){
  .jago-fab{bottom:26px;right:26px;width:58px;height:58px}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar" id="topbar"></header>
  <aside class="sidebar" id="sidebar"></aside>
  <main class="content"><div class="wrap" id="page"></div></main>
  <nav class="bottomnav" id="bottomnav"></nav>
</div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
/* =========================================================
   ICONS
   ========================================================= */
const ICONS = {
  dashboard:'<path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/>',
  schemes:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M8 4v16"/>',
  apps:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',

  jago:'<circle cx="12" cy="12" r="9"/><path d="M9 10h.01M15 10h.01M9 15c1.5 1.2 4.5 1.2 6 0"/>',
  notif:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',

  check:'<path d="M5 13l4 4L19 7"/>',
  chev:'<path d="M9 6l6 6-6 6"/>',
  chevL:'<path d="M15 6l-6 6 6 6"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  close:'<path d="M18 6L6 18M6 6l12 12"/>',
  book:'<path d="M4 19.5V5a2 2 0 0 1 2-2h11a1 1 0 0 1 1 1v15"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H18"/><path d="M20 5v14"/>',
  grad:'<path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1 2.7 3 6 3s6-2 6-3v-5"/>',
  star:'<path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/>',
  calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/>',
  bank:'<path d="M3 10l9-6 9 6"/><path d="M5 10v9h14v-9M9 19v-5h6v5"/>',
  help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7"/><path d="M12 17h.01"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function toast(msg, type){
  const w = document.getElementById('toastWrap');
  const t = document.createElement('div');
  t.className = 'toast ' + (type || '');
  t.textContent = msg;
  w.appendChild(t);
  setTimeout(() => {
    t.style.opacity = '0';
    setTimeout(() => t.remove(), 320);
  }, 2400);
}
function fmtBytes(n){
  if(!n && n !== 0) return '—';
  if(n < 1024) return n + ' B';
  if(n < 1024 * 1024) return (n/1024).toFixed(1) + ' KB';
  return (n/(1024*1024)).toFixed(2) + ' MB';
}
function todayShort(){

/* =========================================================
   FILE HANDLING
   ========================================================= */
const MAX_BYTES = 5 * 1024 * 1024;
const ACCEPTED_TYPES = ['application/pdf','image/jpeg','image/jpg','image/png'];

function handleFile(f){
  /* Validate type */
  const name = f.name || 'file';
  const ext = (name.split('.').pop() || '').toLowerCase();
  const typeOk = f._digilocker ||
                 ACCEPTED_TYPES.includes(f.type) ||
                 ['pdf','jpg','jpeg','png'].includes(ext);
  if(!typeOk){
    toast('Only PDF, JPG or PNG files are allowed.', 'err');
    return;
  }
  /* Validate size */
  const size = f.size || 0;
  if(size > MAX_BYTES){
    toast('File is larger than 5 MB. Please choose a smaller file.', 'err');
    return;
  }

  selectedFile = f;

  /* Update preview */
  fpIcon.innerHTML = icon(f._digilocker ? 'link' : (ext === 'pdf' ? 'file' : 'image'));
  fpName.textContent = name;
  fpMeta.textContent = fmtBytes(size) + ' · ' + (f._digilocker ? (f._source || 'DigiLocker (mock)') : 'Local file');
  filePreview.classList.add('show');
  statusBlock.classList.remove('show');
  upProgress.classList.remove('show');

  validateCanUpload();
  toast(f._digilocker ? 'Linked from DigiLocker (demo)' : 'File selected', 'ok');

  /* Scroll into view */
  setTimeout(() => {
    const y = filePreview.getBoundingClientRect().top + window.scrollY - 100;
    window.scrollTo({top:y, behavior:'smooth'});
  }, 100);
}

function validateCanUpload(){
  const docOk = !!docTypeSel.value;
  const fileOk = !!selectedFile;
  uploadBtn.disabled = !(docOk && fileOk);
  docTypeSel.closest('.field').classList.toggle('invalid', !docOk && docTypeSel.dataset.touched === '1');
}

docTypeSel.addEventListener('blur', () => {
  docTypeSel.dataset.touched = '1';
  validateCanUpload();
});

/* =========================================================
   UPLOAD + VERIFY
   ========================================================= */
uploadBtn.addEventListener('click', () => {
  if(!docTypeSel.value){
    toast('Please select a document type', 'err');
    return;
  }
  if(!selectedFile){
    toast('Please choose a file', 'err');
    return;
  }
  runUpload();
});

function runUpload(){
  uploadBtn.disabled = true;
  uploadBtn.innerHTML = icon('clock') + ' Uploading…';

  /* Reset progress */
  upProgress.classList.add('show');
  upBar.style.width = '0%';
  upPct.textContent = '0%';
  upLabel.textContent = selectedFile._digilocker ? 'Linking from DigiLocker…' : 'Uploading…';

  /* Show uploading status */
  statusBlock.className = 'status-block show uploading';
  sbIcon.innerHTML = icon('upload');
  sbText.innerHTML = '<b>Uploading</b> your file. Please wait…';

  let pct = 0;
  const tick = () => {
    pct += Math.floor(Math.random() * 14) + 8;
    if(pct > 100) pct = 100;
    upBar.style.width = pct + '%';
    upPct.textContent = pct + '%';
    if(pct < 100){
      setTimeout(tick, 180);
    } else {
      setTimeout(startVerification, 260);
    }
  };
  setTimeout(tick, 180);
}

function startVerification(){
  upLabel.textContent = 'Verifying…';
  statusBlock.className = 'status-block show verifying';
  sbIcon.innerHTML = icon('shield');
  sbText.innerHTML = '<b>Uploaded.</b> Sending to the mock verification source. This may take a moment.';

  setTimeout(() => {
    finishUpload();
  }, 1600);
}

function finishUpload(){
  const docType = docTypeSel.value;
  const meta = DOC_META[docType] || {icon:'docs', source:'Manual'};
  const isDigi = !!selectedFile._digilocker;

  const newDoc = {
    id: 'doc_' + docType.toLowerCase().replace(/\W+/g,'_') + '_' + Date.now().toString(36),
    type: docType,
    status: isDigi ? 'Verified' : 'Pending',
    required: (scheme.documents || []).includes(docType),
    source: isDigi ? (selectedFile._source || 'DigiLocker (mock)') : (meta.source || 'Manual') + ' (mock)',
    fileName: selectedFile.name,
    size: fmtBytes(selectedFile.size),
    uploaded: todayShort(),
    verifiedOn: isDigi ? todayShort() : '—'
  };

  /* Update state.documents — replace existing or push new */
  const existingIdx = s.documents.findIndex(d => d.type === docType);
  if(existingIdx >= 0){
    s.documents[existingIdx] = Object.assign({}, s.documents[existingIdx], newDoc);
  } else {
    s.documents.push(newDoc);
  }

  /* Add a notification */
  s.notifications.unshift({
    id: 'n' + Date.now(),
    type: isDigi ? 'success' : 'info',
    title: isDigi ? (docType + ' verified') : (docType + ' uploaded'),
    body: isDigi
      ? docType + ' was linked and verified via ' + (selectedFile._source || 'DigiLocker (mock)') + '.'
      : docType + ' has been uploaded and is pending verification.',
    date: 'Just now',
    read: false,
    action: 'document-wallet.html?scheme=' + schemeId
  });

  try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){}

  /* Update draft */
  const uploaded = s.documents
    .filter(d => d.status === 'Verified' || d.status === 'Pending' || d.status === 'Uploaded')
    .map(d => d.type);
  draft.documents = {uploaded: uploaded};
  const reqDocs = s.documents.filter(d => d.required);
  const satisfied = reqDocs.filter(d =>
    d.status === 'Verified' || d.status === 'Pending' || d.status === 'Uploaded' || d.status === 'Not Required'
  );
  draft.completed.documents = satisfied.length === reqDocs.length;
  draft.updatedAt = Date.now();
  try{ localStorage.setItem(draftKey, JSON.stringify(draft)); }catch(e){}

  /* Update UI */
  upBar.style.width = '100%';
  upPct.textContent = '100%';

  statusBlock.className = 'status-block show success';
  sbIcon.innerHTML = icon('check');
  sbText.innerHTML = isDigi
    ? '<b>Verified.</b> ' + esc(docType) + ' was fetched and verified via ' + esc(newDoc.source) + '.'
    : '<b>Uploaded.</b> ' + esc(docType) + ' is now <b>pending verification</b>. You can track the status in your Document Wallet.';

  uploadBtn.innerHTML = icon('check') + ' Uploaded';
  toast(isDigi ? docType + ' verified' : docType + ' uploaded successfully', 'ok');

  /* Show a small action bar to go to wallet or upload another */
  const existingActions = document.getElementById('postUploadActions');
  if(existingActions) existingActions.remove();

  const actions = document.createElement('div');
  actions.id = 'postUploadActions';
  actions.className = 'save-bar';
  actions.style.marginTop = '0';
  actions.innerHTML =
    '<a class="btn ghost" href="document-wallet.html?scheme=' + schemeId + '">' +
      icon('chevL') + ' Back to Wallet' +
    '</a>' +
    '<button class="btn ghost" type="button" id="uploadAnother">' +
      icon('upload') + ' Upload Another' +
    '</button>' +
    '<a class="btn primary" href="verification.html?scheme=' + schemeId + '">' +
      'Continue to Verification ' + icon('arrowR') +
    '</a>';
  filePreview.parentNode.insertBefore(actions, filePreview.nextSibling);

  document.getElementById('uploadAnother').addEventListener('click', () => {
    /* Reset form */
    selectedFile = null;
    fileInput.value = '';
    filePreview.classList.remove('show');
    upProgress.classList.remove('show');
    statusBlock.classList.remove('show');
    upBar.style.width = '0%';
    upPct.textContent = '0%';
    docTypeSel.value = '';
    docHint.style.display = 'none';
    uploadBtn.disabled = true;
    uploadBtn.innerHTML = icon('upload') + ' Upload & Verify';
    const acts = document.getElementById('postUploadActions');
    if(acts) acts.remove();
    window.scrollTo({top:0, behavior:'smooth'});
  });

  /* Scroll the status into view */
  setTimeout(() => {
    const y = statusBlock.getBoundingClientRect().top + window.scrollY - 120;
    window.scrollTo({top:y, behavior:'smooth'});
  }, 150);
}

/* =========================================================
   BACK
   ========================================================= */
F('backBtn').addEventListener('click', () => {
  location.href = 'document-wallet.html?scheme=' + encodeURIComponent(schemeId);
});

/* =========================================================
   INIT
   ========================================================= */
if(prefillDoc){
  /* Fire change to populate hint */
  docTypeSel.dispatchEvent(new Event('change'));
}
validateCanUpload();
