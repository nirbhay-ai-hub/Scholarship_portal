<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B5E55">
<title>Eligibility Check · Tribal Scholarship One</title>
<style>
:root{
  --brand:#0B5E55;--brand2:#0E7C6F;--brandsoft:#E6F2F0;
  --bg:#F4F6F8;--card:#fff;--ink:#0F172A;--muted:#64748B;--line:#E2E8F0;
  --ok:#0F9D58;--okbg:#E7F6EE;--warn:#B45309;--warnbg:#FEF3C7;
  --err:#DC2626;--errbg:#FEE2E2;--info:#1D4ED8;--infobg:#DBEAFE;
  --r:14px;--sh:0 1px 2px rgba(15,23,42,.06),0 8px 24px -14px rgba(15,23,42,.2);
  --safeb:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans Devanagari',sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
svg{display:block}

/* ============ SHELL ============ */
.app{min-height:100dvh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:50;background:var(--brand);color:#fff;
  display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:56px;
  padding-top:calc(10px + env(safe-area-inset-top,0px))}
.topbar .brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.logo{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.15);
  display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.brand-t{min-width:0}
.brand-t b{display:block;font-size:14px;line-height:1.15;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;font-weight:600}
.brand-t small{display:block;font-size:11px;opacity:.8;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;gap:4px}
.iconbtn{width:38px;height:38px;border-radius:10px;border:0;
  background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;
  cursor:pointer;position:relative}
.iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}
.iconbtn .dot-badge{position:absolute;top:6px;right:6px;width:8px;height:8px;
  border-radius:50%;background:#FBBF24;border:2px solid var(--brand)}
.sidebar{display:none}
.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:60;background:#fff;
  border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + var(--safeb));
  box-shadow:0 -4px 16px -8px rgba(15,23,42,.1)}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 2px;border-radius:10px;color:var(--muted);font-size:10.5px;
  font-weight:500;min-width:0}
.bn-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
.bn-item.active{color:var(--brand);background:var(--brandsoft)}
.bn-item span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.content{flex:1;padding:14px 14px calc(88px + var(--safeb));min-width:0}
.wrap{max-width:900px;margin:0 auto}
@media(min-width:768px){
  .content{padding:18px 22px calc(92px + var(--safeb))}
  .bottomnav{padding:8px 12px calc(8px + var(--safeb))}
  .bn-item{font-size:11.5px}.bn-item svg{width:24px;height:24px}
}
@media(min-width:1200px){
  .app{display:grid;grid-template-columns:250px 1fr;
    grid-template-rows:auto 1fr;grid-template-areas:"top top" "side main"}
  .topbar{grid-area:top}
  .sidebar{grid-area:side;display:block;background:#fff;border-right:1px solid var(--line);
    padding:14px 12px;position:sticky;top:56px;height:calc(100dvh - 56px);overflow-y:auto}
  .sidebar .nav-title{font-size:11px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--muted);font-weight:600;padding:12px 12px 6px}
  .sidebar a{display:flex;align-items:center;gap:12px;padding:10px 12px;
    border-radius:10px;color:var(--ink);font-size:14px;font-weight:500;margin-bottom:2px}
  .sidebar a svg{width:20px;height:20px;stroke:currentColor;fill:none;
    stroke-width:1.8;flex:none}
  .sidebar a:hover{background:var(--bg)}
  .sidebar a.active{background:var(--brandsoft);color:var(--brand);font-weight:600}
  .content{grid-area:main;padding:22px 26px}
  .bottomnav{display:none}
  .wrap{max-width:920px}
}

/* ============ COMMON ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 16px;border-radius:10px;border:1px solid transparent;background:#fff;
  color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;line-height:1.2;
  text-align:center;transition:.15s;min-height:44px}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:hover{background:#0a4f48}
.btn.ghost{background:#fff;border-color:var(--line)}
.btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn.sm{padding:8px 13px;font-size:13px;min-height:38px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;
  stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;
  border-radius:999px;font-size:11.5px;font-weight:600;background:#F1F5F9;
  color:#334155;white-space:nowrap}
.badge.ok{background:var(--okbg);color:var(--ok)}
.badge.warn{background:var(--warnbg);color:var(--warn)}
.badge.err{background:var(--errbg);color:var(--err)}
.badge.info{background:var(--infobg);color:var(--info)}
.badge.brand{background:var(--brandsoft);color:var(--brand)}
.muted{color:var(--muted)}.sm{font-size:13px}.xs{font-size:11.5px}
.link{color:var(--brand);font-weight:600;font-size:13.5px}

/* ============ PAGE HEAD ============ */
.page-head{margin-bottom:14px}
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:12px;
  color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
.breadcrumb svg{width:12px;height:12px;stroke:currentColor;fill:none;
  stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.page-head h1{font-size:22px;font-weight:700;margin:0 0 6px}
.page-head p{color:var(--muted);font-size:13.5px;margin:0;max-width:640px}

/* ============ SCHEME PICKER ============ */
.scheme-pick{
  display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;margin-bottom:8px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch
}
.scheme-pick::-webkit-scrollbar{display:none}
.sp{
  flex:none;display:flex;align-items:center;gap:9px;padding:10px 14px;
  background:#fff;border:1.5px solid var(--line);border-radius:12px;
  font-size:13px;font-weight:600;cursor:pointer;transition:.15s;
  min-height:52px;max-width:260px
}
.sp svg{width:20px;height:20px;stroke:var(--brand);fill:none;
  stroke-width:1.8;flex:none}
.sp .sp-t{text-align:left;line-height:1.2;overflow:hidden}
.sp .sp-t b{display:block;font-size:13px;font-weight:600;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.sp .sp-t small{font-size:10.5px;color:var(--muted);display:block}
.sp:hover{border-color:var(--brand)}
.sp.active{border-color:var(--brand);background:var(--brandsoft)}
.sp.active svg{stroke:var(--brand)}

/* ============ INFO BANNERS ============ */
.info-banner{display:flex;gap:12px;padding:13px 14px;border-radius:12px;
  margin-bottom:14px;border:1px solid}
.info-banner svg{width:20px;height:20px;stroke:currentColor;fill:none;
  stroke-width:1.9;flex:none;margin-top:1px}
.info-banner p{margin:0;font-size:12.5px;line-height:1.55}
.info-banner b{font-weight:700}
.info-banner.info{background:var(--infobg);color:var(--info);border-color:#BFDBFE}
.info-banner.info p{color:#1E3A8A}
.info-banner.warn{background:var(--warnbg);color:var(--warn);border-color:#FCD34D}
.info-banner.warn p{color:#78350F}
.info-banner.brand{background:var(--brandsoft);color:var(--brand);border-color:#B7D8D3}
.info-banner.brand p{color:#0B5E55}

/* ============ FORM ============ */
.card{background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-h .c-ic{width:34px;height:34px;border-radius:10px;background:var(--brandsoft);
  display:grid;place-items:center;flex:none}
.card-h .c-ic svg{width:18px;height:18px;stroke:var(--brand);fill:none;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.card-h h2{font-size:15px;font-weight:700;margin:0;flex:1}
.card-h .c-step{font-size:11.5px;color:var(--muted);font-weight:600}

.field{margin-bottom:14px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;
  color:#334155}
.field .hint{font-size:12px;color:var(--muted);margin-top:5px}
.field .err{font-size:12px;color:var(--err);margin-top:4px;display:none}
.field.invalid .err{display:block}
.field.invalid input,.field.invalid select{border-color:var(--err)}
input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--line);
  border-radius:10px;background:#fff;font-size:15px;outline:0;min-height:46px;
  transition:.15s}
textarea{resize:vertical;min-height:70px;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--brand);
  box-shadow:0 0 0 3px rgba(11,94,85,.12)}
.input-group{position:relative}
.input-group .prefix{position:absolute;left:13px;top:50%;transform:translateY(-50%);
  font-size:14px;color:var(--muted);font-weight:600;pointer-events:none}
.input-group input{padding-left:34px}
.grid2{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:560px){.grid2{grid-template-columns:1fr 1fr}}

/* radio group */
.radio-group{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.radio-group.two{grid-template-columns:repeat(2,1fr)}
.radio-opt{position:relative;display:flex;align-items:center;justify-content:center;
  padding:11px 8px;border:1.5px solid var(--line);border-radius:10px;
  background:#fff;font-size:13px;font-weight:600;cursor:pointer;text-align:center;
  min-height:44px;transition:.15s;line-height:1.2}
.radio-opt:hover{border-color:var(--brand)}
.radio-opt input{position:absolute;opacity:0;pointer-events:none}
.radio-opt.sel{border-color:var(--brand);background:var(--brandsoft);color:var(--brand)}

/* checkbox row */
.check-row{display:flex;align-items:flex-start;gap:11px;padding:11px 13px;
  border:1.5px solid var(--line);border-radius:10px;cursor:pointer;
  font-size:13.5px;transition:.15s}
.check-row:hover{border-color:var(--brand)}
.check-row input{width:18px;height:18px;margin-top:2px;flex:none;
  accent-color:var(--brand);min-height:auto;padding:0}
.check-row.sel{border-color:var(--brand);background:var(--brandsoft)}
.check-row b{font-weight:600;display:block}
.check-row small{font-size:12px;color:var(--muted);display:block;margin-top:2px}

/* action row */
.form-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.form-actions .btn{flex:1;min-width:140px}

/* progress */
.prog-wrap{background:#fff;border:1px solid var(--line);border-radius:12px;
  padding:13px 14px;margin-bottom:14px;box-shadow:var(--sh)}
.prog-head{display:flex;justify-content:space-between;align-items:center;
  gap:10px;margin-bottom:8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.prog-head b{color:var(--ink);font-size:13px}
.progress{height:8px;border-radius:99px;background:#E2E8F0;overflow:hidden}
.progress>span{display:block;height:100%;
  background:linear-gradient(90deg,var(--brand),var(--brand2));
  border-radius:99px;transition:width .35s ease}

/* ============ RESULT CARD ============ */
.result-card{
  border-radius:16px;padding:20px;margin-bottom:14px;
  border:1.5px solid;box-shadow:var(--sh);display:none
}
.result-card.show{display:block;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.result-card.ok{background:linear-gradient(135deg,#ECFDF5,#D1FAE5);border-color:#6EE7B7}
.result-card.err{background:linear-gradient(135deg,#FEF2F2,#FEE2E2);border-color:#FCA5A5}
.result-card.warn{background:linear-gradient(135deg,#FFFBEB,#FEF3C7);border-color:#FCD34D}
.res-head{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.res-ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;
  flex:none;background:#fff}
.res-ic svg{width:28px;height:28px;stroke:currentColor;fill:none;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.result-card.ok .res-ic{color:var(--ok)}
.result-card.err .res-ic{color:var(--err)}
.result-card.warn .res-ic{color:var(--warn)}
.res-head .res-t{flex:1;min-width:0}
.res-head .res-t b{display:block;font-size:18px;font-weight:700;margin-bottom:3px}
.result-card.ok .res-t b{color:#065F46}
.result-card.err .res-t b{color:#991B1B}
.result-card.warn .res-t b{color:#92400E}
.res-head .res-t small{font-size:12.5px;color:var(--muted);display:block;
  line-height:1.4}
.res-meter{display:flex;align-items:center;gap:12px;margin-bottom:14px;
  padding:12px;background:rgba(255,255,255,.65);border-radius:11px}
.res-meter .rm-l{font-size:12px;font-weight:600;color:#334155;flex:none}
.res-meter .rm-bar{flex:1;height:8px;background:#fff;border-radius:99px;
  overflow:hidden}
.res-meter .rm-bar>span{display:block;height:100%;border-radius:99px;
  transition:width .5s}
.result-card.ok .rm-bar>span{background:var(--ok)}
.result-card.err .rm-bar>span{background:var(--err)}
.result-card.warn .rm-bar>span{background:#F59E0B}
.res-meter .rm-v{font-size:14px;font-weight:700;flex:none}
.result-card.ok .rm-v{color:var(--ok)}
.result-card.err .rm-v{color:var(--err)}
.result-card.warn .rm-v{color:var(--warn)}

.res-rules{list-style:none;padding:0;margin:0 0 14px}
.res-rules li{display:flex;gap:11px;align-items:flex-start;padding:10px 12px;
  background:rgba(255,255,255,.7);border-radius:10px;margin-bottom:6px;
  font-size:13px;line-height:1.45}
.res-rules li:last-child{margin-bottom:0}
.res-rules .r-ic{width:20px;height:20px;border-radius:50%;display:grid;
  place-items:center;flex:none;margin-top:1px}
.res-rules .r-ic svg{width:12px;height:12px;stroke:#fff;fill:none;
  stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.res-rules .r-ic.pass{background:var(--ok)}
.res-rules .r-ic.fail{background:var(--err)}
.res-rules .r-ic.review{background:#F59E0B}
.res-rules li b{display:block;font-weight:600}
.res-rules li small{font-size:12px;color:var(--muted);display:block;margin-top:1px}

.res-actions{display:flex;gap:10px;flex-wrap:wrap}
.res-actions .btn{flex:1;min-width:140px}
.res-note{font-size:11.5px;color:var(--muted);margin-top:12px;line-height:1.5;
  padding-top:12px;border-top:1px solid rgba(0,0,0,.08)}

/* ============ HELP BLOCK ============ */
.help-block{background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:16px;box-shadow:var(--sh);margin-bottom:14px}
.help-block h3{font-size:15px;font-weight:700;margin:0 0 12px;
  display:flex;align-items:center;gap:9px}
.help-block h3 svg{width:18px;height:18px;stroke:var(--brand);fill:none;
  stroke-width:1.9}
.help-grid{display:grid;gap:10px}
@media(min-width:600px){.help-grid{grid-template-columns:1fr 1fr}}
.help-item{display:flex;gap:11px;align-items:flex-start;padding:12px;
  background:var(--bg);border-radius:10px;font-size:13px;line-height:1.5}
.help-item .hi-ic{width:30px;height:30px;border-radius:8px;background:#fff;
  display:grid;place-items:center;flex:none}
.help-item .hi-ic svg{width:16px;height:16px;stroke:var(--brand);fill:none;
  stroke-width:1.9}
.help-item b{display:block;font-weight:600;margin-bottom:2px}
.help-item small{font-size:12px;color:var(--muted);display:block}

/* ============ TOAST ============ */
.toast-wrap{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(88px + var(--safeb));z-index:300;display:flex;flex-direction:column;
  gap:8px;pointer-events:none;align-items:center;width:calc(100% - 28px);
  max-width:420px}
@media(min-width:1200px){.toast-wrap{bottom:24px}}
.toast{background:#0F172A;color:#fff;padding:11px 16px;border-radius:10px;
  font-size:13.5px;font-weight:500;box-shadow:0 10px 30px -10px rgba(0,0,0,.35);
  transition:opacity .3s;text-align:center;max-width:100%}
.toast.ok{background:var(--ok)}.toast.err{background:var(--err)}

/* JAGO FAB */
.jago-fab{position:fixed;right:14px;bottom:calc(78px + var(--safeb));
  width:54px;height:54px;border-radius:50%;
  background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;
  display:grid;place-items:center;
  box-shadow:0 10px 24px -8px rgba(11,94,85,.6);z-index:70;border:0;cursor:pointer}
.jago-fab svg{width:26px;height:26px;stroke:currentColor;fill:none;
  stroke-width:1.8}
@media(min-width:1200px){.jago-fab{bottom:26px;right:26px;width:58px;height:58px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar" id="topbar"></header>
  <aside class="sidebar" id="sidebar"></aside>
  <main class="content"><div class="wrap" id="page"></div></main>
  <nav class="bottomnav" id="bottomnav"></nav>
</div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
/* =========================================================
   ICONS
   ========================================================= */
const ICONS={
  dashboard:'<path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/>',
  schemes:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M8 4v16"/>',
  apps:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  docs:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
  pay:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',
  jago:'<circle cx="12" cy="12" r="9"/><path d="M9 10h.01M15 10h.01M9 15c1.5 1.2 4.5 1.2 6 0"/>',
  notif:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
  profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>',
  check:'<path d="M5 13l4 4L19 7"/>',
  chev:'<path d="M9 6l6 6-6 6"/>',
  chevL:'<path d="M15 6l-6 6 6 6"/>',
  chevD:'<path d="M6 9l6 6 6-6"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  close:'<path d="M18 6L6 18M6 6l12 12"/>',
  book:'<path d="M4 19.5V5a2 2 0 0 1 2-2h11a1 1 0 0 1 1 1v15"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H18"/><path d="M20 5v14"/>',
  grad:'<path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1 2.7 3 6 3s6-2 6-3v-5"/>',
  star:'<path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/>',
  calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',

function toast(msg,type){

function ageFromDob(dob){
  if(!dob) return '';
  const d=new Date(dob);
  if(isNaN(d.getTime())) return '';
  const diff=Date.now()-d.getTime();
  return Math.floor(diff/(365.25*24*60*60*1000));
}

        </label>
        <label class="radio-opt ${formData.hasExisting==='yes'?'sel':''}" data-group="hasExisting" data-val="yes">
          <input type="radio" name="hasExisting" value="yes" ${formData.hasExisting==='yes'?'checked':''}> Yes
        </label>
      </div>
    </div>

    <div class="field" id="existingSchemeField" style="display:${formData.hasExisting==='yes'?'block':'none'}">
      <label for="existingScheme">Which scheme?</label>
      <select id="existingScheme">
        <option value="">Select scheme</option>
        ${s.schemes.map(sc=>`<option value="${sc.id}" ${formData.existingScheme===sc.id?'selected':''}>${esc(sc.name)}</option>`).join('')}
        <option value="other" ${formData.existingScheme==='other'?'selected':''}>Other</option>
      </select>
      <div class="hint">Only one scholarship per academic year is permitted under MoTA schemes.</div>
    </div>
  </section>

  <!-- Submit -->
  <button class="btn primary block" id="checkBtn" type="button" style="margin-bottom:14px">
    ${icon('shield')} Check My Eligibility
  </button>

  <!-- Result -->
  <section class="result-card" id="resultCard" aria-live="polite"></section>

  <!-- Help -->
  <section class="help-block">
    <h3>${icon('help')} Need help?</h3>
    <div class="help-grid">
      <div class="help-item">
        <span class="hi-ic">${icon('jago')}</span>
        <span><b>Ask JAGO</b><small>Get instant answers about eligibility and documents.</small></span>
      </div>
      <div class="help-item">
        <span class="hi-ic">${icon('search')}</span>
        <span><b>Existing scholarship check</b><small>Detect conflicts before you apply.</small></span>
      </div>
      <div class="help-item">
        <span class="hi-ic">${icon('docs')}</span>
        <span><b>Document wallet</b><small>Upload documents once and reuse them.</small></span>
      </div>
      <div class="help-item">
        <span class="hi-ic">${icon('apps')}</span>
        <span><b>Start application</b><small>Begin the multi-step application process.</small></span>
      </div>
    </div>
    <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">
      <a class="btn ghost sm" href="jago.html">${icon('jago')} Ask JAGO</a>
      <a class="btn ghost sm" href="scholarship-check.html">${icon('search')} Existing scholarship</a>
    </div>
  </section>
`;

/* =========================================================
   BINDINGS
   ========================================================= */
const F=id=>document.getElementById(id);

/* Scheme picker */
document.querySelectorAll('.sp').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.sp').forEach(b=>{
      b.classList.remove('active');b.setAttribute('aria-selected','false');
    });
    btn.classList.add('active');
    btn.setAttribute('aria-selected','true');
    currentScheme=btn.dataset.scheme;
    // update URL without reload
    const u=new URL(location.href);
    u.searchParams.set('scheme',currentScheme);
    history.replaceState(null,'',u);
    // hide any previous result
    F('resultCard').classList.remove('show','ok','err','warn');
    F('resultCard').innerHTML='';
    // update page title crumb
    document.querySelector('.brand-t small').textContent='Home / Schemes / '+ (s.schemes.find(x=>x.id===currentScheme)||{}).name;
    toast('Scheme changed to '+(s.schemes.find(x=>x.id===currentScheme)||{}).name,'ok');
  });
});

/* Radio group behaviour */
document.querySelectorAll('.radio-opt').forEach(opt=>{
  opt.addEventListener('click',()=>{
    const group=opt.dataset.group;
    const val=opt.dataset.val;
    document.querySelectorAll(`.radio-opt[data-group="${group}"]`).forEach(o=>{
      o.classList.toggle('sel',o===opt);
      const inp=o.querySelector('input');
      if(inp) inp.checked=(o===opt);
    });
    formData[group]=val;
    if(group==='hasExisting'){
      F('existingSchemeField').style.display=val==='yes'?'block':'none';
    }
    saveDraft();updateProgress();
  });
});

/* Checkbox rows */
function bindCheckRow(rowId,inputId,key){
  const row=F(rowId),inp=F(inputId);
  if(!row||!inp)return;
  inp.addEventListener('change',()=>{
    row.classList.toggle('sel',inp.checked);
    formData[key]=inp.checked;
    saveDraft();updateProgress();
  });
}
bindCheckRow('pvtgRow','pvtgInput','pvtg');
bindCheckRow('disRow','disInput','disability');

/* Text/number/select inputs */
const FIELD_MAP={
  income:'income',state:'state',district:'district',
  courseLevel:'courseLevel',courseName:'courseName',
  academicYear:'academicYear',marks:'marks',age:'age',
  institution:'institution',instType:'instType',
  existingScheme:'existingScheme'
};
Object.keys(FIELD_MAP).forEach(id=>{
  const el=F(id);if(!el)return;
  el.addEventListener('input',()=>{formData[FIELD_MAP[id]]=el.value;saveDraft();updateProgress()});
  el.addEventListener('change',()=>{formData[FIELD_MAP[id]]=el.value;saveDraft();updateProgress()});
});

/* Auto-fill */
F('autoFillBtn').addEventListener('click',()=>{
  formData.category='ST';
  formData.pvtg=!!p.pvtg;
  formData.disability=!!p.disability;
  formData.income=p.income||formData.income;
  formData.state=p.state||formData.state;
  formData.district=p.district||formData.district;
  formData.courseName=p.course||formData.courseName;
  formData.institution=p.institution||formData.institution;
  formData.academicYear=p.academicYear||formData.academicYear;
  formData.marks=p.marks?String(p.marks).replace('%',''):formData.marks;
  formData.age=ageFromDob(p.dob)||formData.age;

  // reflect in DOM
  F('income').value=formData.income;
  F('state').value=formData.state;
  F('district').value=formData.district;
  F('courseName').value=formData.courseName;
  F('institution').value=formData.institution;
  F('academicYear').value=formData.academicYear;
  F('marks').value=formData.marks;
  F('age').value=formData.age;
  F('pvtgInput').checked=formData.pvtg;
  F('pvtgRow').classList.toggle('sel',formData.pvtg);
  F('disInput').checked=formData.disability;
  F('disRow').classList.toggle('sel',formData.disability);

  saveDraft();updateProgress();
  toast('Filled from your saved profile','ok');
});

/* Reset */
F('resetBtn').addEventListener('click',()=>{
  if(!confirm('Reset all fields on this page? This will not affect your profile.'))return;
  formData=Object.assign({},DEFAULTS);
  try{localStorage.removeItem('tso_eligibility_draft')}catch(e){}
  location.reload();
});

/* =========================================================
   PROGRESS
   ========================================================= */
function updateProgress(){
  const required=[
    formData.category,formData.income,formData.state,
    formData.courseLevel,formData.academicYear,formData.instType,
    formData.hasExisting
  ];
  const filled=required.filter(v=>String(v||'').trim()!=='').length;
  const pct=Math.round(filled/required.length*100);
  const bar=F('progBar'),lbl=F('progLabel');
  if(bar)bar.style.width=pct+'%';
  if(lbl)lbl.textContent=filled+' of '+required.length+' required fields';
}

/* =========================================================
   DRAFT
   ========================================================= */
function saveDraft(){
  try{localStorage.setItem('tso_eligibility_draft',JSON.stringify(formData))}catch(e){}
}

/* =========================================================
   VALIDATE + EVALUATE
   ========================================================= */
function validate(){
  const errors=[];
  const checks=[
    ['income','Please enter your annual family income.'],
    ['state','Please enter your state.'],
    ['courseLevel','Please select your current course / class.'],
    ['instType','Please select your institution type.']
  ];
  checks.forEach(([id,msg])=>{
    const el=F(id);
    const val=formData[FIELD_MAP[id]];
    const ok=String(val||'').trim()!=='';
    el.closest('.field').classList.toggle('invalid',!ok);
    if(!ok)errors.push(msg);
  });
  return errors;
}

function evaluate(){
  const rules=RULES[currentScheme]||[];
  return rules.map(r=>{
    let status;
    try{status=r.check(formData)}catch(e){status='review'}
    if(!['pass','fail','review'].includes(status))status='review';
    return {id:r.id,label:r.label,note:r.note,status};
  });
}

/* =========================================================
   CHECK BUTTON
   ========================================================= */
F('checkBtn').addEventListener('click',()=>{
  const errs=validate();
  if(errs.length){
    toast(errs[0],'err');
    const firstInvalid=document.querySelector('.field.invalid');
    if(firstInvalid){
      const y=firstInvalid.getBoundingClientRect().top+window.scrollY-100;
      window.scrollTo({top:y,behavior:'smooth'});
    }
    return;
  }
  saveDraft();
  const results=evaluate();
  showResult(results);
});

function showResult(results){
  const card=F('resultCard');
  const fails=results.filter(r=>r.status==='fail').length;
  const reviews=results.filter(r=>r.status==='review').length;
  const passes=results.filter(r=>r.status==='pass').length;
  const total=results.length;
  const pct=Math.round(passes/total*100);

  let verdict,verdictCls,verdictIcon,verdictMsg;
  if(fails>0){
    verdict='Not Eligible';verdictCls='err';verdictIcon='x';
    verdictMsg='Based on the demo rules, one or more conditions are not met for this scheme. You may still be eligible for another scheme.';
  } else if(reviews>0){
    verdict='Needs Manual Review';verdictCls='warn';verdictIcon='alert';
    verdictMsg='Some conditions could not be verified automatically. A verification officer may need to review your details.';
  } else {
    verdict='Eligible';verdictCls='ok';verdictIcon='check';
    verdictMsg='Based on the demo rules, you appear to meet all the conditions for this scheme. You can proceed to the next step.';
  }

  const schemeName=(s.schemes.find(x=>x.id===currentScheme)||{}).name||'Scheme';

  card.className='result-card show '+verdictCls;
  card.innerHTML=`
    <div class="res-head">
      <span class="res-ic">${icon(verdictIcon)}</span>
      <span class="res-t">
        <b>${esc(verdict)}</b>
        <small>${esc(schemeName)}</small>
      </span>
    </div>
    <div class="res-meter">
      <span class="rm-l">Conditions met</span>
      <span class="rm-bar"><span style="width:${pct}%"></span></span>
      <span class="rm-v">${passes}/${total}</span>
    </div>
    <ul class="res-rules">
      ${results.map(r=>`
        <li>
          <span class="r-ic ${r.status}">${icon(r.status==='pass'?'check':r.status==='fail'?'x':'alert')}</span>
          <div>
            <b>${esc(r.label)}</b>
            <small>${esc(r.note)}</small>
          </div>
        </li>`).join('')}
    </ul>
    <div class="res-actions">
      ${verdictCls==='ok'
        ? `<a class="btn primary" href="application.html?scheme=${currentScheme}">
             ${icon('apps')} Start Application
           </a>
           <a class="btn ghost" href="scholarship-check.html?scheme=${currentScheme}">
             ${icon('search')} Existing Scholarship Check
           </a>`
        : verdictCls==='warn'
        ? `<a class="btn primary" href="verification.html">
             ${icon('shield')} Go to Verification
           </a>
           <a class="btn ghost" href="document-wallet.html">
             ${icon('docs')} Check Documents
           </a>`
        : `<a class="btn primary" href="schemes.html">
             ${icon('schemes')} Explore Other Schemes
           </a>
           <a class="btn ghost" href="jago.html">
             ${icon('jago')} Ask JAGO
           </a>`}
    </div>
    <p class="res-note">
      This result is based on demo rules for prototype demonstration only. Please refer to the official MoTA scheme guidelines before applying.
    </p>
  `;

  // scroll into view
  setTimeout(()=>{
    const y=card.getBoundingClientRect().top+window.scrollY-90;
    window.scrollTo({top:y,behavior:'smooth'});
  },80);

  // Save the check history
  try{
    const history=JSON.parse(localStorage.getItem('tso_eligibility_history')||'[]');
    history.unshift({
      scheme:currentScheme,verdict,at:new Date().toISOString(),
      passes,total,pct
    });
    localStorage.setItem('tso_eligibility_history',JSON.stringify(history.slice(0,10)));
  }catch(e){}

  toast('Eligibility check complete','ok');
}

/* =========================================================
   INIT
   ========================================================= */
updateProgress();
</script>
<script src="lang.js"></script>
</body>
</html>
