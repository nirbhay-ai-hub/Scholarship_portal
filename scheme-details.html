<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B5E55">
<title>Scheme Details · Tribal Scholarship One</title>
<style>
:root{
  --brand:#0B5E55;--brand2:#0E7C6F;--brandsoft:#E6F2F0;
  --bg:#F4F6F8;--card:#fff;--ink:#0F172A;--muted:#64748B;--line:#E2E8F0;
  --ok:#0F9D58;--okbg:#E7F6EE;--warn:#B45309;--warnbg:#FEF3C7;
  --err:#DC2626;--errbg:#FEE2E2;--info:#1D4ED8;--infobg:#DBEAFE;
  --r:14px;--sh:0 1px 2px rgba(15,23,42,.06),0 8px 24px -14px rgba(15,23,42,.2);
  --safeb:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans Devanagari',sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
svg{display:block}

/* ============ SHELL ============ */
.app{min-height:100dvh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:50;background:var(--brand);color:#fff;
  display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:56px;
  padding-top:calc(10px + env(safe-area-inset-top,0px))}
.topbar .brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.logo{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.15);
  display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.brand-t{min-width:0}
.brand-t b{display:block;font-size:14px;line-height:1.15;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;font-weight:600}
.brand-t small{display:block;font-size:11px;opacity:.8;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;gap:4px}
.iconbtn{width:38px;height:38px;border-radius:10px;border:0;
  background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;
  cursor:pointer;position:relative}
.iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}
.iconbtn .dot-badge{position:absolute;top:6px;right:6px;width:8px;height:8px;
  border-radius:50%;background:#FBBF24;border:2px solid var(--brand)}
.sidebar{display:none}
.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:60;background:#fff;
  border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + var(--safeb));
  box-shadow:0 -4px 16px -8px rgba(15,23,42,.1)}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 2px;border-radius:10px;color:var(--muted);font-size:10.5px;
  font-weight:500;min-width:0}
.bn-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
.bn-item.active{color:var(--brand);background:var(--brandsoft)}
.bn-item span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.content{flex:1;padding:14px 14px calc(88px + var(--safeb));min-width:0}
.wrap{max-width:1200px;margin:0 auto}
@media(min-width:768px){
  .content{padding:18px 22px calc(92px + var(--safeb))}
  .bottomnav{padding:8px 12px calc(8px + var(--safeb))}
  .bn-item{font-size:11.5px}.bn-item svg{width:24px;height:24px}
}
@media(min-width:1200px){
  .app{display:grid;grid-template-columns:250px 1fr;
    grid-template-rows:auto 1fr;grid-template-areas:"top top" "side main"}
  .topbar{grid-area:top}
  .sidebar{grid-area:side;display:block;background:#fff;border-right:1px solid var(--line);
    padding:14px 12px;position:sticky;top:56px;height:calc(100dvh - 56px);overflow-y:auto}
  .sidebar .nav-title{font-size:11px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--muted);font-weight:600;padding:12px 12px 6px}
  .sidebar a{display:flex;align-items:center;gap:12px;padding:10px 12px;
    border-radius:10px;color:var(--ink);font-size:14px;font-weight:500;margin-bottom:2px}
  .sidebar a svg{width:20px;height:20px;stroke:currentColor;fill:none;
    stroke-width:1.8;flex:none}
  .sidebar a:hover{background:var(--bg)}
  .sidebar a.active{background:var(--brandsoft);color:var(--brand);font-weight:600}
  .content{grid-area:main;padding:22px 26px}
  .bottomnav{display:none}
  .wrap{max-width:1180px}
}

/* ============ COMMON ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 16px;border-radius:10px;border:1px solid transparent;background:#fff;
  color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;line-height:1.2;
  text-align:center;transition:.15s;min-height:42px}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:hover{background:#0a4f48}
.btn.ghost{background:#fff;border-color:var(--line)}
.btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn.sm{padding:8px 13px;font-size:13px;min-height:38px}
.btn.block{width:100%}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;
  stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;
  border-radius:999px;font-size:11.5px;font-weight:600;background:#F1F5F9;
  color:#334155;white-space:nowrap}
.badge.ok{background:var(--okbg);color:var(--ok)}
.badge.warn{background:var(--warnbg);color:var(--warn)}
.badge.err{background:var(--errbg);color:var(--err)}
.badge.info{background:var(--infobg);color:var(--info)}
.badge.brand{background:var(--brandsoft);color:var(--brand)}
.muted{color:var(--muted)}.sm{font-size:13px}.xs{font-size:11.5px}
.link{color:var(--brand);font-weight:600;font-size:13.5px}

/* ============ HERO ============ */
.detail-hero{
  background:linear-gradient(135deg,var(--brand),var(--brand2));
  color:#fff;border-radius:16px;padding:20px;margin-bottom:16px;position:relative;
  overflow:hidden
}
.detail-hero::before{
  content:"";position:absolute;top:-40px;right:-40px;width:180px;height:180px;
  border-radius:50%;background:rgba(255,255,255,.06)
}
.detail-hero .back{
  display:inline-flex;align-items:center;gap:6px;
  color:rgba(255,255,255,.9);font-size:12.5px;font-weight:600;margin-bottom:14px;
  position:relative;z-index:1
}
.detail-hero .back svg{width:15px;height:15px;stroke:currentColor;fill:none;
  stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.detail-hero .h-ic{
  width:54px;height:54px;border-radius:14px;background:rgba(255,255,255,.15);
  display:grid;place-items:center;margin-bottom:14px;position:relative;z-index:1
}
.detail-hero .h-ic svg{width:28px;height:28px;stroke:#fff;fill:none;
  stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.detail-hero h1{font-size:22px;margin:0 0 8px;font-weight:700;line-height:1.25;
  position:relative;z-index:1}
.detail-hero p{margin:0 0 14px;font-size:13.5px;opacity:.92;line-height:1.5;
  max-width:640px;position:relative;z-index:1}
.h-meta{display:flex;flex-wrap:wrap;gap:8px;position:relative;z-index:1}
.h-meta .pill{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.15);padding:6px 11px;border-radius:999px;
  font-size:12px;font-weight:600
}
.h-meta .pill svg{width:14px;height:14px;stroke:currentColor;fill:none;
  stroke-width:1.9}

/* ============ STICKY ACTION BAR ============ */
.action-bar{
  display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;
  padding:14px;background:#fff;border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--sh)
}
.action-bar .btn{flex:1;min-width:130px}
.action-bar .status-note{
  display:flex;align-items:center;gap:6px;font-size:12.5px;
  color:var(--muted);font-weight:500;width:100%;margin-bottom:8px
}
.action-bar .status-note svg{width:15px;height:15px;stroke:currentColor;
  fill:none;stroke-width:1.9}
.action-bar .status-note b{color:var(--ink)}

/* ============ TAB NAV ============ */
.tabnav{
  display:flex;gap:4px;overflow-x:auto;padding:4px;background:#fff;
  border:1px solid var(--line);border-radius:12px;margin-bottom:16px;
  position:sticky;top:56px;z-index:20;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
  box-shadow:0 2px 8px -4px rgba(15,23,42,.08)
}
.tabnav::-webkit-scrollbar{display:none}
.tabnav button{
  flex:none;padding:9px 14px;border:0;background:none;font-size:13px;
  font-weight:600;color:var(--muted);border-radius:8px;cursor:pointer;
  white-space:nowrap;min-height:38px;transition:.15s
}
.tabnav button:hover{color:var(--brand);background:var(--brandsoft)}
.tabnav button.active{background:var(--brand);color:#fff}
@media(min-width:768px){.tabnav{top:56px}}

/* ============ SECTIONS ============ */
.section{
  background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:18px;margin-bottom:14px;box-shadow:var(--sh);
  scroll-margin-top:120px
}
.section-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.section-h .sec-ic{
  width:34px;height:34px;border-radius:10px;background:var(--brandsoft);
  display:grid;place-items:center;flex:none
}
.section-h .sec-ic svg{width:18px;height:18px;stroke:var(--brand);
  fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.section-h h2{font-size:16px;font-weight:700;margin:0;flex:1}
.section p{margin:0 0 10px;font-size:14px;line-height:1.6;color:#334155}
.section p:last-child{margin-bottom:0}

/* eligibility list */
.elig-list{list-style:none;padding:0;margin:0}
.elig-list li{
  display:flex;gap:11px;align-items:flex-start;padding:10px 0;
  border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.5
}
.elig-list li:last-child{border-bottom:0}
.elig-list li .ck{
  width:22px;height:22px;border-radius:50%;background:var(--brandsoft);
  display:grid;place-items:center;flex:none;margin-top:1px
}
.elig-list li .ck svg{width:13px;height:13px;stroke:var(--brand);fill:none;
  stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.elig-list li span{flex:1}

/* benefits grid */
.benefit-grid{display:grid;gap:10px}
@media(min-width:600px){.benefit-grid{grid-template-columns:1fr 1fr}}
.benefit-item{
  display:flex;gap:11px;align-items:flex-start;padding:13px;
  background:var(--bg);border-radius:11px;font-size:13.5px;line-height:1.5
}
.benefit-item .b-ic{
  width:32px;height:32px;border-radius:9px;background:var(--okbg);
  display:grid;place-items:center;flex:none
}
.benefit-item .b-ic svg{width:17px;height:17px;stroke:var(--ok);fill:none;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.benefit-item b{display:block;font-weight:600;margin-bottom:2px}
.benefit-item small{font-size:12px;color:var(--muted);line-height:1.4;
  display:block}

/* documents checklist */
.doc-check{list-style:none;padding:0;margin:0}
.doc-check li{
  display:flex;gap:12px;align-items:center;padding:12px;
  border:1px solid var(--line);border-radius:11px;margin-bottom:8px;
  font-size:13.5px;background:#fff
}
.doc-check li:last-child{margin-bottom:0}
.doc-check .d-ic{
  width:36px;height:36px;border-radius:9px;background:var(--infobg);
  display:grid;place-items:center;flex:none
}
.doc-check .d-ic svg{width:19px;height:19px;stroke:var(--info);fill:none;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.doc-check .d-t{flex:1}
.doc-check .d-t b{display:block;font-weight:600;font-size:13.5px}
.doc-check .d-t small{font-size:12px;color:var(--muted)}

/* process timeline */
.process{position:relative;padding-left:34px;margin:0;list-style:none}
.process::before{
  content:"";position:absolute;left:15px;top:8px;bottom:8px;width:2px;
  background:linear-gradient(180deg,var(--brand),var(--brandsoft))
}
.process li{position:relative;padding-bottom:20px}
.process li:last-child{padding-bottom:0}
.process li::before{
  content:"";position:absolute;left:-26px;top:4px;width:14px;height:14px;
  border-radius:50%;background:#fff;border:3px solid var(--brand);
  box-sizing:border-box
}
.process li .step-n{
  display:inline-block;font-size:11px;font-weight:700;color:var(--brand);
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px
}
.process li b{display:block;font-size:14px;margin-bottom:3px}
.process li p{margin:0;font-size:13px;color:var(--muted);line-height:1.5}

/* conditions */
.cond-list{list-style:none;padding:0;margin:0}
.cond-list li{
  display:flex;gap:11px;align-items:flex-start;padding:11px;
  background:var(--warnbg);border-radius:10px;margin-bottom:8px;
  font-size:13px;line-height:1.5;color:#78350F
}
.cond-list li:last-child{margin-bottom:0}
.cond-list li svg{width:17px;height:17px;stroke:currentColor;fill:none;
  stroke-width:2;flex:none;margin-top:1px}

/* FAQ accordion */
.faq{border:1px solid var(--line);border-radius:11px;overflow:hidden}
.faq-item{border-bottom:1px solid var(--line)}
.faq-item:last-child{border-bottom:0}
.faq-q{
  display:flex;align-items:center;gap:12px;padding:14px 15px;cursor:pointer;
  background:#fff;font-size:13.5px;font-weight:600;line-height:1.4;
  list-style:none;transition:.15s
}
.faq-q:hover{background:var(--bg)}
.faq-q::-webkit-details-marker{display:none}
.faq-q .q-ic{
  width:26px;height:26px;border-radius:50%;background:var(--brandsoft);
  display:grid;place-items:center;flex:none;transition:transform .2s
}
.faq-q .q-ic svg{width:14px;height:14px;stroke:var(--brand);fill:none;
  stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.faq-item[open] .q-ic{transform:rotate(180deg);background:var(--brand)}
.faq-item[open] .q-ic svg{stroke:#fff}
.faq-a{padding:0 15px 15px 53px;font-size:13px;color:var(--muted);
  line-height:1.6}

/* not found */
.notfound{
  text-align:center;padding:50px 20px;background:#fff;
  border:1px dashed var(--line);border-radius:16px;margin-top:20px
}
.notfound svg{width:56px;height:56px;stroke:var(--muted);fill:none;
  stroke-width:1.4;margin:0 auto 12px;opacity:.5}
.notfound h2{color:var(--ink);font-size:17px;margin:0 0 6px}
.notfound p{margin:0 0 16px;font-size:13.5px;color:var(--muted)}

/* ============ TOAST ============ */
.toast-wrap{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(88px + var(--safeb));z-index:300;display:flex;flex-direction:column;
  gap:8px;pointer-events:none;align-items:center;width:calc(100% - 28px);
  max-width:420px}
@media(min-width:1200px){.toast-wrap{bottom:24px}}
.toast{background:#0F172A;color:#fff;padding:11px 16px;border-radius:10px;
  font-size:13.5px;font-weight:500;box-shadow:0 10px 30px -10px rgba(0,0,0,.35);
  transition:opacity .3s;text-align:center;max-width:100%}
.toast.ok{background:var(--ok)}.toast.err{background:var(--err)}

/* JAGO FAB */
.jago-fab{position:fixed;right:14px;bottom:calc(78px + var(--safeb));
  width:54px;height:54px;border-radius:50%;
  background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;
  display:grid;place-items:center;
  box-shadow:0 10px 24px -8px rgba(11,94,85,.6);z-index:70;border:0;cursor:pointer}
.jago-fab svg{width:26px;height:26px;stroke:currentColor;fill:none;
  stroke-width:1.8}
@media(min-width:1200px){.jago-fab{bottom:26px;right:26px;width:58px;height:58px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar" id="topbar"></header>
  <aside class="sidebar" id="sidebar"></aside>
  <main class="content"><div class="wrap" id="page"></div></main>
  <nav class="bottomnav" id="bottomnav"></nav>
</div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
/* =========================================================
   ICONS
   ========================================================= */
const ICONS={
  dashboard:'<path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/>',
  schemes:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M8 4v16"/>',
  apps:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  docs:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
  pay:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',
  jago:'<circle cx="12" cy="12" r="9"/><path d="M9 10h.01M15 10h.01M9 15c1.5 1.2 4.5 1.2 6 0"/>',

  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>',
  check:'<path d="M5 13l4 4L19 7"/>',
  chev:'<path d="M9 6l6 6-6 6"/>',
  chevL:'<path d="M15 6l-6 6 6 6"/>',

  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  close:'<path d="M18 6L6 18M6 6l12 12"/>',
  book:'<path d="M4 19.5V5a2 2 0 0 1 2-2h11a1 1 0 0 1 1 1v15"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H18"/><path d="M20 5v14"/>',
  grad:'<path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1 2.7 3 6 3s6-2 6-3v-5"/>',
  star:'<path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/>',

  lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/>',
  bank:'<path d="M3 10l9-6 9 6"/><path d="M5 10v9h14v-9M9 19v-5h6v5"/>',
  help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7"/><path d="M12 17h.01"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',

function icon(n,cls){const p=ICONS[n]||ICONS.info;
  return `<svg class="${cls||''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`}

/* =========================================================
   HELPERS
   ========================================================= */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg,type){
  const w=document.getElementById('toastWrap');
  const t=document.createElement('div');
  t.className='toast '+(type||'');t.textContent=msg;
  w.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),320)},2400);
}

/* =========================================================
   STATE
   ========================================================= */
const KEY='tso_state_v1';
function S(){try{const raw=localStorage.getItem(KEY);
  if(raw){const p=JSON.parse(raw);if(p&&p.profile)return p}}catch(e){}return null}

const NAV=[

function mountShell(active,crumb){
  const s=S();const unread=s?s.notifications.filter(n=>!n.read).length:0;
  document.getElementById('topbar').innerHTML=`
    <div class="brand">

  document.getElementById('sidebar').innerHTML=`
    <div class="nav-title">Menu</div>

    <div class="nav-title">Support</div>

    <a href="settings.html">${icon('settings')}<span>Settings</span></a>
    <a href="index.html" onclick="localStorage.removeItem('tso_state_v1')">${icon('logout')}<span>Logout</span></a>`;
  document.getElementById('bottomnav').innerHTML=MOBILE_NAV.map(id=>{

    const f=document.createElement('button');
    f.className='jago-fab';f.setAttribute('aria-label','Open JAGO assistant');
    f.innerHTML=icon('jago');
    f.onclick=()=>location.href='jago.html';
    document.body.appendChild(f);

}

const CATEGORIES=[
  {id:'overview',label:'Overview',icon:'info'},
  {id:'eligibility',label:'Eligibility',icon:'shield'},
  {id:'benefits',label:'Benefits',icon:'star'},
  {id:'documents',label:'Documents',icon:'docs'},

/* =========================================================
   PAGE DATA
   ========================================================= */
const s=S();
if(!s||!s.profile){location.href='index.html'}

const params=new URLSearchParams(location.search);
const schemeId=params.get('scheme')||'post-matric';
const scheme=s.schemes.find(x=>x.id===schemeId);
const present=PRESENT[schemeId];

if(!scheme||!present){
  mountShell('schemes','Home / Schemes');
  document.getElementById('page').innerHTML=`
    <div class="notfound">
      ${icon('search')}
      <h2>Scheme not found</h2>
      <p>The scheme you are looking for doesn't exist or has been removed.</p>
      <a class="btn primary" href="schemes.html">Browse all schemes</a>
    </div>`;
} else {
  renderScheme();
}

/* =========================================================
   RENDER
   ========================================================= */
function renderScheme(){
  mountShell('schemes',`Home / Schemes / ${scheme.name}`);

  /* Related application (if any) */
  const existing=s.applications.find(a=>a.schemeId===scheme.id);

  /* Documents merge */
  const docs=scheme.documents.map(d=>{
    const meta=DOC_META[d]||{icon:'docs',note:'Supporting document'};
    return {...meta,name:d};
  });

  document.getElementById('page').innerHTML=`
    <!-- HERO -->
    <section class="detail-hero">
      <a class="back" href="schemes.html">
        ${icon('chevL')} All schemes
      </a>
      <div class="h-ic">${icon(present.icon)}</div>
      <h1>${esc(scheme.name)}</h1>
      <p>${esc(scheme.short)}</p>
      <div class="h-meta">
        <span class="pill">${icon('user')} ${esc(scheme.for)}</span>
        <span class="pill">${icon('star')} ${esc(scheme.benefitShort)}</span>
        <span class="pill">${icon('shield')} MoTA Scheme</span>
      </div>
    </section>

    <!-- ACTION BAR -->
    <div class="action-bar">
      ${existing?`
        <div class="status-note">
          ${icon('info')}
          You already have an application for this scheme: <b>${esc(existing.id)}</b>
        </div>
        <a class="btn primary" href="application-details.html?id=${existing.id}">
          ${icon('apps')} Track Application
        </a>
        <a class="btn ghost" href="schemes.html">${icon('chevL')} Back to Schemes</a>
      `:`
        <div class="status-note">
          ${icon('clock')}
          Not yet applied for this scheme.
        </div>
        <a class="btn primary" href="eligibility-check.html?scheme=${scheme.id}">
          ${icon('shield')} Check Eligibility
        </a>
        <a class="btn ghost" href="scholarship-check.html?scheme=${scheme.id}">
          ${icon('search')} Existing Scholarship
        </a>
      `}
    </div>

    <!-- TAB NAV -->
    <nav class="tabnav" id="tabnav" role="tablist" aria-label="Scheme sections">
      ${CATEGORIES.map((c,i)=>`
        <button type="button" class="${i===0?'active':''}" data-target="${c.id}"
                role="tab" aria-selected="${i===0?'true':'false'}">
          ${esc(c.label)}
        </button>`).join('')}
    </nav>

    <!-- OVERVIEW -->
    <section class="section" id="overview">
      <div class="section-h">
        <span class="sec-ic">${icon('info')}</span>
        <h2>Overview</h2>
      </div>
      <p>${esc(present.overview)}</p>
      <p class="muted sm" style="margin-top:12px">
        ${icon('info')} Scheme rules shown in this prototype are for demonstration. Please refer to the official MoTA guidelines for authoritative eligibility.
      </p>
    </section>

    <!-- ELIGIBILITY -->
    <section class="section" id="eligibility">
      <div class="section-h">
        <span class="sec-ic">${icon('shield')}</span>
        <h2>Eligibility</h2>
      </div>
      <ul class="elig-list">
        ${scheme.eligibility.map(e=>`
          <li>
            <span class="ck">${icon('check')}</span>
            <span>${esc(e)}</span>
          </li>`).join('')}
      </ul>
      <div style="margin-top:14px">
        <a class="btn primary" href="eligibility-check.html?scheme=${scheme.id}">
          ${icon('shield')} Check My Eligibility
        </a>
      </div>
    </section>

    <!-- BENEFITS -->
    <section class="section" id="benefits">
      <div class="section-h">
        <span class="sec-ic">${icon('star')}</span>
        <h2>Benefits</h2>
      </div>
      <div class="benefit-grid">
        ${present.benefitsFull.map(b=>`
          <div class="benefit-item">
            <span class="b-ic">${icon('check')}</span>
            <div>
              <b>${esc(b.t)}</b>
              <small>${esc(b.d)}</small>
            </div>
          </div>`).join('')}
      </div>
    </section>

    <!-- DOCUMENTS -->
    <section class="section" id="documents">
      <div class="section-h">
        <span class="sec-ic">${icon('docs')}</span>
        <h2>Required Documents</h2>
      </div>
      <ul class="doc-check">
        ${docs.map(d=>`
          <li>
            <span class="d-ic">${icon(d.icon)}</span>
            <div class="d-t">
              <b>${esc(d.name)}</b>
              <small>${esc(d.note)}</small>
            </div>
            <span class="badge info">Required</span>
          </li>`).join('')}
      </ul>
      <p class="muted xs" style="margin-top:12px">
        Upload once in your <a class="link" href="document-wallet.html">Document Wallet</a> and reuse across applications.
      </p>
    </section>

    <!-- PROCESS -->
    <section class="section" id="process">
      <div class="section-h">
        <span class="sec-ic">${icon('apps')}</span>
        <h2>Application Process</h2>
      </div>
      <ol class="process">
        ${scheme.process.map((step,i)=>`
          <li>
            <span class="step-n">Step ${i+1}</span>
            <b>${esc(step)}</b>
            <p>${stepNote(step)}</p>
          </li>`).join('')}
      </ol>
    </section>

    <!-- CONDITIONS -->
    <section class="section" id="conditions">
      <div class="section-h">
        <span class="sec-ic">${icon('alert')}</span>
        <h2>Important Conditions</h2>
      </div>
      <ul class="cond-list">
        ${present.conditions.map(c=>`
          <li>${icon('alert')}<span>${esc(c)}</span></li>`).join('')}
      </ul>
    </section>

    <!-- FAQ -->
    <section class="section" id="faq">
      <div class="section-h">
        <span class="sec-ic">${icon('help')}</span>
        <h2>Frequently Asked Questions</h2>
      </div>
      <div class="faq">
        ${present.faq.map(([q,a])=>`
          <details class="faq-item">
            <summary class="faq-q">
              <span class="q-ic">${icon('chevD')}</span>
              <span>${esc(q)}</span>
            </summary>
            <div class="faq-a">${esc(a)}</div>
          </details>`).join('')}
      </div>
    </section>

    <!-- FINAL CTA -->
    <div class="action-bar" style="margin-top:14px">
      ${existing?`
        <a class="btn primary" href="application-details.html?id=${existing.id}">
          ${icon('apps')} Track Application
        </a>
      `:`
        <a class="btn primary" href="eligibility-check.html?scheme=${scheme.id}">
          ${icon('shield')} Check Eligibility &amp; Apply
        </a>
      `}
      <a class="btn ghost" href="jago.html">${icon('jago')} Ask JAGO</a>
    </div>
  `;

  /* Tab scroll spy + active handling */
  const tabBtns=[...document.querySelectorAll('#tabnav button')];
  const sections=CATEGORIES.map(c=>document.getElementById(c.id)).filter(Boolean);

  tabBtns.forEach(b=>{
    b.addEventListener('click',()=>{
      const t=document.getElementById(b.dataset.target);
      if(t){
        const y=t.getBoundingClientRect().top+window.scrollY-110;
        window.scrollTo({top:y,behavior:'smooth'});
      }
    });
  });

  const setActive=id=>tabBtns.forEach(b=>{
    const on=b.dataset.target===id;
    b.classList.toggle('active',on);
    b.setAttribute('aria-selected',on?'true':'false');
  });

  if('IntersectionObserver' in window){
    const io=new IntersectionObserver(entries=>{
      entries.forEach(e=>{
        if(e.isIntersecting) setActive(e.target.id);
      });
    },{rootMargin:'-120px 0px -55% 0px',threshold:0});
    sections.forEach(sec=>io.observe(sec));
  }
}

/* Friendly note for each process step */
function stepNote(step){
  const map={
    'Register on Tribal Scholarship One':'Create your unified account with mobile OTP.',
    'Register & complete profile':'Set up your profile once, reuse everywhere.',
    'Register & profile':'Your details are stored for reuse across all schemes.',
    'Fill personal & academic details':'Most fields auto-fill from your saved profile.',
    'Fill application':'Personal and academic information auto-fills from your profile.',
    'Upload documents':'Upload or link documents from your Document Wallet.',
    'Upload research documents':'Attach your research proposal and qualifying certificate.',
    'Institution verification':'Your institution verifies details and bonafide.',
    'Document verification':'Mock integrated sources verify your documents.',
    'State verification':'State authorities verify residency and category details.',
    'State verification & sanction':'State reviews and sanctions the scholarship.',
    'Ministry review':'Ministry reviews your application at the central level.',
    'Ministry screening':'Central screening of your application.',
    'UGC/NTA verification':'Your NET/JRF credentials are validated.',
    'Sanction':'Approval is issued with sanctioned amount.',
    'Sanction & DBT':'Approval and DBT processing are initiated.',
    'DBT payment':'Amount is transferred to your Aadhaar-linked bank account.',
    'Payment credited':'Funds are credited to your registered bank account.',
    'Disbursement':'Funds are disbursed as per the scheme schedule.'
  };
  return map[step]||'Follow the instructions and keep your information up to date.';
}
