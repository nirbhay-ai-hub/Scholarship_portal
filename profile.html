<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B5E55">
<title>Profile - Tribal Scholarship One</title>
<style>
:root{
  --brand:#0B5E55;--brand2:#0E7C6F;--brandsoft:#E6F2F0;
  --bg:#F4F6F8;--card:#fff;--ink:#0F172A;--muted:#64748B;--line:#E2E8F0;
  --ok:#0F9D58;--okbg:#E7F6EE;--warn:#B45309;--warnbg:#FEF3C7;
  --err:#DC2626;--errbg:#FEE2E2;--info:#1D4ED8;--infobg:#DBEAFE;
  --r:14px;--sh:0 1px 2px rgba(15,23,42,.06),0 8px 24px -14px rgba(15,23,42,.2);
  --safeb:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
svg{display:block}

/* SHELL */
.app{min-height:100dvh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:50;background:var(--brand);color:#fff;
  display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:56px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));
}
.topbar .brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.logo{
  width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.15);
  display:grid;place-items:center;flex:none;
}
.logo svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.brand-t{min-width:0}
.brand-t b{display:block;font-size:14px;line-height:1.15;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;font-weight:600}
.brand-t small{display:block;font-size:11px;opacity:.8;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;gap:4px}
.iconbtn{
  width:38px;height:38px;border-radius:10px;border:0;
  background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;
  cursor:pointer;position:relative;
}
.iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}
.iconbtn .dot-badge{
  position:absolute;top:6px;right:6px;width:8px;height:8px;
  border-radius:50%;background:#FBBF24;border:2px solid var(--brand)
}
.sidebar{display:none}
.bottomnav{
  position:fixed;bottom:0;left:0;right:0;z-index:60;background:#fff;
  border-top:1px solid var(--line);display:flex;
  padding:6px 4px calc(6px + var(--safeb));
  box-shadow:0 -4px 16px -8px rgba(15,23,42,.1);
}
.bn-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 2px;border-radius:10px;color:var(--muted);font-size:10.5px;
  font-weight:500;min-width:0;
}
.bn-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
.bn-item.active{color:var(--brand);background:var(--brandsoft)}
.bn-item span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.content{flex:1;padding:14px 14px calc(88px + var(--safeb));min-width:0}
.wrap{max-width:900px;margin:0 auto}

@media(min-width:768px){
  .content{padding:18px 22px calc(92px + var(--safeb))}
  .bottomnav{padding:8px 12px calc(8px + var(--safeb))}
  .bn-item{font-size:11.5px}.bn-item svg{width:24px;height:24px}
}
@media(min-width:1200px){
  .app{
    display:grid;grid-template-columns:250px 1fr;
    grid-template-rows:auto 1fr;
    grid-template-areas:"top top" "side main";
  }
  .topbar{grid-area:top}
  .sidebar{
    grid-area:side;display:block;background:#fff;
    border-right:1px solid var(--line);padding:14px 12px;
    position:sticky;top:56px;height:calc(100dvh - 56px);overflow-y:auto;
  }
  .sidebar .nav-title{
    font-size:11px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--muted);font-weight:600;padding:12px 12px 6px;
  }
  .sidebar a{
    display:flex;align-items:center;gap:12px;padding:10px 12px;
    border-radius:10px;color:var(--ink);font-size:14px;font-weight:500;
    margin-bottom:2px;
  }
  .sidebar a svg{width:20px;height:20px;stroke:currentColor;fill:none;
    stroke-width:1.8;flex:none}
  .sidebar a:hover{background:var(--bg)}
  .sidebar a.active{background:var(--brandsoft);color:var(--brand);font-weight:600}
  .content{grid-area:main;padding:22px 26px}
  .bottomnav{display:none}
  .wrap{max-width:920px}
}

/* COMMON */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 16px;border-radius:10px;border:1px solid transparent;
  background:#fff;color:var(--ink);font-weight:600;font-size:14px;
  cursor:pointer;line-height:1.2;text-align:center;transition:.15s;
  min-height:44px;
}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:hover{background:#0a4f48}
.btn.ghost{background:#fff;border-color:var(--line)}
.btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn.danger{background:#fff;border-color:#FCA5A5;color:var(--err)}
.btn.danger:hover{background:var(--errbg);border-color:var(--err)}
.btn.sm{padding:8px 13px;font-size:13px;min-height:38px}
.btn.block{width:100%}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;
  stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.badge{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;
  border-radius:999px;font-size:11.5px;font-weight:600;background:#F1F5F9;
  color:#334155;white-space:nowrap;
}
.badge.ok{background:var(--okbg);color:var(--ok)}
.badge.warn{background:var(--warnbg);color:var(--warn)}
.badge.err{background:var(--errbg);color:var(--err)}
.badge.info{background:var(--infobg);color:var(--info)}
.badge.brand{background:var(--brandsoft);color:var(--brand)}
.badge.neutral{background:#F1F5F9;color:#475569}
.muted{color:var(--muted)}
.sm{font-size:13px}
.xs{font-size:11.5px}
.link{color:var(--brand);font-weight:600;font-size:13.5px}

/* HEAD */
.page-head{margin-bottom:14px}
.breadcrumb{
  display:flex;align-items:center;gap:6px;font-size:12px;
  color:var(--muted);margin-bottom:8px;flex-wrap:wrap;
}
.breadcrumb svg{width:12px;height:12px;stroke:currentColor;fill:none;
  stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.page-head h1{font-size:22px;font-weight:700;margin:0 0 6px}
.page-head p{color:var(--muted);font-size:13.5px;margin:0;max-width:640px}

/* HERO */
.profile-hero{
  background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;
  border-radius:16px;padding:22px 20px;margin-bottom:14px;position:relative;
  overflow:hidden;
}
.profile-hero::before{
  content:"";position:absolute;top:-50px;right:-50px;width:220px;height:220px;
  border-radius:50%;background:rgba(255,255,255,.06);
}
.ph-head{
  display:flex;gap:16px;align-items:center;position:relative;z-index:1;
  margin-bottom:16px;flex-wrap:wrap;
}
.ph-avatar{
  width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.2);
  display:grid;place-items:center;flex:none;position:relative;
  border:3px solid rgba(255,255,255,.35);
}
.ph-avatar b{
  font-size:30px;font-weight:700;color:#fff;letter-spacing:.02em;
}
.ph-avatar .edit-av{
  position:absolute;bottom:-2px;right:-2px;width:28px;height:28px;
  border-radius:50%;background:#fff;color:var(--brand);
  display:grid;place-items:center;cursor:pointer;border:2px solid var(--brand);
}
.ph-avatar .edit-av svg{width:13px;height:13px;stroke:currentColor;
  fill:none;stroke-width:2.4}
.ph-info{flex:1;min-width:200px}
.ph-info h1{
  font-size:21px;font-weight:700;margin:0 0 5px;line-height:1.25;
}
.ph-info .ph-sub{
  font-size:13px;opacity:.9;margin:0 0 10px;
}
.ph-tags{display:flex;flex-wrap:wrap;gap:6px}
.ph-tags .tag{
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(255,255,255,.15);padding:5px 10px;border-radius:999px;
  font-size:11.5px;font-weight:600;
}
.ph-tags .tag svg{width:12px;height:12px;stroke:currentColor;fill:none;
  stroke-width:2.2}

/* COMPLETION */
.ph-completion{
  background:rgba(255,255,255,.14);border-radius:12px;padding:12px;
  position:relative;z-index:1;
}
.ph-completion .phl{
  display:flex;justify-content:space-between;font-size:11.5px;
  margin-bottom:6px;font-weight:600;
}
.ph-completion .phbar{
  height:7px;background:rgba(255,255,255,.22);border-radius:99px;
  overflow:hidden;
}
.ph-completion .phbar>span{
  display:block;height:100%;background:#fff;border-radius:99px;
  transition:width .5s ease;
}

/* CARD */
.card{
  background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:16px;margin-bottom:14px;box-shadow:var(--sh);
}
.card-h{
  display:flex;align-items:center;gap:10px;margin-bottom:14px;
  flex-wrap:wrap;
}
.card-h .c-ic{
  width:34px;height:34px;border-radius:10px;background:var(--brandsoft);
  display:grid;place-items:center;flex:none;
}
.card-h .c-ic svg{width:18px;height:18px;stroke:var(--brand);fill:none;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.card-h h2{font-size:15px;font-weight:700;margin:0;flex:1}
.card-h .edit-link{
  font-size:13px;color:var(--brand);font-weight:600;background:none;
  border:0;cursor:pointer;padding:4px 8px;border-radius:6px;
}
.card-h .edit-link:hover{background:var(--brandsoft)}

/* KV ROWS */
.kv-list{
  display:flex;flex-direction:column;gap:0;
}
.kv-row{
  display:grid;grid-template-columns:24px 1fr auto;
  gap:12px;align-items:center;padding:12px 0;
  border-bottom:1px solid var(--line);
}
.kv-row:last-child{border-bottom:0}
.kv-row .kv-ic{
  width:24px;height:24px;display:grid;place-items:center;color:var(--muted);
}
.kv-row .kv-ic svg{width:18px;height:18px;stroke:currentColor;fill:none;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.kv-row .kv-l{
  min-width:0;
}
.kv-row .kv-l small{
  display:block;font-size:11px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.03em;font-weight:700;margin-bottom:2px;
}
.kv-row .kv-l b{
  font-size:14px;font-weight:600;color:var(--ink);word-break:break-word;
  display:block;
}
.kv-row .kv-tag{
  flex:none;
}

/* QUICK ACTIONS */
.qa-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
  margin-bottom:14px;
}
@media(min-width:640px){.qa-grid{grid-template-columns:repeat(4,1fr)}}
.qa{
  background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:16px 10px;display:flex;flex-direction:column;align-items:center;
  gap:9px;text-align:center;transition:.15s;box-shadow:var(--sh);
  color:var(--ink);cursor:pointer;
}
.qa:hover{border-color:var(--brand);transform:translateY(-1px)}
.qa .qa-ic{
  width:42px;height:42px;border-radius:12px;background:var(--brandsoft);
  display:grid;place-items:center;flex:none;
}
.qa .qa-ic svg{width:22px;height:22px;stroke:var(--brand);fill:none;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.qa b{font-size:13px;font-weight:600;line-height:1.25}
.qa small{font-size:11px;color:var(--muted);line-height:1.3}

/* EDIT FORM */
.form-row{
  margin-bottom:14px;
}
.form-row:last-child{margin-bottom:0}
.form-row label{
  display:block;font-size:13px;font-weight:600;margin-bottom:6px;
  color:#334155;
}
.form-row .hint{
  font-size:12px;color:var(--muted);margin-top:5px;
}
.form-row input,
.form-row select,
.form-row textarea{
  width:100%;padding:11px 13px;border:1px solid var(--line);
  border-radius:10px;background:#fff;font-size:15px;outline:0;
  min-height:46px;transition:.15s;font-family:inherit;
}
.form-row textarea{resize:vertical;min-height:80px;line-height:1.5}
.form-row input:focus,
.form-row select:focus,
.form-row textarea:focus{
  border-color:var(--brand);box-shadow:0 0 0 3px rgba(11,94,85,.12);
}
.form-row input[readonly]{
  background:#F8FAFC;color:#475569;cursor:not-allowed;
}
.form-row.invalid input,
.form-row.invalid select{border-color:var(--err)}
.form-row .err{
  font-size:12px;color:var(--err);margin-top:4px;display:none;
}
.form-row.invalid .err{display:block}
.form-grid{
  display:grid;grid-template-columns:1fr;gap:12px;
}
@media(min-width:560px){.form-grid{grid-template-columns:1fr 1fr}}
.form-actions{
  display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;
}
.form-actions .btn{flex:1;min-width:140px}

/* SECTION HEADER */
.section-head{
  font-size:11px;color:var(--muted);font-weight:700;
  text-transform:uppercase;letter-spacing:.06em;
  margin:16px 0 10px;display:flex;align-items:center;gap:8px;
}
.section-head:first-child{margin-top:0}
.section-head::after{
  content:"";flex:1;height:1px;background:var(--line);
}

/* ACCOUNT */
.account-list{list-style:none;padding:0;margin:0}
.account-list li{
  display:flex;align-items:center;gap:12px;padding:14px 0;
  border-bottom:1px solid var(--line);cursor:pointer;
  transition:.15s;
}
.account-list li:last-child{border-bottom:0}
.account-list li:hover{background:var(--bg);margin:0 -16px;padding:14px 16px}
.account-list .al-ic{
  width:36px;height:36px;border-radius:10px;background:var(--brandsoft);
  display:grid;place-items:center;flex:none;
}
.account-list .al-ic svg{width:18px;height:18px;stroke:var(--brand);
  fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.account-list .al-ic.danger{background:var(--errbg)}
.account-list .al-ic.danger svg{stroke:var(--err)}
.account-list .al-l{flex:1;min-width:0}
.account-list .al-l b{
  font-size:14px;font-weight:600;display:block;margin-bottom:1px;
}
.account-list .al-l small{font-size:12px;color:var(--muted);display:block}
.account-list .chev{color:var(--muted)}
.account-list .chev svg{width:18px;height:18px;stroke:currentColor;
  fill:none;stroke-width:2.2}

/* INFO BANNER */
.info-banner{
  display:flex;gap:12px;padding:13px 14px;border-radius:12px;
  margin-bottom:14px;border:1px solid;
  align-items:flex-start;
}
.info-banner svg{width:20px;height:20px;stroke:currentColor;fill:none;
  stroke-width:1.9;flex:none;margin-top:1px}
.info-banner p{margin:0;font-size:12.5px;line-height:1.55}
.info-banner b{font-weight:700}
.info-banner.info{background:var(--infobg);color:var(--info);border-color:#BFDBFE}
.info-banner.info p{color:#1E3A8A}

/* CONFIRM MODAL */
.modal-bg{
  position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:500;
  display:none;align-items:center;justify-content:center;padding:20px;
}
.modal-bg.open{display:flex}
.modal{
  background:#fff;border-radius:16px;padding:22px;max-width:380px;
  width:100%;box-shadow:0 20px 50px -20px rgba(0,0,0,.4);
  animation:pop .25s ease;
}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.modal h3{font-size:16px;margin:0 0 8px;font-weight:700}
.modal p{margin:0 0 18px;font-size:13.5px;color:var(--muted);
  line-height:1.5}
.modal .modal-actions{display:flex;gap:10px;flex-wrap:wrap}
.modal .modal-actions .btn{flex:1;min-width:120px}

/* TOAST */
.toast-wrap{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(88px + var(--safeb));z-index:600;
  display:flex;flex-direction:column;gap:8px;pointer-events:none;
  align-items:center;width:calc(100% - 28px);max-width:420px;
}
@media(min-width:1200px){.toast-wrap{bottom:24px}}
.toast{
  background:#0F172A;color:#fff;padding:11px 16px;border-radius:10px;
  font-size:13.5px;font-weight:500;
  box-shadow:0 10px 30px -10px rgba(0,0,0,.35);
  transition:opacity .3s;text-align:center;max-width:100%;
}
.toast.ok{background:var(--ok)}
.toast.err{background:var(--err)}
.toast.warn{background:var(--warn)}

/* JAGO FAB */
.jago-fab{
  position:fixed;right:14px;bottom:calc(78px + var(--safeb));
  width:54px;height:54px;border-radius:50%;
  background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;
  display:grid;place-items:center;
  box-shadow:0 10px 24px -8px rgba(11,94,85,.6);
  z-index:70;border:0;cursor:pointer;
}
.jago-fab svg{width:26px;height:26px;stroke:currentColor;fill:none;
  stroke-width:1.8}
@media(min-width:1200px){
  .jago-fab{bottom:26px;right:26px;width:58px;height:58px}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar" id="topbar"></header>
  <aside class="sidebar" id="sidebar"></aside>
  <main class="content"><div class="wrap" id="page"></div></main>
  <nav class="bottomnav" id="bottomnav"></nav>
</div>

<div class="modal-bg" id="logoutModal">
  <div class="modal">
    <h3>Logout?</h3>
    <p>You will be signed out of Tribal Scholarship One on this device. Your saved data on the server is not affected. In this prototype, all local state will be cleared.</p>
    <div class="modal-actions">
      <button class="btn ghost" type="button" id="cancelLogout">Cancel</button>
      <button class="btn danger" type="button" id="confirmLogout">Logout</button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
/* =========================================================
   ICONS
   ========================================================= */
var ICONS = {
  dashboard:'<path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/>',
  schemes:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M8 4v16"/>',
  apps:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  docs:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
  pay:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',
  jago:'<circle cx="12" cy="12" r="9"/><path d="M9 10h.01M15 10h.01M9 15c1.5 1.2 4.5 1.2 6 0"/>',
  notif:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
  profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>',
  check:'<path d="M5 13l4 4L19 7"/>',
  chev:'<path d="M9 6l6 6-6 6"/>',
  chevL:'<path d="M15 6l-6 6 6 6"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  close:'<path d="M18 6L6 18M6 6l12 12"/>',
  book:'<path d="M4 19.5V5a2 2 0 0 1 2-2h11a1 1 0 0 1 1 1v15"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H18"/><path d="M20 5v14"/>',
  grad:'<path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1 2.7 3 6 3s6-2 6-3v-5"/>',
  star:'<path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/>',

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}
function toast(msg, type){
  var w = document.getElementById('toastWrap');
  var t = document.createElement('div');
  t.className = 'toast ' + (type || '');
  t.textContent = msg;
  w.appendChild(t);
  setTimeout(function(){
    t.style.opacity = '0';
    setTimeout(function(){ t.remove(); }, 320);
  }, 2400);
}

function computeCompletion(p){
  var checks = [
    p.firstName, p.lastName, p.dob, p.gender,
    p.mobile, p.email, p.state, p.district,
    p.address, p.institution, p.course, p.enrollment
  ];
  var filled = checks.filter(function(v){
    return v !== undefined && v !== null && String(v).trim() !== '';
  }).length;
  return Math.round(filled / checks.length * 100);
}

function formRow(label, key, ic, placeholder, type, inputType){
  var value = form[key] != null ? form[key] : '';
  var t = type || 'text';
  var inputHtml = '';
  if(inputType === 'textarea'){
    inputHtml =
      '<textarea id="f_' + key + '" placeholder="' + esc(placeholder || '') + '">' +
        esc(value) +
      '</textarea>';
  } else {
    inputHtml =
      '<input id="f_' + key + '" type="' + t + '" value="' + esc(value) + '" placeholder="' +
        esc(placeholder || '') + '">';
  }
  return (
    '<div class="form-row" id="row_' + key + '">' +
      '<label for="f_' + key + '">' +
        icon(ic || 'info') + ' ' + esc(label) +
      '</label>' +
      inputHtml +
      '<div class="err">Please enter a valid value.</div>' +
    '</div>'
  );
}

function clearInvalid(key){
  var row = document.getElementById('row_' + key);
  if(row) row.classList.remove('invalid');
}

function markInvalid(key){
  var row = document.getElementById('row_' + key);
  if(row) row.classList.add('invalid');
}

function saveProfile(){
  /* Validate required fields */
  var errors = [];
  REQUIRED.forEach(function(key){
    var v = form[key];
    var ok = v !== undefined && v !== null && String(v).trim() !== '';
    if(key === 'email'){
      ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
    }
    if(key === 'mobile'){
      var digits = String(v || '').replace(/\D/g,'');
      ok = digits.length >= 10;
    }
    if(!ok){
      errors.push(key);
      markInvalid(key);
    }
  });

  if(errors.length){
    toast('Please check the highlighted fields', 'err');
    var firstRow = document.getElementById('row_' + errors[0]);
    if(firstRow){
      var y = firstRow.getBoundingClientRect().top + window.scrollY - 110;
      window.scrollTo({top:y, behavior:'smooth'});
    }
    return;
  }

  /* Apply changes to the state */
  s.profile = Object.assign({}, s.profile, form);
  s.profile.name = (s.profile.firstName || '') + ' ' + (s.profile.lastName || '');
  s.profile.initials =
    (s.profile.firstName || 'A').charAt(0) +
    (s.profile.lastName || 'M').charAt(0);
  s.profile.profileCompletion = computeCompletion(s.profile);

  try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){}

  /* Add a notification */
  s.notifications.unshift({
    id: 'n' + Date.now(),
    type: 'success',
    title: 'Profile updated',
    body: 'Your profile details were updated successfully.',
    date: 'Just now',
    read: false,
    action: 'profile.html'
  });
  try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){}

  toast('Profile updated successfully', 'ok');
  editing = false;
  renderView();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* =========================================================
   BIND VIEW
   ========================================================= */
function bindView(){
  /* Edit buttons */
  page.querySelectorAll('[data-edit]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var section = btn.dataset.edit;
      editing = true;
      renderEdit(section === 'academic' ? 'academic' : 'personal');
    });
  });

  /* Edit avatar */
  var editAv = document.getElementById('editAvatar');
  if(editAv){
    editAv.addEventListener('click', function(){
      toast('Avatar upload is a demo feature', 'ok');
    });
    editAv.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){
        e.preventDefault();
        toast('Avatar upload is a demo feature', 'ok');
      }
    });
  }

  /* Account list navigation */
  page.querySelectorAll('[data-nav]').forEach(function(li){
    li.addEventListener('click', function(){
      location.href = li.dataset.nav;
    });
  });

  /* Logout */
  var logoutItem = document.getElementById('logoutItem');
  if(logoutItem){
    logoutItem.addEventListener('click', function(){
      document.getElementById('logoutModal').classList.add('open');
    });
  }
}

/* =========================================================
   LOGOUT MODAL
   ========================================================= */
document.getElementById('cancelLogout').addEventListener('click', function(){
  document.getElementById('logoutModal').classList.remove('open');
});
document.getElementById('logoutModal').addEventListener('click', function(e){
  if(e.target === this) this.classList.remove('open');
});
document.getElementById('confirmLogout').addEventListener('click', function(){
  try{
    localStorage.removeItem(KEY);
  }catch(e){}
  toast('Signed out', 'ok');
  setTimeout(function(){
    location.href = 'index.html';
  }, 500);
});

/* =========================================================
   INIT
   ========================================================= */
renderView();
</script>
