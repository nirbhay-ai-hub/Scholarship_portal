<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B5E55">
<title>Help & Support - Tribal Scholarship One</title>
<style>
:root{
  --brand:#0B5E55;--brand2:#0E7C6F;--brandsoft:#E6F2F0;
  --bg:#F4F6F8;--card:#fff;--ink:#0F172A;--muted:#64748B;--line:#E2E8F0;
  --ok:#0F9D58;--okbg:#E7F6EE;--warn:#B45309;--warnbg:#FEF3C7;
  --err:#DC2626;--errbg:#FEE2E2;--info:#1D4ED8;--infobg:#DBEAFE;
  --r:14px;--sh:0 1px 2px rgba(15,23,42,.06),0 8px 24px -14px rgba(15,23,42,.2);
  --safeb:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
svg{display:block}

/* SHELL */
.app{min-height:100dvh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:50;background:var(--brand);color:#fff;
  display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:56px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));
}
.topbar .brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.logo{
  width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.15);
  display:grid;place-items:center;flex:none;
}
.logo svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.brand-t{min-width:0}
.brand-t b{display:block;font-size:14px;line-height:1.15;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;font-weight:600}
.brand-t small{display:block;font-size:11px;opacity:.8;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;gap:4px}
.iconbtn{
  width:38px;height:38px;border-radius:10px;border:0;
  background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;
  cursor:pointer;position:relative;
}
.iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}
.iconbtn .dot-badge{
  position:absolute;top:6px;right:6px;width:8px;height:8px;
  border-radius:50%;background:#FBBF24;border:2px solid var(--brand)
}
.sidebar{display:none}
.bottomnav{
  position:fixed;bottom:0;left:0;right:0;z-index:60;background:#fff;
  border-top:1px solid var(--line);display:flex;
  padding:6px 4px calc(6px + var(--safeb));
  box-shadow:0 -4px 16px -8px rgba(15,23,42,.1);
}
.bn-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 2px;border-radius:10px;color:var(--muted);font-size:10.5px;
  font-weight:500;min-width:0;
}
.bn-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
.bn-item.active{color:var(--brand);background:var(--brandsoft)}
.bn-item span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.content{flex:1;padding:14px 14px calc(88px + var(--safeb));min-width:0}
.wrap{max-width:900px;margin:0 auto}

@media(min-width:768px){
  .content{padding:18px 22px calc(92px + var(--safeb))}
  .bottomnav{padding:8px 12px calc(8px + var(--safeb))}
  .bn-item{font-size:11.5px}.bn-item svg{width:24px;height:24px}
}
@media(min-width:1200px){
  .app{
    display:grid;grid-template-columns:250px 1fr;
    grid-template-rows:auto 1fr;
    grid-template-areas:"top top" "side main";
  }
  .topbar{grid-area:top}
  .sidebar{
    grid-area:side;display:block;background:#fff;
    border-right:1px solid var(--line);padding:14px 12px;
    position:sticky;top:56px;height:calc(100dvh - 56px);overflow-y:auto;
  }
  .sidebar .nav-title{
    font-size:11px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--muted);font-weight:600;padding:12px 12px 6px;
  }
  .sidebar a{
    display:flex;align-items:center;gap:12px;padding:10px 12px;
    border-radius:10px;color:var(--ink);font-size:14px;font-weight:500;
    margin-bottom:2px;
  }
  .sidebar a svg{width:20px;height:20px;stroke:currentColor;fill:none;
    stroke-width:1.8;flex:none}
  .sidebar a:hover{background:var(--bg)}
  .sidebar a.active{background:var(--brandsoft);color:var(--brand);font-weight:600}
  .content{grid-area:main;padding:22px 26px}
  .bottomnav{display:none}
  .wrap{max-width:920px}
}

/* COMMON */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 16px;border-radius:10px;border:1px solid transparent;
  background:#fff;color:var(--ink);font-weight:600;font-size:14px;
  cursor:pointer;line-height:1.2;text-align:center;transition:.15s;
  min-height:44px;
}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:hover{background:#0a4f48}
.btn.ghost{background:#fff;border-color:var(--line)}
.btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn.sm{padding:8px 13px;font-size:13px;min-height:38px}
.btn.xs{padding:6px 11px;font-size:12px;min-height:34px}
.btn.block{width:100%}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;
  stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.badge{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;
  border-radius:999px;font-size:11.5px;font-weight:600;background:#F1F5F9;
  color:#334155;white-space:nowrap;
}
.badge.ok{background:var(--okbg);color:var(--ok)}
.badge.warn{background:var(--warnbg);color:var(--warn)}
.badge.err{background:var(--errbg);color:var(--err)}
.badge.info{background:var(--infobg);color:var(--info)}
.badge.brand{background:var(--brandsoft);color:var(--brand)}
.badge.neutral{background:#F1F5F9;color:#475569}
.muted{color:var(--muted)}
.sm{font-size:13px}
.xs{font-size:11.5px}
.link{color:var(--brand);font-weight:600;font-size:13.5px}

/* HEAD */
.page-head{margin-bottom:14px}
.breadcrumb{
  display:flex;align-items:center;gap:6px;font-size:12px;
  color:var(--muted);margin-bottom:8px;flex-wrap:wrap;
}
.breadcrumb svg{width:12px;height:12px;stroke:currentColor;fill:none;
  stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.page-head h1{font-size:22px;font-weight:700;margin:0 0 6px}
.page-head p{color:var(--muted);font-size:13.5px;margin:0;max-width:640px}

/* HERO */
.help-hero{
  background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;
  border-radius:16px;padding:22px 20px;margin-bottom:14px;position:relative;
  overflow:hidden;
}
.help-hero::before{
  content:"";position:absolute;top:-50px;right:-50px;width:220px;height:220px;
  border-radius:50%;background:rgba(255,255,255,.06);
}
.help-hero .hh-ic{
  width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.15);
  display:grid;place-items:center;margin-bottom:12px;position:relative;z-index:1;
}
.help-hero .hh-ic svg{width:26px;height:26px;stroke:#fff;fill:none;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.help-hero h2{
  font-size:19px;margin:0 0 6px;font-weight:700;position:relative;z-index:1;
}
.help-hero p{
  font-size:13.5px;opacity:.92;margin:0 0 14px;max-width:520px;
  line-height:1.5;position:relative;z-index:1;
}
.help-hero .hh-actions{
  display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1;
}
.help-hero .hh-actions .btn{
  background:#fff;color:var(--brand);border-color:#fff;
}
.help-hero .hh-actions .btn.ghost{
  background:transparent;color:#fff;border-color:rgba(255,255,255,.3);
}
.help-hero .hh-actions .btn.ghost:hover{
  background:rgba(255,255,255,.12);border-color:#fff;
}

/* SEARCH */
.search{position:relative;margin-bottom:14px}
.search svg{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:19px;height:19px;stroke:var(--muted);fill:none;stroke-width:2;
  pointer-events:none;
}
.search input{
  width:100%;padding:13px 14px 13px 44px;border:1px solid var(--line);
  border-radius:12px;background:#fff;font-size:15px;outline:0;min-height:48px;
  transition:.15s;box-shadow:var(--sh);
}
.search input:focus{
  border-color:var(--brand);box-shadow:0 0 0 3px rgba(11,94,85,.12);
}
.search .clear{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  width:30px;height:30px;border-radius:50%;background:var(--bg);
  border:0;display:none;place-items:center;cursor:pointer;
}
.search .clear svg{
  position:static;width:14px;height:14px;left:auto;top:auto;transform:none;
  stroke:var(--muted);
}
.search.has-value .clear{display:grid}

/* TOPIC GRID */
.topic-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;
}
@media(min-width:640px){.topic-grid{grid-template-columns:repeat(4,1fr)}}
.topic{
  background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:16px 12px;display:flex;flex-direction:column;align-items:center;
  gap:10px;text-align:center;transition:.15s;box-shadow:var(--sh);
  color:var(--ink);cursor:pointer;border-top:3px solid transparent;
}
.topic:hover{border-color:#CBD5E1;border-top-color:var(--brand);
  transform:translateY(-1px)}
.topic .tp-ic{
  width:44px;height:44px;border-radius:12px;
  display:grid;place-items:center;flex:none;
}
.topic .tp-ic svg{width:22px;height:22px;fill:none;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.topic .tp-ic.brand{background:var(--brandsoft);color:var(--brand);
  stroke:var(--brand)}
.topic .tp-ic.info{background:var(--infobg);color:var(--info)}
.topic .tp-ic.warn{background:var(--warnbg);color:var(--warn)}
.topic .tp-ic.ok{background:var(--okbg);color:var(--ok)}
.topic .tp-ic svg{stroke:currentColor}
.topic b{font-size:13px;font-weight:600;line-height:1.3}
.topic small{font-size:11px;color:var(--muted);line-height:1.3}

/* FAQ */
.faq-group{margin-bottom:14px}
.faq-head{
  font-size:11px;color:var(--muted);font-weight:700;
  text-transform:uppercase;letter-spacing:.06em;
  margin:16px 0 10px;display:flex;align-items:center;gap:8px;
}
.faq-head::after{
  content:"";flex:1;height:1px;background:var(--line);
}
.faq{
  background:#fff;border:1px solid var(--line);border-radius:14px;
  overflow:hidden;box-shadow:var(--sh);
}
.faq-item{border-bottom:1px solid var(--line)}
.faq-item:last-child{border-bottom:0}
.faq-item summary{
  display:flex;align-items:flex-start;gap:12px;padding:14px 15px;
  cursor:pointer;font-size:14px;font-weight:600;line-height:1.45;
  list-style:none;transition:.15s;
}
.faq-item summary::-webkit-details-marker{display:none}
.faq-item summary:hover{background:var(--bg)}
.faq-item summary .q-ic{
  width:26px;height:26px;border-radius:8px;background:var(--brandsoft);
  display:grid;place-items:center;flex:none;margin-top:1px;
  transition:transform .2s;
}
.faq-item summary .q-ic svg{
  width:14px;height:14px;stroke:var(--brand);fill:none;
  stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;
}
.faq-item[open] summary .q-ic{
  background:var(--brand);transform:rotate(90deg);
}
.faq-item[open] summary .q-ic svg{stroke:#fff}
.faq-item summary .q-text{flex:1}
.faq-ans{
  padding:0 15px 15px 53px;font-size:13.5px;color:#334155;
  line-height:1.6;
}
.faq-ans p{margin:0 0 8px}
.faq-ans p:last-child{margin-bottom:0}
.faq-ans a{color:var(--brand);font-weight:600}
.faq-ans ul{margin:4px 0 8px;padding-left:18px;font-size:13px}
.faq-ans li{margin-bottom:3px}

/* CONTACT */
.contact-card{
  background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:16px;margin-bottom:14px;box-shadow:var(--sh);
}
.contact-card h3{
  margin:0 0 12px;font-size:15px;font-weight:700;
  display:flex;align-items:center;gap:9px;
}
.contact-card h3 svg{width:18px;height:18px;stroke:var(--brand);
  fill:none;stroke-width:1.9}
.contact-grid{display:grid;gap:10px}
@media(min-width:560px){.contact-grid{grid-template-columns:1fr 1fr}}
.contact-item{
  display:flex;gap:12px;align-items:flex-start;padding:13px;
  background:var(--bg);border-radius:11px;
  transition:.15s;cursor:pointer;border:1px solid transparent;
}
.contact-item:hover{background:var(--brandsoft);border-color:#B7D8D3}
.contact-item .ct-ic{
  width:36px;height:36px;border-radius:10px;background:#fff;
  display:grid;place-items:center;flex:none;
}
.contact-item .ct-ic svg{width:18px;height:18px;stroke:var(--brand);
  fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.contact-item .ct-l{flex:1;min-width:0}
.contact-item .ct-l b{
  font-size:13.5px;font-weight:600;display:block;margin-bottom:2px;
}
.contact-item .ct-l small{
  font-size:12px;color:var(--muted);display:block;line-height:1.4;
}

/* GRIEVANCE FORM */
.form-row{margin-bottom:14px}
.form-row:last-child{margin-bottom:0}
.form-row label{
  display:block;font-size:13px;font-weight:600;margin-bottom:6px;
  color:#334155;
}
.form-row input,
.form-row select,
.form-row textarea{
  width:100%;padding:11px 13px;border:1px solid var(--line);
  border-radius:10px;background:#fff;font-size:15px;outline:0;
  min-height:46px;transition:.15s;font-family:inherit;
}
.form-row textarea{resize:vertical;min-height:100px;line-height:1.5}
.form-row input:focus,
.form-row select:focus,
.form-row textarea:focus{
  border-color:var(--brand);box-shadow:0 0 0 3px rgba(11,94,85,.12);
}
.form-row.invalid input,
.form-row.invalid select,
.form-row.invalid textarea{border-color:var(--err)}
.form-row .err{
  font-size:12px;color:var(--err);margin-top:4px;display:none;
}
.form-row.invalid .err{display:block}
.form-actions{
  display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;
}
.form-actions .btn{flex:1;min-width:140px}

/* EMPTY STATE */
.empty{
  text-align:center;padding:36px 20px;background:#fff;
  border:1px dashed var(--line);border-radius:14px;margin-bottom:14px;
}
.empty svg{width:44px;height:44px;stroke:var(--muted);fill:none;
  stroke-width:1.4;margin:0 auto 10px;opacity:.5}
.empty h3{font-size:15px;color:var(--ink);margin:0 0 4px}
.empty p{margin:0;font-size:13px;color:var(--muted)}

/* CONFIRM MODAL */
.modal-bg{
  position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:500;
  display:none;align-items:center;justify-content:center;padding:20px;
}
.modal-bg.open{display:flex}
.modal{
  background:#fff;border-radius:16px;padding:22px;max-width:400px;
  width:100%;box-shadow:0 20px 50px -20px rgba(0,0,0,.4);
  animation:pop .25s ease;
}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.modal h3{font-size:16px;margin:0 0 8px;font-weight:700;
  display:flex;align-items:center;gap:9px}
.modal h3 svg{width:20px;height:20px;stroke:var(--ok);fill:none;
  stroke-width:2}
.modal p{margin:0 0 14px;font-size:13.5px;color:var(--muted);
  line-height:1.5}
.modal .ticket{
  background:var(--brandsoft);border-radius:10px;padding:12px;
  font-family:'SF Mono',Menlo,Consolas,monospace;font-size:14px;
  font-weight:700;color:var(--brand);text-align:center;
  letter-spacing:.05em;margin-bottom:14px;
}
.modal .modal-actions{display:flex;gap:10px;flex-wrap:wrap}
.modal .modal-actions .btn{flex:1;min-width:120px}

/* TOAST */
.toast-wrap{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(88px + var(--safeb));z-index:600;
  display:flex;flex-direction:column;gap:8px;pointer-events:none;
  align-items:center;width:calc(100% - 28px);max-width:420px;
}
@media(min-width:1200px){.toast-wrap{bottom:24px}}
.toast{
  background:#0F172A;color:#fff;padding:11px 16px;border-radius:10px;
  font-size:13.5px;font-weight:500;
  box-shadow:0 10px 30px -10px rgba(0,0,0,.35);
  transition:opacity .3s;text-align:center;max-width:100%;
}
.toast.ok{background:var(--ok)}
.toast.err{background:var(--err)}
.toast.warn{background:var(--warn)}

/* JAGO FAB */
.jago-fab{
  position:fixed;right:14px;bottom:calc(78px + var(--safeb));
  width:54px;height:54px;border-radius:50%;
  background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;
  display:grid;place-items:center;
  box-shadow:0 10px 24px -8px rgba(11,94,85,.6);
  z-index:70;border:0;cursor:pointer;
}
.jago-fab svg{width:26px;height:26px;stroke:currentColor;fill:none;
  stroke-width:1.8}
@media(min-width:1200px){
  .jago-fab{bottom:26px;right:26px;width:58px;height:58px}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar" id="topbar"></header>
  <aside class="sidebar" id="sidebar"></aside>
  <main class="content"><div class="wrap" id="page"></div></main>
  <nav class="bottomnav" id="bottomnav"></nav>
</div>

<div class="modal-bg" id="ticketModal">
  <div class="modal">
    <h3 id="ticketTitle"></h3>
    <p id="ticketBody"></p>
    <div class="ticket" id="ticketRef"></div>
    <div class="modal-actions">
      <button class="btn ghost" type="button" id="ticketClose">Close</button>
      <button class="btn primary" type="button" id="ticketCopy">Copy Reference</button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
/* =========================================================
   ICONS
   ========================================================= */
var ICONS = {
  dashboard:'<path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/>',
  schemes:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M8 4v16"/>',

  jago:'<circle cx="12" cy="12" r="9"/><path d="M9 10h.01M15 10h.01M9 15c1.5 1.2 4.5 1.2 6 0"/>',
  notif:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
  profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>',
  check:'<path d="M5 13l4 4L19 7"/>',
  chev:'<path d="M9 6l6 6-6 6"/>',
  chevL:'<path d="M15 6l-6 6 6 6"/>',
  chevR:'<path d="M9 6l6 6-6 6"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  close:'<path d="M18 6L6 18M6 6l12 12"/>',
  book:'<path d="M4 19.5V5a2 2 0 0 1 2-2h11a1 1 0 0 1 1 1v15"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H18"/><path d="M20 5v14"/>',
  grad:'<path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1 2.7 3 6 3s6-2 6-3v-5"/>',
  star:'<path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/>',

function icon(n, cls){
  var p = ICONS[n] || ICONS.info;
  return '<svg class="' + (cls || '') + '" viewBox="0 0 24 24" fill="none" ' +

}

/* =========================================================
   HELPERS
   ========================================================= */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}
function toast(msg, type){
  var w = document.getElementById('toastWrap');
  var t = document.createElement('div');
  t.className = 'toast ' + (type || '');
  t.textContent = msg;
  w.appendChild(t);
  setTimeout(function(){
    t.style.opacity = '0';
    setTimeout(function(){ t.remove(); }, 320);
  }, 2400);
}

/* =========================================================
   BINDINGS
   ========================================================= */
function bindAll(){
  /* Search */
  var si = document.getElementById('searchInput');
  var sw = document.getElementById('searchWrap');
  if(si){
    si.addEventListener('input', function(){
      currentSearch = si.value.trim().toLowerCase();
      sw.classList.toggle('has-value', !!si.value);
      document.getElementById('faqContainer').innerHTML = renderFaqSection();
      bindAll();
    });
  }
  var cs = document.getElementById('clearSearch');
  if(cs){
    cs.addEventListener('click', function(){
      currentSearch = '';
      si.value = '';
      sw.classList.remove('has-value');
      document.getElementById('faqContainer').innerHTML = renderFaqSection();
      bindAll();
      si.focus();
    });
  }

  /* Topic buttons */
  document.querySelectorAll('.topic').forEach(function(b){
    b.addEventListener('click', function(){
      currentCat = b.dataset.cat;
      /* Also set search input to empty */
      currentSearch = '';
      var si2 = document.getElementById('searchInput');
      if(si2) si2.value = '';
      var sw2 = document.getElementById('searchWrap');
      if(sw2) sw2.classList.remove('has-value');
      document.getElementById('faqContainer').innerHTML = renderFaqSection();
      bindAll();
      /* Scroll to FAQ */
      var fc = document.getElementById('faqContainer');
      if(fc){
        var y = fc.getBoundingClientRect().top + window.scrollY - 90;
        window.scrollTo({top:y, behavior:'smooth'});
      }
    });
  });

  /* Contact actions */
  document.querySelectorAll('[data-contact]').forEach(function(el){
    el.addEventListener('click', function(){
      var kind = el.dataset.contact;
      if(kind === 'jago'){
        location.href = 'jago.html';
      } else if(kind === 'email'){
        toast('Email support is a demo feature', 'ok');
      } else if(kind === 'phone'){
        toast('Helpline: 1800-XXX-XXXX (demo)', 'ok');
      } else if(kind === 'office'){
        toast('Contact your state tribal welfare office (demo)', 'ok');
      }
    });
  });

  /* Scroll to grievance */
  var sg = document.getElementById('scrollGrievance');
  if(sg){
    sg.addEventListener('click', function(){
      var g = document.getElementById('grievanceSection');
      if(g){
        var y = g.getBoundingClientRect().top + window.scrollY - 80;
        window.scrollTo({top:y, behavior:'smooth'});
      }
    });
  }

  /* Grievance reset */
  var gr = document.getElementById('g_reset');
  if(gr){
    gr.addEventListener('click', function(){
      ['subject','category','message'].forEach(function(k){
        var el = document.getElementById('g_' + k);
        if(el) el.value = '';
        var row = document.getElementById('row_' + k);
        if(row) row.classList.remove('invalid');
      });
      toast('Form cleared', 'ok');
    });
  }

  /* Grievance submit */
  var gs = document.getElementById('g_submit');
  if(gs){
    gs.addEventListener('click', submitGrievance);
  }
}

/* =========================================================
   GRIEVANCE SUBMIT
   ========================================================= */
function markInvalid(k){
  var row = document.getElementById('row_' + k);
  if(row) row.classList.add('invalid');
}
function clearInvalid(k){
  var row = document.getElementById('row_' + k);
  if(row) row.classList.remove('invalid');
}

function submitGrievance(){
  var subject = (document.getElementById('g_subject').value || '').trim();
  var category = document.getElementById('g_category').value || '';
  var message = (document.getElementById('g_message').value || '').trim();

  var errors = [];

  if(!subject){
    markInvalid('subject');
    errors.push('subject');
  } else clearInvalid('subject');

  if(!category){
    markInvalid('category');
    errors.push('category');
  } else clearInvalid('category');

  if(message.length < 20){
    markInvalid('message');
    errors.push('message');
  } else clearInvalid('message');

  if(errors.length){
    toast('Please complete the highlighted fields', 'err');
    var firstRow = document.getElementById('row_' + errors[0]);
    if(firstRow){
      var y = firstRow.getBoundingClientRect().top + window.scrollY - 100;
      window.scrollTo({top:y, behavior:'smooth'});
    }
    return;
  }

  /* Generate a ticket reference */
  var ref = 'GRV-' + new Date().getFullYear() + '-' +
    String(Math.floor(Math.random() * 90000) + 10000);

  /* Save to notifications as an info entry */
  s.notifications.unshift({
    id: 'n' + Date.now(),
    type: 'info',
    title: 'Grievance submitted',
    body: 'Your grievance (' + ref + ') has been received. We will respond within 5 working days.',
    date: 'Just now',
    read: false,
    action: 'help.html'
  });
  try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){}

  /* Show modal with reference number */
  document.getElementById('ticketTitle').innerHTML = icon('check') + ' Grievance submitted';
  document.getElementById('ticketBody').textContent =
    'Your grievance has been received. Please note the reference number below for tracking.';
  document.getElementById('ticketRef').textContent = ref;
  document.getElementById('ticketModal').classList.add('open');

  /* Reset form */
  ['subject','category','message'].forEach(function(k){
    var el = document.getElementById('g_' + k);
    if(el) el.value = '';
  });

  toast('Grievance submitted successfully', 'ok');
}

/* =========================================================
   MODAL
   ========================================================= */
document.getElementById('ticketClose').addEventListener('click', function(){
  document.getElementById('ticketModal').classList.remove('open');
});
document.getElementById('ticketModal').addEventListener('click', function(e){
  if(e.target === this) this.classList.remove('open');
});
document.getElementById('ticketCopy').addEventListener('click', function(){
  var ref = document.getElementById('ticketRef').textContent;
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(ref);
      toast('Reference copied', 'ok');
    } else {
      toast('Reference: ' + ref, 'ok');
    }
  }catch(e){
    toast('Reference: ' + ref, 'ok');
  }
});

/* =========================================================
   INIT
   ========================================================= */
render();
</script>
