<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B5E55">
<title>Application Details - Tribal Scholarship One</title>
<style>
:root{
  --brand:#0B5E55;--brand2:#0E7C6F;--brandsoft:#E6F2F0;
  --bg:#F4F6F8;--card:#fff;--ink:#0F172A;--muted:#64748B;--line:#E2E8F0;
  --ok:#0F9D58;--okbg:#E7F6EE;--warn:#B45309;--warnbg:#FEF3C7;
  --err:#DC2626;--errbg:#FEE2E2;--info:#1D4ED8;--infobg:#DBEAFE;
  --r:14px;--sh:0 1px 2px rgba(15,23,42,.06),0 8px 24px -14px rgba(15,23,42,.2);
  --safeb:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
svg{display:block}

/* SHELL */
.app{min-height:100dvh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:50;background:var(--brand);color:#fff;
  display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:56px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));
}
.topbar .brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.logo{
  width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.15);
  display:grid;place-items:center;flex:none;
}
.logo svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.brand-t{min-width:0}
.brand-t b{display:block;font-size:14px;line-height:1.15;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;font-weight:600}
.brand-t small{display:block;font-size:11px;opacity:.8;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;gap:4px}
.iconbtn{
  width:38px;height:38px;border-radius:10px;border:0;
  background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;
  cursor:pointer;position:relative;
}
.iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}
.iconbtn .dot-badge{
  position:absolute;top:6px;right:6px;width:8px;height:8px;
  border-radius:50%;background:#FBBF24;border:2px solid var(--brand)
}
.sidebar{display:none}
.bottomnav{
  position:fixed;bottom:0;left:0;right:0;z-index:60;background:#fff;
  border-top:1px solid var(--line);display:flex;
  padding:6px 4px calc(6px + var(--safeb));
  box-shadow:0 -4px 16px -8px rgba(15,23,42,.1);
}
.bn-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 2px;border-radius:10px;color:var(--muted);font-size:10.5px;
  font-weight:500;min-width:0;
}
.bn-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
.bn-item.active{color:var(--brand);background:var(--brandsoft)}
.bn-item span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.content{flex:1;padding:14px 14px calc(88px + var(--safeb));min-width:0}
.wrap{max-width:900px;margin:0 auto}

@media(min-width:768px){
  .content{padding:18px 22px calc(92px + var(--safeb))}
  .bottomnav{padding:8px 12px calc(8px + var(--safeb))}
  .bn-item{font-size:11.5px}.bn-item svg{width:24px;height:24px}
}
@media(min-width:1200px){
  .app{
    display:grid;grid-template-columns:250px 1fr;
    grid-template-rows:auto 1fr;
    grid-template-areas:"top top" "side main";
  }
  .topbar{grid-area:top}
  .sidebar{
    grid-area:side;display:block;background:#fff;
    border-right:1px solid var(--line);padding:14px 12px;
    position:sticky;top:56px;height:calc(100dvh - 56px);overflow-y:auto;
  }
  .sidebar .nav-title{
    font-size:11px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--muted);font-weight:600;padding:12px 12px 6px;
  }
  .sidebar a{
    display:flex;align-items:center;gap:12px;padding:10px 12px;
    border-radius:10px;color:var(--ink);font-size:14px;font-weight:500;
    margin-bottom:2px;
  }
  .sidebar a svg{width:20px;height:20px;stroke:currentColor;fill:none;
    stroke-width:1.8;flex:none}
  .sidebar a:hover{background:var(--bg)}
  .sidebar a.active{background:var(--brandsoft);color:var(--brand);font-weight:600}
  .content{grid-area:main;padding:22px 26px}
  .bottomnav{display:none}
  .wrap{max-width:920px}
}

/* COMMON */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 16px;border-radius:10px;border:1px solid transparent;
  background:#fff;color:var(--ink);font-weight:600;font-size:14px;
  cursor:pointer;line-height:1.2;text-align:center;transition:.15s;
  min-height:44px;
}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:hover{background:#0a4f48}
.btn.ghost{background:#fff;border-color:var(--line)}
.btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn.sm{padding:8px 13px;font-size:13px;min-height:38px}
.btn.xs{padding:6px 11px;font-size:12px;min-height:34px}
.btn.block{width:100%}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;
  stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.badge{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;
  border-radius:999px;font-size:11.5px;font-weight:600;background:#F1F5F9;
  color:#334155;white-space:nowrap;
}
.badge.ok{background:var(--okbg);color:var(--ok)}
.badge.warn{background:var(--warnbg);color:var(--warn)}
.badge.err{background:var(--errbg);color:var(--err)}
.badge.info{background:var(--infobg);color:var(--info)}
.badge.brand{background:var(--brandsoft);color:var(--brand)}
.badge.neutral{background:#F1F5F9;color:#475569}
.muted{color:var(--muted)}
.sm{font-size:13px}
.xs{font-size:11.5px}
.link{color:var(--brand);font-weight:600;font-size:13.5px}

/* HEAD */
.page-head{margin-bottom:14px}
.breadcrumb{
  display:flex;align-items:center;gap:6px;font-size:12px;
  color:var(--muted);margin-bottom:8px;flex-wrap:wrap;
}
.breadcrumb svg{width:12px;height:12px;stroke:currentColor;fill:none;
  stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.page-head h1{font-size:22px;font-weight:700;margin:0 0 6px}
.page-head p{color:var(--muted);font-size:13.5px;margin:0;max-width:640px}

/* HERO */
.detail-hero{
  background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;
  border-radius:16px;padding:20px;margin-bottom:14px;position:relative;
  overflow:hidden;
}
.detail-hero::before{
  content:"";position:absolute;top:-40px;right:-40px;width:200px;height:200px;
  border-radius:50%;background:rgba(255,255,255,.06);
}
.dh-back{
  display:inline-flex;align-items:center;gap:6px;
  color:rgba(255,255,255,.9);font-size:12.5px;font-weight:600;
  margin-bottom:12px;position:relative;z-index:1;
}
.dh-back svg{width:15px;height:15px;stroke:currentColor;fill:none;
  stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.dh-head{display:flex;gap:14px;align-items:flex-start;position:relative;z-index:1}
.dh-ic{
  width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.15);
  display:grid;place-items:center;flex:none;
}
.dh-ic svg{width:26px;height:26px;stroke:#fff;fill:none;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.dh-meta{flex:1;min-width:0}
.dh-meta h1{font-size:19px;margin:0 0 6px;font-weight:700;line-height:1.25}
.dh-meta .dh-id{
  font-size:12.5px;opacity:.9;margin:0 0 10px;font-weight:500;
}
.dh-pills{
  display:flex;flex-wrap:wrap;gap:8px;
}
.dh-pills .pill{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.15);padding:6px 11px;
  border-radius:999px;font-size:11.5px;font-weight:600;
}
.dh-pills .pill svg{width:13px;height:13px;stroke:currentColor;
  fill:none;stroke-width:1.9}

/* PROGRESS HERO */
.dh-progress{
  margin-top:16px;position:relative;z-index:1;
}
.dh-progress .dhl{
  display:flex;justify-content:space-between;font-size:11.5px;
  margin-bottom:6px;opacity:.9;
}
.dh-progress .dhbar{
  height:8px;background:rgba(255,255,255,.2);border-radius:99px;
  overflow:hidden;
}
.dh-progress .dhbar>span{
  display:block;height:100%;background:#fff;border-radius:99px;
  transition:width .5s ease;
}

/* CARD */
.card{
  background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:16px;margin-bottom:14px;box-shadow:var(--sh);
}
.card-h{
  display:flex;align-items:center;gap:10px;margin-bottom:14px;
  flex-wrap:wrap;
}
.card-h .c-ic{
  width:34px;height:34px;border-radius:10px;background:var(--brandsoft);
  display:grid;place-items:center;flex:none;
}
.card-h .c-ic svg{width:18px;height:18px;stroke:var(--brand);fill:none;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.card-h h2{font-size:15px;font-weight:700;margin:0;flex:1}

/* KV GRID */
.kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
@media(min-width:640px){.kv-grid{grid-template-columns:repeat(3,1fr)}}
.kv-grid>div small{
  display:block;font-size:11px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.03em;font-weight:700;
  margin-bottom:2px;
}
.kv-grid>div b{
  font-size:14px;font-weight:600;color:var(--ink);word-break:break-word;
}
.kv-grid>div b.amt{color:var(--brand);font-size:16px;font-weight:700}

/* TIMELINE */
.timeline{
  list-style:none;padding:0;margin:0;position:relative;
}
.timeline::before{
  content:"";position:absolute;left:15px;top:8px;bottom:8px;width:2px;
  background:var(--line);
}
.tl-item{
  position:relative;padding-left:44px;padding-bottom:20px;
}
.tl-item:last-child{padding-bottom:0}
.tl-item .tl-dot{
  position:absolute;left:5px;top:4px;width:22px;height:22px;
  border-radius:50%;background:#fff;border:2px solid var(--line);
  display:grid;place-items:center;z-index:1;
  transition:.2s;
}
.tl-item .tl-dot svg{
  width:12px;height:12px;stroke:transparent;fill:none;
  stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;
}
.tl-item.done .tl-dot{background:var(--ok);border-color:var(--ok)}
.tl-item.done .tl-dot svg{stroke:#fff}
.tl-item.active .tl-dot{background:var(--warnbg);border-color:#F59E0B;
  box-shadow:0 0 0 4px rgba(245,158,11,.18)}
.tl-item.active .tl-dot svg{stroke:var(--warn)}
.tl-item.rejected .tl-dot{background:var(--err);border-color:var(--err)}
.tl-item.rejected .tl-dot svg{stroke:#fff}

.tl-item .tl-title{
  display:flex;justify-content:space-between;align-items:flex-start;
  gap:10px;flex-wrap:wrap;margin-bottom:3px;
}
.tl-item .tl-title b{font-size:14px;font-weight:700;line-height:1.3}
.tl-item .tl-title .badge{flex:none}
.tl-item .tl-desc{
  font-size:12.5px;color:var(--muted);line-height:1.5;margin:0;
}
.tl-item .tl-time{
  font-size:11.5px;color:var(--muted);margin-top:3px;
  display:flex;align-items:center;gap:5px;font-weight:500;
}
.tl-item .tl-time svg{
  width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.2;
}

/* PENDING / DEFICIENCY */
.alert-card{
  background:#fff;border:1.5px solid;border-radius:14px;
  padding:16px;margin-bottom:14px;box-shadow:var(--sh);
}
.alert-card.err{border-color:var(--err);background:#FFF9F9}
.alert-card.warn{border-color:#FCD34D;background:#FFFBEB}
.alert-card.info{border-color:#BFDBFE;background:#F8FBFF}
.alert-card .ac-h{
  display:flex;gap:12px;align-items:flex-start;margin-bottom:12px;
}
.alert-card .ac-ic{
  width:44px;height:44px;border-radius:11px;flex:none;
  display:grid;place-items:center;
}
.alert-card.err .ac-ic{background:var(--errbg);color:var(--err)}
.alert-card.warn .ac-ic{background:var(--warnbg);color:var(--warn)}
.alert-card.info .ac-ic{background:var(--infobg);color:var(--info)}
.alert-card .ac-ic svg{width:22px;height:22px;stroke:currentColor;
  fill:none;stroke-width:1.9}
.alert-card .ac-h-t b{display:block;font-size:15px;font-weight:700;
  margin-bottom:3px}
.alert-card.err .ac-h-t b{color:#7F1D1D}
.alert-card.warn .ac-h-t b{color:#78350F}
.alert-card.info .ac-h-t b{color:#1E3A8A}
.alert-card .ac-h-t small{
  font-size:12.5px;color:var(--muted);line-height:1.45;display:block;
}
.alert-card .ac-actions{
  display:flex;gap:8px;flex-wrap:wrap;
}
.alert-card .ac-actions .btn{flex:1;min-width:130px}

/* MINI INFO */
.mini-info{
  display:flex;gap:11px;align-items:flex-start;padding:11px 13px;
  background:var(--bg);border-radius:10px;font-size:12.5px;
  line-height:1.5;color:#334155;margin-bottom:14px;
}
.mini-info svg{width:16px;height:16px;stroke:var(--brand);
  fill:none;stroke-width:2;flex:none;margin-top:1px}

/* NOT FOUND */
.notfound{
  text-align:center;padding:50px 20px;background:#fff;
  border:1px dashed var(--line);border-radius:16px;
}
.notfound svg{width:52px;height:52px;stroke:var(--muted);fill:none;
  stroke-width:1.4;margin:0 auto 12px;opacity:.5}
.notfound h3{color:var(--ink);font-size:16px;margin:0 0 6px}
.notfound p{margin:0 0 16px;font-size:13.5px;color:var(--muted)}

/* HELP */
.help-block{
  background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:16px;box-shadow:var(--sh);margin-bottom:14px;
}
.help-block h3{
  margin:0 0 12px;font-size:15px;font-weight:700;
  display:flex;align-items:center;gap:9px;
}
.help-block h3 svg{width:18px;height:18px;stroke:var(--brand);fill:none;
  stroke-width:1.9}
.help-block .row-btns{
  display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;
}

/* TOAST */
.toast-wrap{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(88px + var(--safeb));z-index:500;
  display:flex;flex-direction:column;gap:8px;pointer-events:none;
  align-items:center;width:calc(100% - 28px);max-width:420px;
}
@media(min-width:1200px){.toast-wrap{bottom:24px}}
.toast{
  background:#0F172A;color:#fff;padding:11px 16px;border-radius:10px;
  font-size:13.5px;font-weight:500;
  box-shadow:0 10px 30px -10px rgba(0,0,0,.35);
  transition:opacity .3s;text-align:center;max-width:100%;
}
.toast.ok{background:var(--ok)}
.toast.err{background:var(--err)}
.toast.warn{background:var(--warn)}

/* JAGO FAB */
.jago-fab{
  position:fixed;right:14px;bottom:calc(78px + var(--safeb));
  width:54px;height:54px;border-radius:50%;
  background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;
  display:grid;place-items:center;
  box-shadow:0 10px 24px -8px rgba(11,94,85,.6);
  z-index:70;border:0;cursor:pointer;
}
.jago-fab svg{width:26px;height:26px;stroke:currentColor;fill:none;
  stroke-width:1.8}
@media(min-width:1200px){
  .jago-fab{bottom:26px;right:26px;width:58px;height:58px}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar" id="topbar"></header>
  <aside class="sidebar" id="sidebar"></aside>
  <main class="content"><div class="wrap" id="page"></div></main>
  <nav class="bottomnav" id="bottomnav"></nav>
</div>
<div class="toast-wrap" id="toastWrap"></div>

<script>

  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  refresh:'<path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/>',
  upload:'<path d="M12 3v12M7 8l5-5 5 5"/><path d="M3 15v4a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-4"/>',
  arrowR:'<path d="M5 12h14M13 5l7 7-7 7"/>',

function icon(n, cls){

/* =========================================================

   ========================================================= */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}
function fmtMoney(n){
  return 'Rs ' + Number(n || 0).toLocaleString('en-IN');
}
function toast(msg, type){
  var w = document.getElementById('toastWrap');
  var t = document.createElement('div');
  t.className = 'toast ' + (type || '');
  t.textContent = msg;
  w.appendChild(t);
  setTimeout(function(){
    t.style.opacity = '0';
    setTimeout(function(){ t.remove(); }, 320);
  }, 2400);
}
function statusClass(st){
  var m = {
    'Verified':'ok','Approved':'ok','Disbursed':'ok','Paid':'ok','Sanctioned':'ok',
    'Completed':'ok',
    'Submitted':'info','Verification':'info','In progress':'info','Processing':'warn',
    'Pending':'warn',
    'Mismatch':'err','Rejected':'err','Not Eligible':'err'
  };
  return m[st] || 'neutral';
}

/* =========================================================
   TIMELINE BUILDER
   ========================================================= */
function buildTimeline(a){
  var stage = a.stageIndex || 0;
  var isRejected = a.status === 'Rejected';
  var stageDates = generateStageDates(a);

  return STAGES.map(function(st, i){
    var state;
    if(isRejected && i === stage) state = 'rejected';
    else if(i < stage) state = 'done';
    else if(i === stage) state = 'active';
    else state = '';

    var stName = st.label;
    var stDesc = st.desc;
    var stTime = stageDates[i] || 'Pending';
    var stSrc = st.source;

    var badge = '';
    if(state === 'done'){
      badge = '<span class="badge ok">' + icon('check') + ' Completed</span>';
    } else if(state === 'active'){
      badge = '<span class="badge warn">' + icon('clock') + ' In progress</span>';
    } else if(state === 'rejected'){
      badge = '<span class="badge err">' + icon('alert') + ' Rejected</span>';
    } else {
      badge = '<span class="badge neutral">' + icon('clock') + ' Pending</span>';
    }

    return (
      '<li class="tl-item ' + state + '">' +
        '<span class="tl-dot">' + icon(state === 'rejected' ? 'close' : 'check') + '</span>' +
        '<div class="tl-title">' +
          '<b>' + esc(stName) + '</b>' +
          badge +
        '</div>' +
        '<p class="tl-desc">' + esc(stDesc) + '</p>' +
        '<div class="tl-time">' + icon('calendar') + ' ' + esc(stTime) +
          ' <span class="muted">- ' + esc(stSrc) + '</span>' +
        '</div>' +
      '</li>'
    );
  }).join('');
}

function generateStageDates(a){
  /* Generate plausible dates based on stageIndex */
  var base = new Date();
  var submitted = a.submitted || 'Submitted';
  var out = [];
  var offsets = [
    submitted,
    'Verified',   /* 1 */
    'Verified',   /* 2 */
    'Pending',    /* 3 */
    'Pending',    /* 4 */
    'Pending',    /* 5 */
    'Pending'     /* 6 */
  ];

  if(a.stageIndex === 6){
    out = [
      submitted,
      'Completed',
      'Completed',
      'Completed',
      'Sanctioned',
      'Processed',
      'Credited'
    ];
  } else if(a.stageIndex === 5){
    out = [
      submitted,
      'Completed',
      'Completed',
      'Completed',
      'Sanctioned',
      'In progress',
      'Pending'
    ];
  } else if(a.stageIndex === 4){
    out = [
      submitted,
      'Completed',
      'Completed',
      'Completed',
      'Just now',
      'Pending',
      'Pending'
    ];
  } else if(a.stageIndex === 3){
    out = [
      submitted,
      'Completed',
      'Completed',
      'In progress',
      'Pending',
      'Pending',
      'Pending'
    ];
  } else if(a.stageIndex === 2){
    out = [
      submitted,
      'Completed',
      'In progress',
      'Pending',
      'Pending',
      'Pending',
      'Pending'
    ];
  } else if(a.stageIndex === 1){
    out = [
      submitted,
      'In progress',
      'Pending',
      'Pending',
      'Pending',
      'Pending',
      'Pending'
    ];
  } else {
    out = [
      submitted,
      'Pending',
      'Pending',
      'Pending',
      'Pending',
      'Pending',
      'Pending'
    ];
  }
  return out;
}

function dbtRef(a){
  var parts = String(a.id || '').split('-');
  var tail = parts.length ? parts[parts.length - 1] : '0000';
  return 'DBT-' + (a.year || '2025') + '-' + tail;
}
