<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B5E55">
<title>Notifications - Tribal Scholarship One</title>
<style>
:root{
  --brand:#0B5E55;--brand2:#0E7C6F;--brandsoft:#E6F2F0;
  --bg:#F4F6F8;--card:#fff;--ink:#0F172A;--muted:#64748B;--line:#E2E8F0;
  --ok:#0F9D58;--okbg:#E7F6EE;--warn:#B45309;--warnbg:#FEF3C7;
  --err:#DC2626;--errbg:#FEE2E2;--info:#1D4ED8;--infobg:#DBEAFE;
  --r:14px;--sh:0 1px 2px rgba(15,23,42,.06),0 8px 24px -14px rgba(15,23,42,.2);
  --safeb:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
svg{display:block}

/* SHELL */
.app{min-height:100dvh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:50;background:var(--brand);color:#fff;
  display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:56px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));
}
.topbar .brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.logo{
  width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.15);
  display:grid;place-items:center;flex:none;
}
.logo svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.brand-t{min-width:0}
.brand-t b{display:block;font-size:14px;line-height:1.15;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;font-weight:600}
.brand-t small{display:block;font-size:11px;opacity:.8;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;gap:4px}
.iconbtn{
  width:38px;height:38px;border-radius:10px;border:0;
  background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;
  cursor:pointer;position:relative;
}
.iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}
.iconbtn .dot-badge{
  position:absolute;top:6px;right:6px;width:8px;height:8px;
  border-radius:50%;background:#FBBF24;border:2px solid var(--brand)
}
.sidebar{display:none}
.bottomnav{
  position:fixed;bottom:0;left:0;right:0;z-index:60;background:#fff;
  border-top:1px solid var(--line);display:flex;
  padding:6px 4px calc(6px + var(--safeb));
  box-shadow:0 -4px 16px -8px rgba(15,23,42,.1);
}
.bn-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 2px;border-radius:10px;color:var(--muted);font-size:10.5px;
  font-weight:500;min-width:0;
}
.bn-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
.bn-item.active{color:var(--brand);background:var(--brandsoft)}
.bn-item span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.content{flex:1;padding:14px 14px calc(88px + var(--safeb));min-width:0}
.wrap{max-width:900px;margin:0 auto}

@media(min-width:768px){
  .content{padding:18px 22px calc(92px + var(--safeb))}
  .bottomnav{padding:8px 12px calc(8px + var(--safeb))}
  .bn-item{font-size:11.5px}.bn-item svg{width:24px;height:24px}
}
@media(min-width:1200px){
  .app{
    display:grid;grid-template-columns:250px 1fr;
    grid-template-rows:auto 1fr;
    grid-template-areas:"top top" "side main";
  }
  .topbar{grid-area:top}
  .sidebar{
    grid-area:side;display:block;background:#fff;
    border-right:1px solid var(--line);padding:14px 12px;
    position:sticky;top:56px;height:calc(100dvh - 56px);overflow-y:auto;
  }
  .sidebar .nav-title{
    font-size:11px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--muted);font-weight:600;padding:12px 12px 6px;
  }
  .sidebar a{
    display:flex;align-items:center;gap:12px;padding:10px 12px;
    border-radius:10px;color:var(--ink);font-size:14px;font-weight:500;
    margin-bottom:2px;
  }
  .sidebar a svg{width:20px;height:20px;stroke:currentColor;fill:none;
    stroke-width:1.8;flex:none}
  .sidebar a:hover{background:var(--bg)}
  .sidebar a.active{background:var(--brandsoft);color:var(--brand);font-weight:600}
  .content{grid-area:main;padding:22px 26px}
  .bottomnav{display:none}
  .wrap{max-width:920px}
}

/* COMMON */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 16px;border-radius:10px;border:1px solid transparent;
  background:#fff;color:var(--ink);font-weight:600;font-size:14px;
  cursor:pointer;line-height:1.2;text-align:center;transition:.15s;
  min-height:42px;
}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:hover{background:#0a4f48}
.btn.ghost{background:#fff;border-color:var(--line)}
.btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn.sm{padding:8px 13px;font-size:13px;min-height:38px}
.btn.xs{padding:6px 11px;font-size:12px;min-height:34px}
.btn.block{width:100%}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;
  stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.badge{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;
  border-radius:999px;font-size:11.5px;font-weight:600;background:#F1F5F9;
  color:#334155;white-space:nowrap;
}
.badge.ok{background:var(--okbg);color:var(--ok)}
.badge.warn{background:var(--warnbg);color:var(--warn)}
.badge.err{background:var(--errbg);color:var(--err)}
.badge.info{background:var(--infobg);color:var(--info)}
.badge.brand{background:var(--brandsoft);color:var(--brand)}
.badge.neutral{background:#F1F5F9;color:#475569}
.muted{color:var(--muted)}
.sm{font-size:13px}
.xs{font-size:11.5px}
.link{color:var(--brand);font-weight:600;font-size:13.5px}

/* HEAD */
.page-head{margin-bottom:14px}
.breadcrumb{
  display:flex;align-items:center;gap:6px;font-size:12px;
  color:var(--muted);margin-bottom:8px;flex-wrap:wrap;
}
.breadcrumb svg{width:12px;height:12px;stroke:currentColor;fill:none;
  stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.page-head h1{font-size:22px;font-weight:700;margin:0 0 6px}
.page-head p{color:var(--muted);font-size:13.5px;margin:0;max-width:640px}

/* STATS */
.stats{
  display:grid;grid-template-columns:repeat(2,1fr);gap:10px;
  margin-bottom:14px;
}
@media(min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{
  background:#fff;border:1px solid var(--line);border-radius:12px;
  padding:13px;display:flex;gap:11px;align-items:center;
  box-shadow:var(--sh);
}
.stat-ic{
  width:40px;height:40px;border-radius:10px;display:grid;
  place-items:center;flex:none;
}
.stat-ic svg{width:20px;height:20px;stroke:currentColor;fill:none;
  stroke-width:1.8}
.stat-ic.ok{background:var(--okbg);color:var(--ok)}
.stat-ic.info{background:var(--infobg);color:var(--info)}
.stat-ic.warn{background:var(--warnbg);color:var(--warn)}
.stat-ic.err{background:var(--errbg);color:var(--err)}
.stat-ic.brand{background:var(--brandsoft);color:var(--brand)}
.stat b{display:block;font-size:19px;font-weight:700;line-height:1.1}
.stat small{font-size:11.5px;color:var(--muted)}

/* ACTION BAR */
.action-bar{
  display:flex;justify-content:space-between;align-items:center;
  gap:10px;margin-bottom:14px;flex-wrap:wrap;
}
.action-bar .left{
  font-size:13px;color:var(--muted);font-weight:500;
}
.action-bar .left b{color:var(--ink)}
.action-bar .right{
  display:flex;gap:8px;flex-wrap:wrap;
}

/* FILTERS */
.filters{
  display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:14px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.filters::-webkit-scrollbar{display:none}
.filter{
  flex:none;display:inline-flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:999px;background:#fff;
  border:1px solid var(--line);font-size:12.5px;font-weight:600;
  color:var(--ink);cursor:pointer;transition:.15s;white-space:nowrap;
  min-height:38px;
}
.filter svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.filter:hover{border-color:var(--brand);color:var(--brand)}
.filter.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.filter .count{
  background:rgba(0,0,0,.08);padding:1px 6px;border-radius:999px;
  font-size:11px;font-weight:700;
}
.filter.active .count{background:rgba(255,255,255,.22)}

/* NOTIFICATION LIST */
.notif-list{display:grid;gap:10px}
.notif{
  background:#fff;border:1px solid var(--line);border-radius:14px;
  overflow:hidden;box-shadow:var(--sh);transition:.15s;position:relative;
}
.notif:hover{border-color:#CBD5E1}
.notif.unread{border-left:4px solid var(--brand);background:#FCFEFE}
.notif.unread::after{
  content:"";position:absolute;top:14px;right:14px;
  width:8px;height:8px;border-radius:50%;background:var(--brand);
}
.notif-main{
  display:grid;grid-template-columns:44px 1fr;gap:13px;
  padding:14px 40px 14px 14px;
}
.notif-ic{
  width:44px;height:44px;border-radius:11px;display:grid;
  place-items:center;flex:none;align-self:start;
}
.notif-ic.success{background:var(--okbg);color:var(--ok)}
.notif-ic.warn{background:var(--warnbg);color:var(--warn)}
.notif-ic.err{background:var(--errbg);color:var(--err)}
.notif-ic.info{background:var(--infobg);color:var(--info)}
.notif-ic svg{width:22px;height:22px;stroke:currentColor;fill:none;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.notif-body{min-width:0}
.notif-head{
  display:flex;justify-content:space-between;align-items:flex-start;
  gap:10px;margin-bottom:5px;flex-wrap:wrap;
}
.notif-head h3{
  font-size:14.5px;font-weight:700;margin:0;line-height:1.3;flex:1;
  min-width:0;
}
.notif.unread .notif-head h3{color:var(--brand)}
.notif-body p{
  margin:0;font-size:13px;color:#334155;line-height:1.55;
}
.notif-meta{
  display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;
  font-size:11.5px;color:var(--muted);align-items:center;
}
.notif-meta .m-item{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--bg);padding:3px 8px;border-radius:6px;
  font-weight:500;
}
.notif-meta .m-item svg{
  width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.2;
}
.notif-actions{
  display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 12px 71px;
}
.notif-actions .btn{padding:6px 11px;font-size:12px;min-height:34px}
.notif-delete{
  position:absolute;top:12px;right:12px;
  width:30px;height:30px;border-radius:8px;border:1px solid var(--line);
  background:#fff;display:grid;place-items:center;cursor:pointer;
  opacity:.65;transition:.15s;
}
.notif-delete:hover{opacity:1;background:var(--errbg);border-color:#FCA5A5}
.notif-delete svg{width:15px;height:15px;stroke:var(--err);fill:none;
  stroke-width:2}
.notif.unread .notif-delete{top:30px}

@media(max-width:560px){
  .notif-actions{padding-left:71px;padding-right:14px}
}

/* GROUP HEADING */
.group-head{
  font-size:11px;color:var(--muted);font-weight:700;
  text-transform:uppercase;letter-spacing:.06em;
  margin:16px 0 8px;display:flex;align-items:center;gap:8px;
}
.group-head:first-child{margin-top:0}
.group-head::after{
  content:"";flex:1;height:1px;background:var(--line);
}

/* EMPTY */
.empty{
  text-align:center;padding:50px 20px;background:#fff;
  border:1px dashed var(--line);border-radius:16px;
}
.empty svg{width:52px;height:52px;stroke:var(--muted);fill:none;
  stroke-width:1.4;margin:0 auto 12px;opacity:.5}
.empty h3{color:var(--ink);font-size:16px;margin:0 0 6px}
.empty p{margin:0 0 16px;font-size:13.5px;color:var(--muted);
  max-width:400px;margin-left:auto;margin-right:auto}

/* HELP */
.help-block{
  background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:16px;box-shadow:var(--sh);margin-top:14px;
}
.help-block h3{
  margin:0 0 12px;font-size:15px;font-weight:700;
  display:flex;align-items:center;gap:9px;
}
.help-block h3 svg{width:18px;height:18px;stroke:var(--brand);fill:none;
  stroke-width:1.9}
.help-block .row-btns{
  display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;
}

/* CONFIRM MODAL */
.modal-bg{
  position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:500;
  display:none;align-items:center;justify-content:center;padding:20px;
}
.modal-bg.open{display:flex}
.modal{
  background:#fff;border-radius:16px;padding:22px;max-width:380px;
  width:100%;box-shadow:0 20px 50px -20px rgba(0,0,0,.4);
  animation:pop .25s ease;
}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.modal h3{font-size:16px;margin:0 0 8px;font-weight:700}
.modal p{margin:0 0 18px;font-size:13.5px;color:var(--muted);
  line-height:1.5}
.modal .modal-actions{display:flex;gap:10px;flex-wrap:wrap}
.modal .modal-actions .btn{flex:1;min-width:120px}

/* TOAST */
.toast-wrap{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(88px + var(--safeb));z-index:600;
  display:flex;flex-direction:column;gap:8px;pointer-events:none;
  align-items:center;width:calc(100% - 28px);max-width:420px;
}
@media(min-width:1200px){.toast-wrap{bottom:24px}}
.toast{
  background:#0F172A;color:#fff;padding:11px 16px;border-radius:10px;
  font-size:13.5px;font-weight:500;
  box-shadow:0 10px 30px -10px rgba(0,0,0,.35);
  transition:opacity .3s;text-align:center;max-width:100%;
}
.toast.ok{background:var(--ok)}
.toast.err{background:var(--err)}
.toast.warn{background:var(--warn)}

/* JAGO FAB */
.jago-fab{
  position:fixed;right:14px;bottom:calc(78px + var(--safeb));
  width:54px;height:54px;border-radius:50%;
  background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;
  display:grid;place-items:center;
  box-shadow:0 10px 24px -8px rgba(11,94,85,.6);
  z-index:70;border:0;cursor:pointer;
}
.jago-fab svg{width:26px;height:26px;stroke:currentColor;fill:none;
  stroke-width:1.8}
@media(min-width:1200px){
  .jago-fab{bottom:26px;right:26px;width:58px;height:58px}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar" id="topbar"></header>
  <aside class="sidebar" id="sidebar"></aside>
  <main class="content"><div class="wrap" id="page"></div></main>
  <nav class="bottomnav" id="bottomnav"></nav>
</div>

<div class="modal-bg" id="confirmModal">
  <div class="modal">
    <h3>Delete notification?</h3>
    <p>This will remove the notification from your inbox. You cannot undo this action.</p>
    <div class="modal-actions">
      <button class="btn ghost" type="button" onclick="closeConfirm()">Cancel</button>
      <button class="btn primary" type="button" id="confirmDeleteBtn">Delete</button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
/* =========================================================
   ICONS
   ========================================================= */
var ICONS = {
  dashboard:'<path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/>',
  schemes:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M8 4v16"/>',
  apps:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  docs:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
  pay:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',
  jago:'<circle cx="12" cy="12" r="9"/><path d="M9 10h.01M15 10h.01M9 15c1.5 1.2 4.5 1.2 6 0"/>',
  notif:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
  profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>',
  check:'<path d="M5 13l4 4L19 7"/>',
  chev:'<path d="M9 6l6 6-6 6"/>',
  chevL:'<path d="M15 6l-6 6 6 6"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  close:'<path d="M18 6L6 18M6 6l12 12"/>',
  book:'<path d="M4 19.5V5a2 2 0 0 1 2-2h11a1 1 0 0 1 1 1v15"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H18"/><path d="M20 5v14"/>',
  grad:'<path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1 2.7 3 6 3s6-2 6-3v-5"/>',
  star:'<path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/>',
  calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/>',
  bank:'<path d="M3 10l9-6 9 6"/><path d="M5 10v9h14v-9M9 19v-5h6v5"/>',
  help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7"/><path d="M12 17h.01"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/>',
  logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  alert:'<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  refresh:'<path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/>',
  upload:'<path d="M12 3v12M7 8l5-5 5 5"/><path d="M3 15v4a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-4"/>',
  arrowR:'<path d="M5 12h14M13 5l7 7-7 7"/>',
  eye:'<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>',
  trash:'<path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>',
  mail:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/>'
};
function icon(n, cls){
  var p = ICONS[n] || ICONS.info;
  return '<svg class="' + (cls || '') + '" viewBox="0 0 24 24" fill="none" ' +
    'stroke="currentColor" stroke-width="1.8" stroke-linecap="round" ' +
    'stroke-linejoin="round" aria-hidden="true">' + p + '</svg>';
}

/* =========================================================
   HELPERS
   ========================================================= */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}
function toast(msg, type){
  var w = document.getElementById('toastWrap');
  var t = document.createElement('div');
  t.className = 'toast ' + (type || '');
  t.textContent = msg;
  w.appendChild(t);
  setTimeout(function(){
    t.style.opacity = '0';
    setTimeout(function(){ t.remove(); }, 320);
  }, 2400);
}
function typeMeta(type){
  var m = {
    'success':{icon:'check',  cls:'success'},
    'warn':   {icon:'alert',  cls:'warn'},
    'err':    {icon:'alert',  cls:'err'},
    'info':   {icon:'info',   cls:'info'}
  };
  return m[type] || m.info;
}

/* =========================================================
   STATE
   ========================================================= */
var KEY = 'tso_state_v1';
function S(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){
      var p = JSON.parse(raw);
      if(p && p.profile) return p;
    }
  }catch(e){}
  return null;
}
function saveState(){
  try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){}
}

/* =========================================================
   SHELL
   ========================================================= */
var NAV = [
  {id:'dashboard',   label:'Dashboard',    icon:'dashboard', href:'dashboard.html'},
  {id:'schemes',     label:'Schemes',      icon:'schemes',   href:'schemes.html'},
  {id:'applications',label:'Applications', icon:'apps',      href:'my-applications.html'},
  {id:'documents',   label:'Documents',    icon:'docs',      href:'document-wallet.html'},
  {id:'payments',    label:'Payments',     icon:'pay',       href:'payment-status.html'},
  {id:'jago',        label:'JAGO',         icon:'jago',      href:'jago.html'},
  {id:'notifications',label:'Notifications',icon:'notif',    href:'notifications.html'},
  {id:'profile',     label:'Profile',      icon:'profile',   href:'profile.html'}
];
var MOBILE_NAV = ['dashboard','schemes','applications','jago','profile'];

function mountShell(active, crumb){
  var st = S();
  var unread = st ? st.notifications.filter(function(n){ return !n.read; }).length : 0;

  document.getElementById('topbar').innerHTML =
    '<div class="brand">' +
      '<span class="logo">' + icon('shield') + '</span>' +
      '<span class="brand-t">' +
        '<b>Tribal Scholarship One</b>' +
        '<small>' + esc(crumb || 'Unified Scholarship Platform') + '</small>' +
      '</span>' +
    '</div>' +
    '<div class="top-actions">' +
      '<a class="iconbtn" href="notifications.html" aria-label="Notifications">' +
        icon('notif') + (unread ? '<span class="dot-badge"></span>' : '') +
      '</a>' +
      '<a class="iconbtn" href="profile.html" aria-label="Profile">' + icon('user') + '</a>' +
    '</div>';

  document.getElementById('sidebar').innerHTML =
    '<div class="nav-title">Menu</div>' +
    NAV.map(function(n){
      return '<a href="' + n.href + '" class="' + (n.id === active ? 'active' : '') + '">' +
        icon(n.icon) + '<span>' + n.label + '</span>' +
      '</a>';
    }).join('') +
    '<div class="nav-title">Support</div>' +
    '<a href="help.html">' + icon('help') + '<span>Help</span></a>' +
    '<a href="settings.html">' + icon('settings') + '<span>Settings</span></a>' +
    '<a href="index.html" onclick="localStorage.removeItem(\'tso_state_v1\')">' +
      icon('logout') + '<span>Logout</span></a>';

  document.getElementById('bottomnav').innerHTML = MOBILE_NAV.map(function(id){
    var n = NAV.find(function(x){ return x.id === id; });
    return '<a class="bn-item ' + (id === active ? 'active' : '') + '" href="' + n.href + '">' +
      icon(n.icon) + '<span>' + n.label + '</span>' +
    '</a>';
  }).join('');

  if(!document.querySelector('.jago-fab')){
    var f = document.createElement('button');
    f.className = 'jago-fab';
    f.setAttribute('aria-label','Open JAGO assistant');
    f.innerHTML = icon('jago');
    f.onclick = function(){ location.href = 'jago.html'; };
    document.body.appendChild(f);
  }
}

/* =========================================================
   PAGE DATA
   ========================================================= */
var s = S();
if(!s || !s.profile){ location.href = 'index.html'; }
if(!s.notifications) s.notifications = [];

mountShell('notifications', 'Home / Notifications');

var FILTERS = [
  {id:'all',    label:'All',    icon:'notif'},
  {id:'unread', label:'Unread', icon:'mail'},
  {id:'success',label:'Success',icon:'check'},
  {id:'warn',   label:'Alerts', icon:'alert'}
];
var currentFilter = 'all';

function notifMatch(n, f){
  if(f === 'all') return true;
  if(f === 'unread') return !n.read;
  if(f === 'success') return n.type === 'success';
  if(f === 'warn') return n.type === 'warn' || n.type === 'err';
  return true;
}

/* =========================================================
   RENDER
   ========================================================= */
var page = document.getElementById('page');

function metrics(){
  var total = s.notifications.length;
  var unread = s.notifications.filter(function(n){ return !n.read; }).length;
  var success = s.notifications.filter(function(n){ return n.type === 'success'; }).length;
  var alerts = s.notifications.filter(function(n){ return n.type === 'warn' || n.type === 'err'; }).length;
  return {total: total, unread: unread, success: success, alerts: alerts};
}

function notifCard(n){
  var tm = typeMeta(n.type);
  var actionBtn = '';
  if(n.action){
    actionBtn =
      '<a class="btn ghost" href="' + esc(n.action) + '">' +
        icon('eye') + ' View' +
      '</a>';
  }
  var markBtn = '';
  if(!n.read){
    markBtn =
      '<button class="btn ghost" type="button" data-mark="' + esc(n.id) + '">' +
        icon('check') + ' Mark as read' +
      '</button>';
  } else {
    markBtn =
      '<button class="btn ghost" type="button" data-unmark="' + esc(n.id) + '">' +
        icon('mail') + ' Mark as unread' +
      '</button>';
  }

  return (
    '<article class="notif ' + (n.read ? '' : 'unread') + '" data-id="' + esc(n.id) + '">' +
      '<button class="notif-delete" type="button" data-delete="' + esc(n.id) + '" aria-label="Delete notification">' +
        icon('trash') +
      '</button>' +
      '<div class="notif-main">' +
        '<span class="notif-ic ' + tm.cls + '">' + icon(tm.icon) + '</span>' +
        '<div class="notif-body">' +
          '<div class="notif-head">' +
            '<h3>' + esc(n.title) + '</h3>' +
          '</div>' +
          '<p>' + esc(n.body) + '</p>' +
          '<div class="notif-meta">' +
            '<span class="m-item">' + icon('clock') + ' ' + esc(n.date) + '</span>' +
            (n.read
              ? '<span class="m-item">' + icon('check') + ' Read</span>'
              : '<span class="m-item" style="color:var(--brand)">' + icon('mail') + ' Unread</span>'
            ) +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="notif-actions">' +
        actionBtn +
        markBtn +
      '</div>' +
    '</article>'
  );
}

function renderFilters(){
  return FILTERS.map(function(f){
    var count = 0;
    if(f.id === 'all') count = s.notifications.length;
    else count = s.notifications.filter(function(n){ return notifMatch(n, f.id); }).length;
    return (
      '<button class="filter ' + (currentFilter === f.id ? 'active' : '') + '" data-filter="' + f.id + '" type="button">' +
        icon(f.icon) + '<span>' + f.label + '</span><span class="count">' + count + '</span>' +
      '</button>'
    );
  }).join('');
}

function renderList(){
  var filtered = s.notifications.filter(function(n){ return notifMatch(n, currentFilter); });
  if(!filtered.length){
    return (
      '<div class="empty">' +
        icon('notif') +
        '<h3>' + (s.notifications.length ? 'No notifications in this view' : 'No notifications yet') + '</h3>' +
        '<p>' + (s.notifications.length
          ? 'Try a different filter to see more notifications.'
          : 'You will see application updates, verification alerts, and payment notifications here.') +
        '</p>' +
      '</div>'
    );
  }

  var unread = filtered.filter(function(n){ return !n.read; });
  var read = filtered.filter(function(n){ return n.read; });
  var html = '';

  if(unread.length){
    html += '<div class="group-head">Unread (' + unread.length + ')</div>';
    html += '<div class="notif-list">' + unread.map(notifCard).join('') + '</div>';
  }
  if(read.length){
    html += '<div class="group-head">Earlier (' + read.length + ')</div>';
    html += '<div class="notif-list">' + read.map(notifCard).join('') + '</div>';
  }
  return html;
}

function render(){
  var m = metrics();
  page.innerHTML =
    '<div class="page-head">' +
      '<nav class="breadcrumb" aria-label="Breadcrumb">' +
        '<a href="dashboard.html">Home</a>' + icon('chev') +
        '<span>Notifications</span>' +
      '</nav>' +
      '<h1>Notifications</h1>' +
      '<p>All updates about your applications, documents, verifications, sanctions and payments.</p>' +
    '</div>' +

    '<section class="stats">' +
      '<div class="stat">' +
        '<span class="stat-ic brand">' + icon('notif') + '</span>' +
        '<div><b>' + m.total + '</b><small>Total</small></div>' +
      '</div>' +
      '<div class="stat">' +
        '<span class="stat-ic info">' + icon('mail') + '</span>' +
        '<div><b>' + m.unread + '</b><small>Unread</small></div>' +
      '</div>' +
      '<div class="stat">' +
        '<span class="stat-ic ok">' + icon('check') + '</span>' +
        '<div><b>' + m.success + '</b><small>Success</small></div>' +
      '</div>' +
      '<div class="stat">' +
        '<span class="stat-ic warn">' + icon('alert') + '</span>' +
        '<div><b>' + m.alerts + '</b><small>Alerts</small></div>' +
      '</div>' +
    '</section>' +

    '<div class="action-bar">' +
      '<span class="left">' + (m.unread ? '<b>' + m.unread + '</b> unread notification' + (m.unread > 1 ? 's' : '') : 'All caught up') + '</span>' +
      '<div class="right">' +
        (m.unread ? '<button class="btn ghost sm" type="button" id="markAllBtn">' + icon('check') + ' Mark all as read</button>' : '') +
        (s.notifications.length ? '<button class="btn ghost sm" type="button" id="clearReadBtn">' + icon('trash') + ' Clear read</button>' : '') +
      '</div>' +
    '</div>' +

    '<div class="filters" role="tablist" aria-label="Filter notifications">' + renderFilters() + '</div>' +

    '<div id="notifContainer">' + renderList() + '</div>' +

    '<section class="help-block">' +
      '<h3>' + icon('help') + ' Managing notifications</h3>' +
      '<p class="muted sm" style="margin:0">You can control which notifications you receive in <a class="link" href="settings.html">Settings</a>. JAGO can also explain any notification you receive.</p>' +
      '<div class="row-btns">' +
        '<a class="btn ghost sm" href="settings.html">' + icon('settings') + ' Notification settings</a>' +
        '<a class="btn ghost sm" href="jago.html">' + icon('jago') + ' Ask JAGO</a>' +
      '</div>' +
    '</section>';

  bindAll();
}

/* =========================================================
   CONFIRM MODAL
   ========================================================= */
var pendingDeleteId = null;

function openConfirm(id){
  pendingDeleteId = id;
  document.getElementById('confirmModal').classList.add('open');
}
function closeConfirm(){
  pendingDeleteId = null;
  document.getElementById('confirmModal').classList.remove('open');
}

document.getElementById('confirmModal').addEventListener('click', function(e){
  if(e.target === this) closeConfirm();
});

document.getElementById('confirmDeleteBtn').addEventListener('click', function(){
  if(!pendingDeleteId) return;
  var id = pendingDeleteId;
  s.notifications = s.notifications.filter(function(n){ return n.id !== id; });
  saveState();
  closeConfirm();
  /* Re-render */
  var current = currentFilter;
  render();
  currentFilter = current;
  /* restore active filter */
  document.querySelectorAll('.filter').forEach(function(b){
    b.classList.toggle('active', b.dataset.filter === current);
  });
  document.getElementById('notifContainer').innerHTML = renderList();
  bindAll();
  toast('Notification deleted', 'ok');
});

/* =========================================================
   BINDINGS
   ========================================================= */
function bindAll(){
  /* Filters */
  document.querySelectorAll('.filter').forEach(function(btn){
    btn.addEventListener('click', function(){
      currentFilter = btn.dataset.filter;
      document.querySelectorAll('.filter').forEach(function(b){
        b.classList.toggle('active', b === btn);
      });
      document.getElementById('notifContainer').innerHTML = renderList();
      bindAll();
    });
  });

  /* Mark as read */
  document.querySelectorAll('[data-mark]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var id = btn.dataset.mark;
      var n = s.notifications.find(function(x){ return x.id === id; });
      if(!n) return;
      n.read = true;
      saveState();
      refreshUI();
      toast('Marked as read', 'ok');
    });
  });

  /* Mark as unread */
  document.querySelectorAll('[data-unmark]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var id = btn.dataset.unmark;
      var n = s.notifications.find(function(x){ return x.id === id; });
      if(!n) return;
      n.read = false;
      saveState();
      refreshUI();
      toast('Marked as unread', 'ok');
    });
  });

  /* Delete */
  document.querySelectorAll('[data-delete]').forEach(function(btn){
    btn.addEventListener('click', function(){
      openConfirm(btn.dataset.delete);
    });
  });

  /* Mark all */
  var markAllBtn = document.getElementById('markAllBtn');
  if(markAllBtn){
    markAllBtn.addEventListener('click', function(){
      s.notifications.forEach(function(n){ n.read = true; });
      saveState();
      refreshUI();
      toast('All notifications marked as read', 'ok');
    });
  }

  /* Clear read */
  var clearReadBtn = document.getElementById('clearReadBtn');
  if(clearReadBtn){
    clearReadBtn.addEventListener('click', function(){
      if(!confirm('Remove all read notifications?')) return;
      s.notifications = s.notifications.filter(function(n){ return !n.read; });
      saveState();
      refreshUI();
      toast('Read notifications cleared', 'ok');
    });
  }
}

function refreshUI(){
  var m = metrics();
  /* Update stats */
  var stats = document.querySelectorAll('.stat b');
  if(stats.length >= 4){
    stats[0].textContent = m.total;
    stats[1].textContent = m.unread;
    stats[2].textContent = m.success;
    stats[3].textContent = m.alerts;
  }
  /* Update filter counts */
  document.querySelectorAll('.filter').forEach(function(btn){
    var f = btn.dataset.filter;
    var c = btn.querySelector('.count');
    if(!c) return;
    if(f === 'all') c.textContent = m.total;
    else if(f === 'unread') c.textContent = m.unread;
    else if(f === 'success') c.textContent = m.success;
    else if(f === 'warn') c.textContent = m.alerts;
  });
  /* Update action bar */
  var leftEl = document.querySelector('.action-bar .left');
  if(leftEl){
    leftEl.innerHTML = m.unread
      ? '<b>' + m.unread + '</b> unread notification' + (m.unread > 1 ? 's' : '')
      : 'All caught up';
  }
  /* Update topbar dot */
  var topDot = document.querySelector('.topbar .dot-badge');
  if(topDot && m.unread === 0) topDot.remove();
  if(!topDot && m.unread > 0){
    var btn = document.querySelector('.topbar .iconbtn');
    if(btn) btn.insertAdjacentHTML('beforeend', '<span class="dot-badge"></span>');
  }
  /* Update list */
  document.getElementById('notifContainer').innerHTML = renderList();
  /* Re-render action buttons (may be removed) */
  var markAllWrap = document.querySelector('.action-bar .right');
  if(markAllWrap){
    markAllWrap.innerHTML =
      (m.unread ? '<button class="btn ghost sm" type="button" id="markAllBtn">' + icon('check') + ' Mark all as read</button>' : '') +
      (m.total ? '<button class="btn ghost sm" type="button" id="clearReadBtn">' + icon('trash') + ' Clear read</button>' : '');
  }
  bindAll();
}

/* =========================================================
   INIT
   ========================================================= */
render();
</script>
  <script src="lang.js"></script>
</body>
